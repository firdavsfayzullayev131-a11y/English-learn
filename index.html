t the changes to the evening buses and the ticket price. • Say how you feel about the news. • Ask how they plan to travel now.","s11":"Hi Sanjar,\nHope everything's going well with you. Just received a message from the transport company, and I'm really upset. They're going to stop the last evening buses and increase ticket prices by 10%. I don't know how I'll get home after work now. How are you going to travel?\nTake care, Abror\n(53 words)","t12":"Write 120–150 words Write an email to the transport company. • Give your opinion about stopping the last evening buses. • Explain what problems the price increase may cause for passengers. • Suggest what the company could do to improve the service.","s12":"Dear Sir or Madam,\nI am writing to express my concern about the planned changes to the city bus service.\nIn my opinion, stopping the last evening buses would be a serious mistake. Many passengers, including me, finish work or classes late in the evening. Without these buses, we will have to take expensive taxis or walk home in the dark, which is not safe.\nMoreover, the 10% price increase may cause difficulties for students and older people with limited incomes. As I use the bus twice a day, this increase will significantly affect my monthly budget.\nTherefore, I kindly request that you keep at least one late bus on the busiest routes. As for the mobile card, I believe it is a great idea, but discounts for regular passengers would make it even more useful.\nThank you for your attention to this matter.\nYours faithfully, Abror Rahmatullayev\n(148 words)","q2":"You are participating in an online discussion for language learners.\nThe question is: “Will robots take our future jobs?”\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK YES, ROBOTS WILL TAKE JOBS","pro":["Machines work faster, cheaper and without breaks.","Factory, transport and cashier jobs are at risk.","AI can now write, translate and answer customers.","Companies want to cut costs."],"ch":"NO, NEW JOBS WILL APPEAR","con":["Robots must be designed, programmed and repaired.","Demand for IT specialists keeps growing.","Creative and caring jobs are hard to automate.","Technology has always created new professions. embly lines have replaced many workers. ds of jobs for young programmers."],"ex":["Self-service checkouts and automated assembly lines have replaced many workers.","IT Park in Uzbekistan has created thousands of jobs for young programmers."],"s2":"With rapid advances in artificial intelligence, many people fear that robots will soon take over human jobs. In my opinion, while automation will replace certain occupations, it will also create new ones.\nOn the one hand, robots are likely to replace many routine jobs. This is because machines can perform repetitive tasks faster and without breaks, which reduces costs for employers. As a result, workers in manufacturing, transport and customer service may lose their positions. For example, self-service checkouts in supermarkets and automated assembly lines in car factories have already reduced the need for cashiers and factory workers.\nOn the other hand, technological progress has always generated new types of employment. Since robots need to be designed, programmed and maintained, demand for engineers and IT specialists continues to grow. Moreover, jobs requiring creativity and empathy, such as teaching and nursing, cannot easily be automated. Consequently, the labour market is expected to transform rather than disappear. For instance, IT Park in Uzbekistan has created thousands of jobs for young programmers in recent years.\nIn conclusion, although robots will take over many routine tasks, I believe they will not take all our future jobs, as they will also open up new opportunities.\n(200 words)","wd":[["cause difficulties","qiyinchiliklarga sabab bo‘lmoq"],["limited incomes","cheklangan daromad"],["significantly affect","sezilarli ta’sir ko‘rsatmoq"],["the busiest routes","eng gavjum yo‘nalishlar"],["rapid advances in artificial intelligence","sun’iy intellektdagi jadal yutuqlar"],["take over","egallab olmoq"],["automation","avtomatlashtirish"],["occupations","kasblar"],["routine jobs","bir xil takrorlanuvchi ishlar"],["repetitive tasks","takroriy vazifalar"],["reduces costs for employers","ish beruvchilar xarajatini kamaytiradi"],["manufacturing","ishlab chiqarish"],["customer service","mijozlarga xizmat ko‘rsatish"],["self-service checkouts","o‘z-o‘ziga xizmat kassalari"],["automated assembly lines","avtomatlashtirilgan yig‘uv liniyalari"],["technological progress","texnologik taraqqiyot"],["generated new types of employment","yangi turdagi ish o‘rinlarini yaratdi"],["designed, programmed and maintained","loyihalanadi, dasturlanadi va texnik xizmat ko‘rsatiladi"],["cannot easily be automated","osonlikcha avtomatlashtirib bo‘lmaydi"],["the labour market","mehnat bozori"],["transform rather than disappear","yo‘qolish o‘rniga o‘zgaradi"],["open up new opportunities","yangi imkoniyatlar ochmoq"]]},{"title":"Neighbourhood Park Renovation","topic":"Modern Libraries or Sports Gyms?","sit":"You live near a public park. You received a letter from the city council.\n\nDear Resident,\nWe are planning to renovate the park in your neighbourhood next spring. Part of the green area may be used for a new car park, and we would like to add lighting, benches and a children’s playground. Which facilities would be most useful for local people? What do you think about using part of the park for cars? When would be the best time to carry out the work?\nKind regards,\nThe City Council","t11":"Write about 50 words Write a short note to your neighbour who also visits the park. • Tell them what the council is planning. • Say which facilities you would like to see. • Ask what they think about the new car park.","s11":"Hi Gulnora,\nHope you're doing well. I thought you'd like to know about a letter I got from the city council about improving the park, and I'm glad. They're going to renovate our park next spring. I'd like to see benches and a children's playground. But they also want to build a car park. What do you think about it?\nAll the best, Abror\n(64 words)","t12":"Write 120–150 words Write a letter to the city council. • Give your opinion about the renovation plan. • Explain what you think about using part of the green area for a car park. • Suggest which facilities should be added and when the work should be done.","s12":"Dear Sir or Madam,\nI am writing in response to your letter about the renovation of the park in our neighbourhood.\nI appreciate this plan because the park is old and needs some improvements. Many families with children and older people visit it every day, so a renovation would be useful for local residents.\nHowever, I am not satisfied with the idea of using part of the green area for a car park. In my opinion, the park is one of the few places where people can breathe fresh air. Therefore, the car park should be built outside the park.\nAs for the facilities, I believe lighting and a children's playground should be added first, as they would make the park safer. Moreover, the work should be done in early spring, before families start visiting the park more often.\nI look forward to your reply.\nYours faithfully, Abror Rahmatullayev\n(149 words)","q2":"Should schools spend more money on building modern libraries or\nnew sports gyms?\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK MODERN LIBRARIES","pro":["Support learning in every subject.","Quiet places to study and do research.","Computers and new books for all pupils.","Build reading habits for life."],"ch":"NEW SPORTS GYMS","con":["Keep pupils fit and healthy.","Reduce stress after long lessons.","Help find and train talented athletes.","Teach teamwork through school sports. es who compete nationally. pupils to pay for private tutors."],"ex":["Schools with modern gyms produce athletes who compete nationally.","Rural schools with outdated libraries force pupils to pay for private tutors."],"s2":"Schools often face difficult decisions about how to allocate their limited budgets. In my view, modern libraries deserve more funding than sports gyms, although sports facilities also play an important role in pupils' lives.\nOn the one hand, new sports gyms bring significant benefits. This is because a well-equipped gym encourages pupils to exercise regularly, which improves their fitness and helps them release stress. As a result, students become healthier and more energetic in class, and fewer of them develop weight problems. For example, schools with modern gyms often produce talented athletes who go on to represent their regions in national competitions.\nHowever, modern libraries contribute more directly to the main purpose of schools, which is education. Since a library with computers, up-to- date books and quiet study areas gives every pupil access to knowledge, it supports learning in all subjects. Consequently, reading habits, research skills and exam results tend to improve. For instance, many rural schools in Uzbekistan still have outdated libraries, forcing students to depend on expensive private tutors.\nIn conclusion, although sports gyms promote health, I believe schools should spend more money on modern libraries because they directly enhance pupils' academic achievement.\n(194 words)","wd":[["local residents","mahalliy aholi"],["breathe fresh air","toza havodan nafas olmoq"],["children's playground","bolalar maydonchasi"],["would make the park safer","bog‘ni xavfsizroq qiladi"],["allocate their limited budgets","cheklangan byudjetini taqsimlamoq"],["deserve more funding","ko‘proq mablag‘ga loyiq"],["sports facilities","sport inshootlari"],["well-equipped","yaxshi jihozlangan"],["improves their fitness","jismoniy holatini yaxshilaydi"],["release stress","stressdan xalos bo‘lmoq"],["energetic","g‘ayratli"],["weight problems","ortiqcha vazn muammolari"],["represent their regions","o‘z viloyatini himoya qilmoq (vakil bo‘lmoq)"],["national competitions","respublika musobaqalari"],["contribute more directly to","... ga bevositaroq hissa qo‘shadi"],["up-to-date books","zamonaviy kitoblar"],["quiet study areas","jim o‘qish joylari"],["reading habits","kitob o‘qish odati"],["research skills","tadqiqot ko‘nikmalari"],["outdated","eskirgan"],["private tutors","xususiy repetitorlar"],["academic achievement","o‘quv yutuqlari"]]},{"title":"Office Relocation","topic":"Free Higher Education for Everyone?","sit":"You work for a company that is moving to a new office. You received a message from your manager.\n\nDear Colleague,\nFrom September our office will move to a new building outside the city centre. The new office is larger and quieter, but the journey will take longer for most staff. We are considering a free shuttle bus and a later starting time. How do you feel about the move? What problems might the new location cause? What support would help employees most?\nKind regards,\nThe Office Manager","t11":"Write about 50 words Write a short email to your colleague. • Tell them about the move to the new office. • Explain how you feel about the longer journey. • Ask whether they would prefer the shuttle bus or a later starting time.","s11":"Hi Rustam,\nIt was great to hear from you. I received a message from the office manager. From September, our office will move outside the city centre, so the journey will take much longer for me. So, I'm a bit worried. Would you prefer a free shuttle bus or a later starting time?\nSee you soon, Abror\n(57 words)","t12":"Write 120–150 words Write an email to the office manager. • Describe your opinion about moving to the new building. • Explain the problems the new location may cause for staff. • Suggest what support the company should offer employees.","s12":"Dear Sir or Madam,\nI would like to provide some details regarding the move to our new office building.\nIn general, I believe the move is a good decision. A larger and quieter office would allow staff to concentrate better and work more effectively.\nHowever, the new location may cause some problems for employees. Most of us live in the city centre, so the journey will take much longer. Moreover, there are not many buses to that area, which means some staff may arrive late or feel tired before the working day starts.\nTherefore, I would be grateful if you could provide a free shuttle bus from the city centre. In other words, employees would not have to spend extra money and time on transport. A later starting time would also be helpful for those who live far away.\nI look forward to your reply.\nYours faithfully, Abror Rahmatullayev\n(149 words)","q2":"Should higher education be free for everyone?\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK ARGUMENTS FOR","pro":["Equal chance for talented students from poor families.","Educated people earn and pay more taxes.","A more skilled workforce helps the economy.","Fewer graduates in debt."],"ch":"ARGUMENTS AGAINST","con":["Very expensive for the state budget.","Students may value free education less.","Universities could become overcrowded.","Money may be needed more for schools and hospitals. give up because they cannot pay contract fees. niversities."],"ex":["Gifted school leavers without a state grant give up because they cannot pay contract fees.","Germany abolished tuition fees at public universities."],"s2":"Whether higher education should be free for everyone is a widely debated issue. In my opinion, university education should be free, as it promotes equal opportunities and benefits society as a whole.\nThe main reason why university education should be free is that it guarantees equal access to learning. This is because high tuition fees prevent many talented students from low-income families from entering university, regardless of their abilities. As a result, opportunities become dependent on wealth rather than merit. For example, in Uzbekistan, many gifted school leavers who fail to win a state grant have to give up their studies because their families cannot afford contract fees.\nWhile I acknowledge that free education would place a heavy burden on the state budget, it is a long-term investment in the nation's future. Since educated citizens earn more, pay more taxes and contribute to innovation, governments eventually recover the costs. Consequently, the whole economy benefits from a more skilled workforce. For instance, Germany abolished tuition fees at public universities and remains among Europe's most innovative economies.\nIn conclusion, I believe higher education should be free for everyone, because it ensures equal opportunities and strengthens the economy in the long run.\n(199 words)","wd":[["concentrate better","yaxshiroq diqqatini jamlamoq"],["work more effectively","samaraliroq ishlamoq"],["the new location","yangi joylashuv"],["a free shuttle bus","bepul xizmat avtobusi"],["a later starting time","kechroq boshlanish vaqti"],["a widely debated issue","keng muhokama qilinadigan masala"],["society as a whole","butun jamiyat"],["equal access to learning","ta’limga teng imkoniyat"],["high tuition fees","yuqori o‘qish to‘lovlari"],["dependent on wealth rather than merit","qobiliyatga emas, boylikka bog‘liq"],["gifted school leavers","iqtidorli bitiruvchilar"],["win a state grant","davlat grantini yutmoq"],["give up their studies","o‘qishdan voz kechmoq"],["contract fees","kontrakt to‘lovlari"],["the state budget","davlat byudjeti"],["a long-term investment","uzoq muddatli sarmoya"],["contribute to innovation","innovatsiyaga hissa qo‘shmoq"],["recover the costs","xarajatlarni qoplamoq"],["a more skilled workforce","malakaliroq ishchi kuchi"],["abolished","bekor qildi"],["public universities","davlat universitetlari"],["innovative economies","innovatsion iqtisodiyotlar"]]},{"title":"New Recycling Rules","topic":"Working from Home vs the Office","sit":"You live in an apartment building. You received a notice from the building administration.\n\nDear Resident,\nFrom next month we will place separate bins for paper, plastic and food waste in the yard. Residents who do not sort their rubbish correctly may be asked to pay a small additional fee. How do you feel about the new rules? What difficulties might residents have? What could the administration do to help everyone follow the system?\nBest wishes,\nThe Building Administration","t11":"Write about 50 words Write a short note to your neighbour. • Tell them about the new recycling bins. • Say how you feel about the additional fee. • Ask whether they think the rules will work.","s11":"Hi Nargiza,\nHope you're doing well. Guess what? I received a notice from the building administration about a new policy, and I think it's a good idea. From next month, there will be separate bins for paper, plastic and food waste. But I don't like the extra fee for people who make mistakes. Do you think these rules will work?\nTake care, Abror\n(63 words)","t12":"Write 120–150 words Write a letter to the building administration. • Give your opinion about the new recycling system. • Explain what difficulties residents may face. • Suggest how the administration could help people sort their waste correctly.","s12":"Dear Sir or Madam,\nI would like to provide some details regarding the new recycling system in our building, as requested in your notice.\nI am extremely happy about this change because sorting rubbish is good for the environment. If every building did this, our city would become much cleaner.\nHowever, residents may face some difficulties. For example, older people may not know which bin to use for each type of waste. Moreover, the additional fee may seem unfair to those who make mistakes at the beginning.\nTherefore, I would be grateful if you could put clear signs with pictures on each bin. In other words, people would understand the system quickly. It would also be helpful to hold a short meeting for residents and to start charging the fee only after the first month.\nI look forward to your reply.\nYours faithfully, Abror Rahmatullayev\n(145 words)","q2":"Some people believe working from home is better than working in\nan office, while others disagree. What is your opinion?\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK WORKING FROM HOME","pro":["No daily commute — saves time and money.","Flexibility and a better work-life balance.","Fewer interruptions from colleagues.","Companies save money on office space."],"ch":"WORKING IN AN OFFICE","con":["Colleagues exchange ideas and solve problems quickly.","Young staff learn from experienced ones.","A clear line between work and home life.","Less risk of feeling isolated. than an hour in traffic every day. e days in the office."],"ex":["In Tashkent, many employees spend more than an hour in traffic every day.","A hybrid policy: two days at home and three days in the office."],"s2":"Opinions vary as to whether working from home is preferable to working in an office. In my opinion, remote work is more beneficial for most employees, although offices still have certain merits.\nOn the one hand, offices offer some benefits. This is because colleagues sitting together can exchange ideas and solve problems immediately, and young employees can learn directly from experienced ones. As a result, teamwork becomes more efficient and employees are less likely to feel isolated. For example, a new employee can simply ask a colleague at the next desk for help instead of sending an email.\nOn the other hand, working from home has more significant advantages. Firstly, employees do not need to commute, which saves both time and money. Since they spend less energy travelling, they can concentrate better on their tasks and enjoy a healthier work-life balance. Consequently, both their productivity and job satisfaction may increase. For example, in Tashkent, many employees spend more than an hour in traffic every day. Furthermore, companies can cut costs on office space.\nIn conclusion, although offices encourage teamwork, I believe working from home is better because it saves time and money and offers a healthier work-life balance.\n(198 words)","wd":[["recycling system","qayta ishlash tizimi"],["sorting rubbish","axlatni saralash"],["face some difficulties","ba’zi qiyinchiliklarga duch kelmoq"],["type of waste","chiqindi turi"],["start charging the fee","to‘lov olishni boshlamoq"],["remote work","masofaviy ish"],["still have certain merits","hali ham ma’lum afzalliklarga ega"],["exchange ideas","fikr almashmoq"],["learn directly from experienced ones","tajribalilardan bevosita o‘rganmoq"],["feel isolated","o‘zini yolg‘iz his qilmoq"],["commute","ishga qatnamoq"],["a healthier work-life balance","ish va shaxsiy hayot o‘rtasidagi sog‘lomroq muvozanat"],["productivity","mahsuldorlik"],["job satisfaction","ishdan qoniqish"],["cut costs","xarajatlarni qisqartirmoq"],["office space","ofis maydoni"]]}],"s":[{"p11":[{"q":"What do you usually do in the evening?","a":"In the evening, I usually try to unwind after a long and productive day. I often spend some time reviewing my work or planning what I need to do the next day. After that, I prefer doing something relaxing, like watching an interesting video, listening to music, or occasionally reading a book. These activities help me clear my mind and feel more relaxed before going to sleep."},{"q":"Do you prefer playing sports or watching sports?","a":"I definitely prefer playing sports rather than simply watching them. Being physically active makes me feel more energetic and refreshed. For instance, I sometimes play football with my friends, and it’s both fun and a great way to stay healthy. Watching sports can be enjoyable, especially during big tournaments, but in my opinion it’s much more exciting to actually take part in the game."},{"q":"Can you describe a park in your city?","a":"Yes, there is a well-known park in my city that many residents like to visit. It’s quite spacious and full of trees, which creates a calm and refreshing atmosphere. People often go there to walk, exercise, or simply spend time with their families and friends. There are also benches and small cafés where visitors can relax and enjoy the peaceful environment."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different ways of making payments. In the first image, there is a woman holding several banknotes in front of her face. She seems to be looking to one side while holding the cash with both hands. In the second image, a person is making a payment using a bank card and a card machine. Another person is holding the payment terminal, probably in a shop or store."},{"q":"Which do you think is more convenient: paying with cash or paying with a card?","a":"In my opinion, paying with a card is generally more convenient. It allows people to complete transactions quickly without carrying large amounts of cash. In addition, many cards now support contactless payments, which makes the process even faster. However, cash can still be useful in small shops or in situations where electronic systems are unavailable."},{"q":"Do you think cash will disappear in the future because of card and digital payments?","a":"I do not believe cash will completely disappear in the near future. Although digital and card payments are becoming more common, many people still rely on cash for everyday purchases. In addition, some regions do not have reliable access to electronic payment systems. For this reason, cash will probably continue to exist alongside digital payment methods for quite a long time."}],"p2":{"prompts":["Tell me about a moment when you felt truly free.","What made that moment special for you?","How did this experience influence your thoughts or feelings afterward?"],"a":"One moment when I felt truly free was during a quiet evening walk after finishing a very demanding period of study. I had been preparing for several important exams, so my routine had been quite stressful and tightly organized. When everything was finally over, I decided to go for a walk in a nearby park. The weather was calm, the air felt fresh, and there were only a few people around, which created a very peaceful atmosphere. At that moment, I realized that I had no deadlines or pressure, and it gave me a strong sense of freedom. What made that moment especially meaningful was the feeling of relief and calmness I experienced. After weeks of concentrating on my studies, my mind had finally relaxed. I could enjoy simple things such as the cool breeze, the quiet environment, and the beautiful colors of the evening sky. It reminded me that freedom is sometimes found in very ordinary moments. After that experience, my perspective on daily life changed slightly. I began to understand that focusing only on work or study can make people feel exhausted over time. Since then, I have tried to create a healthier balance by taking short breaks and spending time on relaxing activities. This helps me stay more positive, refreshed, and motivated in my daily routine."},"p3":{"topic":"The differences between public and private transportation?","for":["cheaper for individuals and reduces daily travel costs","decreases traffic congestion in cities","more environmentally friendly because fewer cars are used"],"against":["less comfort and privacy compared to private vehicles","limited schedules and routes","often crowded during peak hours"],"a":"The comparison between public transportation and private transportation involves both advantages and disadvantages. One clear advantage of public transportation is that it is cheaper for individuals and reduces daily travel costs. Many people can travel using a single bus or train, which allows passengers to spend less money compared to owning and maintaining a private car. In addition, public transportation decreases traffic congestion in cities because fewer private vehicles are used on the roads. When more people rely on shared transport, the number of cars in urban areas becomes lower. Another important benefit is that it is more environmentally friendly since fewer cars are used, which helps reduce pollution and supports a cleaner environment. However, public transportation also has several disadvantages. One of the main drawbacks is that it offers less comfort and privacy compared to private vehicles, where people can travel in a more personal and controlled space. Another limitation is that public transport usually has limited schedules and routes, meaning passengers must adjust their plans according to fixed timetables and predetermined paths. Moreover, buses and trains are often crowded during peak hours, especially in busy cities, which can make commuting less convenient and sometimes stressful for daily passengers."},"wd":[["unwind","to relax after a period of work or stress","v.","1.1"],["productive","achieving a lot; effective","adj.","1.1"],["relax","to rest and stop feeling worried or tense","v.","1.1"],["clear my mind","to stop worrying and start to feel calm","phrase","1.1"],["physically active","doing regular exercise or sport","phrase","1.1"],["for instance","for example","phrase","1.1"],["stay healthy","to keep your body in good condition","phrase","1.1"],["in my opinion","used to give your personal view","phrase","1.1"],["refreshing atmosphere","surroundings that make you feel fresh","phrase","1.1"],["spend time","to use time doing something","phrase","1.1"],["peaceful environment","a quiet place with no noise or stress / 30 seconds · no preparation","phrase","1.1"],["make a payment","to pay money for something","phrase","1.2"],["banknote","a piece of paper money cash (n.) money in the form of notes and coins","n.","1.2"],["bank card","a plastic card used to pay for things","n.","1.2"],["card machine","the machine that reads a bank card","n.","1.2"],["payment terminal","the device that processes a card payment","n.","1.2"],["in addition","also; as well as that","phrase","1.2"],["contactless","not requiring physical contact to work","adj.","1.2"],["unavailable","not able to be used or obtained","adj.","1.2"],["disappear","to stop existing or being seen rely on (phr. v.) to depend on something or someone","v.","1.2"],["electronic payment","paying by card or phone instead of cash","phrase","1.2"],["routine","the usual way you do things every day","n.","2"],["stressful","causing worry and pressure","adj.","2"],["organize","to arrange or plan something carefully","v.","2"],["peaceful","quiet and free from noise or trouble","adj.","2"],["deadline","a time by which something must be finished","n.","2"],["sense of freedom","the feeling of being free","phrase","2"],["meaningful","important and worth remembering","adj.","2"],["concentrate","to give your full attention to one thing","v.","2"],["remind","to make someone remember something","v.","2"],["refresh","to make someone feel less tired","v.","2"],["motivate","to make someone want to do something","v.","2"],["portation?","privacy compared to and routes ring peak hours","","3"],["disadvantage","a bad feature of something","n.","3"],["traffic congestion","too many vehicles causing delays rely on (phr. v.) to depend on something or someone","n.","3"],["urban area","a town or city area","n.","3"],["environmentally friendly","causing little or no harm to nature","adj.","3"],["drawback","a disadvantage of a plan or situation","n.","3"],["limitation","a restriction on what is possible","n.","3"],["public transport","buses and trains used by everyone","n.","3"],["peak hours","the busiest times of the day","n.","3"],["commute","to travel regularly between home and work","v.","3"]]},{"p11":[{"q":"Do you live in a house or a flat?","a":"At the moment, I live in a flat. It’s not very large, but it’s comfortable and convenient for daily life. What I like most is that everything I need is nearby, such as shops and public transport. Although living in a house might offer more space and privacy, a flat is much easier to maintain and manage."},{"q":"Can you tell me about your first teacher?","a":"Yes, I remember my first teacher quite clearly. She was very kind and patient, especially with young students who were just starting school. What I appreciated most was the way she encouraged us to ask questions and stay curious. Because of her supportive attitude, I actually started to enjoy studying and felt more confident in class."},{"q":"Can you describe your house?","a":"My house is fairly simple but very comfortable. It has several rooms, including a living room, a kitchen, and a few bedrooms. The place I like most is the living room because that’s where my family usually gathers to talk or relax together. Overall, it’s a warm and welcoming place where I feel very comfortable."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different ways of reading books in the modern world. In the first picture, there is a young boy sitting on a chair and reading a traditional book. He seems to be in a library or a study area because there are many bookshelves behind him. The child appears to be concentrating on his book, and he is probably enjoying reading in a quiet environment. In contrast, the second picture shows a person reading a digital book on a tablet. The person is sitting comfortably and holding an electronic device while looking at the screen. It seems that they prefer using modern technology instead of a printed book."},{"q":"Which do you think is better: reading printed books or reading e-books?","a":"In my opinion, both options have their own advantages, but I personally prefer printed books. Reading a physical book feels more engaging and immersive because there are fewer distractions compared to electronic devices. In addition, printed books are more comfortable for the eyes during long reading sessions. However, e-books are extremely convenient and portable. You can easily carry many books in one device, which makes them ideal for traveling or commuting."},{"q":"Do you think printed books will disappear in the future?","a":"I do not believe printed books will completely disappear in the future. Although e-books are becoming increasingly popular due to their convenience and accessibility, many people still appreciate the experience of reading a physical book. Printed books provide a sense of authenticity and emotional connection that digital devices often lack. For this reason, I think both formats will continue to exist, and people will simply choose the one that best suits their preferences and lifestyle."}],"p2":{"prompts":["Tell me about a skill you have learned recently.","How did you learn this skill and what difficulties did you face while learning it?","How do you think this skill will help you in the future or in your daily life?"],"a":"One skill I have learned recently is improving my typing speed on the computer. Because I spend a lot of time working with texts and preparing materials, I realized that typing quickly and accurately is very important. At first, my typing speed was quite slow, so I decided to practice regularly using online typing exercises. Gradually, I noticed that my speed and accuracy started to improve, which made my work much more efficient. I mainly learned this skill through daily practice. I used typing websites and tried to practice for at least fifteen or twenty minutes every day. In the beginning, the most difficult part was avoiding mistakes because I often pressed the wrong keys when trying to type faster. Sometimes it was also frustrating to repeat the same exercises many times. However, with patience and consistent practice, I slowly became more comfortable with the keyboard. I believe this skill will be very helpful for me in the future. Since many tasks today involve working on computers, typing quickly can save a lot of time. It also allows me to focus more on ideas instead of worrying about the keyboard. In my daily life, it helps me complete my work faster and communicate more efficiently when writing messages, reports, or other documents"},"p3":{"topic":"The use of phones should be prohibited in school areas","for":["improves students’ concentration and reduces distractions during lessons","prevents cheating and misuse of technology during exams","encourages more face-to-face communication and social interaction"],"against":["phones can be useful educational tools for research and learning","students may need phones for emergencies or communication with parents","banning phones may be difficult to enforce consistently"],"a":"The use of mobile phones in school environments is a topic that generates considerable debate among educators and parents. One argument in favour of prohibiting phones in school areas is that such a rule can improve students’ concentration and reduce distractions during lessons. Many students tend to check messages or social media instead of paying attention to the teacher, which negatively affects their learning process. In addition, banning phones can help prevent cheating and the misuse of technology during exams, since students would not have the opportunity to access online information or communicate with others. Furthermore, removing phones from classrooms may encourage more face-to-face communication and social interaction among students, helping them develop stronger interpersonal skills and build better relationships with their peers. On the other hand, there are also several arguments against banning phones in schools. For example, smartphones can serve as useful educational tools that allow students to quickly search for information, access learning platforms, or use educational applications during lessons. Moreover, many parents prefer their children to carry phones so that they can communicate in case of emergencies or unexpected situations. Another practical concern is that enforcing a complete ban on phones may be difficult for schools to manage consistently, especially in large institutions where monitoring every student at all times can be challenging."},"wd":[["convenient","easy to use and saving time or effort","adj.","1.1"],["public transport","buses and trains used by everyone","n.","1.1"],["privacy","the right to keep your life to yourself","n.","1.1"],["encourage","to give someone confidence to do something","v.","1.1"],["supportive","giving help and encouragement","adj.","1.1"],["confident","sure that you can do something well","adj.","1.1"],["gather","to come together in a group","v.","1.1"],["relax","to rest and stop feeling worried or tense","v.","1.1"],["traditional","following a way of doing things from the past","adj.","1.2"],["bookshelf","a shelf for keeping books","n.","1.2"],["concentrate","to give your full attention to one thing","v.","1.2"],["in contrast","used to show a clear difference","phrase","1.2"],["digital","using computer technology","adj.","1.2"],["electronic device","a piece of equipment that runs on electricity","n.","1.2"],["printed","produced on paper by a machine","adj.","1.2"],["in my opinion","used to give your personal view","phrase","1.2"],["immersive","making you feel completely involved","adj.","1.2"],["distraction","something that stops you concentrating","n.","1.2"],["in addition","also; as well as that","phrase","1.2"],["commute","to travel regularly between home and work","v.","1.2"],["disappear","to stop existing or being seen","v.","1.2"],["convenience","the quality of being easy and saving time","n.","1.2"],["accessibility","how easy something is to reach or use","n.","1.2"],["preference","a greater liking for one thing over another","n.","1.2"],["skill","the ability to do something well","n.","2"],["typing","writing using a keyboard","n.","2"],["gradually","slowly, over a period of time","adv.","2"],["efficient","working well without wasting time or energy","adj.","2"],["patience","the ability to wait calmly without complaining","n.","2"],["keyboard","the set of keys used to type","n.","2"],["helpful","giving useful help","adj.","2"],["involve","to include something as a necessary part","v.","2"],["communicate","to share information with other people","v.","2"],["efficiently","without wasting time or energy","adv.","2"],["ol areas","eful educational and learning d phones for ommunication with may be difficult to tly","","3"],["generate","to produce or create something","v.","3"],["prohibit","to officially stop something by law or rule","v.","3"],["social media","websites where people share posts and photos","n.","3"],["negatively","in a bad or harmful way","adv.","3"],["misuse","the wrong or dishonest use of something","n.","3"],["furthermore","in addition to what was said before","adv.","3"],["classroom","a room where lessons take place","n.","3"],["on the other hand","used to introduce the opposite opinion","phrase","3"],["smartphone","a mobile phone that works like a small computer","n.","3"],["moreover","in addition; besides","adv.","3"],["enforce","to make people obey a rule or law","v.","3"]]},{"p11":[{"q":"What do you usually eat for breakfast?","a":"For breakfast, I usually prefer something simple but filling. Most of the time, I have eggs, bread, and a cup of tea or coffee. Sometimes I also eat fruit because it helps me feel more energetic in the morning. I think breakfast is quite important since it gives me the energy I need to start the day productively."},{"q":"Do you like any sports?","a":"Yes, I do. I particularly enjoy football because it’s both exciting and physically demanding. Playing football with friends is a great way to stay active and relieve stress at the same time. I also like the teamwork involved in the game, since it teaches cooperation and quick decision-making."},{"q":"Tell me about your favorite teacher.","a":"My favourite teacher was my English teacher in high school. She had a lot of energy and she never made a lesson boring, even when the topic was grammar. What I liked most was that she treated everyone with respect, so nobody was afraid of making mistakes in her class. She also stayed after school to help students who were struggling. She is one of the main reasons I still enjoy learning languages today."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different ways of spending free time and enjoying activities. In the first picture, there are several people sitting around a table and playing a card game together. They seem to be in a comfortable home environment, and they are smiling and enjoying their time with each other. It looks like they are having a social activity with family members or friends. In contrast, the second picture shows a group of people hiking in a natural area. They are walking on a mountain path while carrying backpacks and using walking sticks. It seems that they are exploring the outdoors and enjoying an active adventure in nature."},{"q":"Which do you prefer: indoor activities or outdoor activities?","a":"Personally, I prefer outdoor activities because they allow me to stay physically active and spend time in a natural environment. Activities like walking, cycling, or playing sports can improve both physical health and mental well-being. However, indoor activities can also be enjoyable, especially when the weather is bad or when someone wants to relax and focus on something calm like reading or watching a movie."},{"q":"Do you think people today spend less time doing outdoor activities?","a":"Yes, I do think that people nowadays tend to spend less time outdoors than they did in the past. A major factor behind this change is the growing influence of technology. Devices such as smartphones, computers, and video games often keep people entertained indoors for long periods of time. Another reason is that modern lifestyles are quite busy, and in many cities there are fewer convenient spaces for outdoor recreation. Nevertheless, awareness about the benefits of physical activity is gradually increasing, so some people are making an effort to spend more time outside and lead a healthier lifestyle."}],"p2":{"prompts":["Tell me about a secret you shared with someone.","Who did you share the secret with and why did you trust this person?","How did sharing this secret affect your relationship with that person?"],"a":"One secret I once shared was about an important personal decision I was thinking about. At that time, I felt uncertain and needed someone I could talk to honestly. Instead of keeping everything to myself, I decided to open up about my thoughts and concerns. Sharing the secret helped me feel much lighter because I finally expressed something that had been on my mind for a while. I shared this secret with one of my closest friends because I truly trusted that person. We have known each other for many years and have always supported each other during difficult situations. I knew that my friend would listen carefully and would not judge me or tell other people. This sense of trust made it easier for me to speak openly about my feelings and thoughts. After sharing the secret, our relationship actually became stronger. We started to communicate more honestly and support each other more often. It showed me that trust is a very important part of friendship. When people feel safe sharing personal things, it can create a deeper connection and make the relationship more meaningful."},"p3":{"topic":"Homework should be abolished at school","for":["reduces academic stress and pressure on students","allows students to spend more time on hobbies, rest, and family","learning can become more efficient during school hours"],"against":["homework helps students reinforce and practice what they learn in class","it develops responsibility and independent learning skills","teachers can evaluate students’ understanding through homework"],"a":"The practice of assigning homework in schools is often discussed, with some people supporting it while others believe it should be removed. One argument in favour of abolishing homework is that it can reduce academic stress and pressure on students. Many learners already spend long hours at school, and additional assignments at home may make them feel overwhelmed and exhausted. Furthermore, removing homework would allow students to spend more time on hobbies, relaxation, and family activities, which are also important for their personal development and mental well-being. Another possible advantage is that learning could become more efficient during school hours, encouraging teachers and students to focus more actively and productively while they are in the classroom. However, there are also strong arguments against eliminating homework completely. One important reason is that homework helps students reinforce and practice what they learn in class, which can improve their understanding of the subject. In addition, completing assignments outside the classroom can develop responsibility and independent learning skills, as students learn how to manage their time and solve problems on their own. Homework also allows teachers to evaluate students’ understanding of the material and identify areas where additional support may be needed."},"wd":[["energetic","full of energy and enthusiasm","adj.","1.1"],["productively","in a way that achieves a lot","adv.","1.1"],["at the same time","used to add a different point","phrase","1.1"],["teamwork","working together as a group","n.","1.1"],["involve","to include something as a necessary part","v.","1.1"],["energy","the strength you need to do things","n.","1.1"],["treat","to behave towards somebody in a certain way","v.","1.1"],["respect","a feeling that somebody is important and good","n.","1.1"],["reason","why something happens or is done","n.","1.1"],["card game","a game played with a set of cards","n.","1.2"],["social activity","something done together with other people","phrase","1.2"],["in contrast","used to show a clear difference hike (v.) to go for a long walk in the countryside","phrase","1.2"],["backpack","a bag you carry on your back","n.","1.2"],["walking stick","a stick used to help you walk","n.","1.2"],["explore","to travel through a place to discover it","v.","1.2"],["adventure","an exciting and often risky experience","n.","1.2"],["physically active","doing regular exercise or sport","phrase","1.2"],["spend time","to use time doing something indoor (adj.) happening or used inside a building","phrase","1.2"],["enjoyable","giving pleasure; pleasant","adj.","1.2"],["smartphone","a mobile phone that works like a small computer","n.","1.2"],["entertain","to interest and amuse someone indoor (adj.) happening or used inside a building","v.","1.2"],["convenient","easy to use and saving time or effort","adj.","1.2"],["recreation","activities done for enjoyment","n.","1.2"],["gradually","slowly, over a period of time paration · 2 minutes to speak","adv.","1.2"],["uncertain","not sure or not decided openly (adv.) without hiding your feelings or opinions","adj.","2"],["communicate","to share information with other people","v.","2"],["friendship","the relationship between friends deeper (adj.) going further down or further into a subject","n.","2"],["meaningful","important and worth remembering","adj.","2"],["homework","school work that students do at home","n.","3"],["learner","a person who is learning something","n.","3"],["assignment","a piece of work given to a student","n.","3"],["overwhelm","to affect someone so strongly they cannot cope","v.","3"],["furthermore","in addition to what was said before","adv.","3"],["hobby","an activity you enjoy in your free time","n.","3"],["relaxation","a state of rest after work or stress","n.","3"],["classroom","a room where lessons take place","n.","3"],["eliminate","to remove something completely","v.","3"],["in addition","also; as well as that","phrase","3"],["evaluate","to judge how good or useful something is","v.","3"]]},{"p11":[{"q":"How is your room decorated?","a":"My room is decorated in a fairly simple but comfortable style. I prefer a clean and organized environment, so I don’t keep too many unnecessary things. There is a desk, a bookshelf, and a few decorations on the wall, such as photos and a small painting. Overall, the room feels calm and cozy, which helps me concentrate and relax."},{"q":"Have you got many books?","a":"Yes, I have quite a lot of books, especially educational and language-learning ones. I enjoy reading because it helps me expand my knowledge and improve my vocabulary. Most of my books are on a small bookshelf in my room, and I try to read at least a few pages whenever I have free time."},{"q":"What is your favorite song?","a":"One of my favorite songs is a calm and emotional track that I often listen to when I want to relax. I really like the melody and the meaningful lyrics because they create a peaceful atmosphere. Music like this helps me focus, especially when I’m studying or thinking about something important."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different approaches to maintaining physical fitness and improving personal health. In the first picture, there is a woman exercising on a stationary bicycle in what appears to be a modern gym. She seems to be engaged in an intense workout session, while other people are also exercising in the background. The woman looks highly focused and determined. In contrast, the second picture shows a man participating in an outdoor fitness activity. He is using resistance ropes on a grassy field, which suggests that he is doing a strength-training exercise. He appears to be challenging himself through an energetic and demanding workout routine."},{"q":"Which do you think is better: working outside or working inside?","a":"In my opinion, working inside is generally more comfortable and convenient. Indoor workplaces usually provide stable conditions such as air conditioning, proper equipment, and protection from extreme weather. This allows people to focus better on their tasks. However, working outside can also be enjoyable for people who prefer physical activity and do not like sitting for long hours. It often allows workers to stay active and spend more time in fresh air."},{"q":"Do you think more people will work indoors in the future?","a":"Absolutely, I believe more people will work indoors in the future. As technology continues to develop, many jobs are becoming digital and require computers or internet access. This naturally leads to more officebased or remote work. At the same time, some professions such as construction, agriculture, and transportation will always require outdoor work. Therefore, while indoor jobs may increase, outdoor occupations will still remain essential."}],"p2":{"prompts":["Describe a time when you felt confused about something important.","What caused this confusion?","How did you eventually understand the situation?"],"a":"One time when I felt confused about something important was during a period when I had to make a decision related to my academic plans. At that time, I had several possible options, and each one seemed to offer different advantages and opportunities. Because the decision could influence my future studies and long-term goals, I wanted to choose carefully. However, the more I thought about it, the more uncertain I became. I kept comparing the options and imagining different outcomes, which made the situation even more complicated. As a result, I spent a lot of time thinking about the decision without feeling completely confident about which path would be the best one. he confusion was mainly caused by the fact that there were many factors to consider. Each option had both positive and negative aspects, and it was difficult to predict which one would lead to better results in the future. In addition, I received different opinions from people around me. Some suggested that I should follow one direction, while others recommended a different approach. Although their advice was helpful, hearing many different perspectives sometimes made the situation even more confusing. I also felt pressure because I knew the decision was important and could affect my future opportunities. Eventually, I managed to understand the situation more clearly by taking some time to think calmly and analyze my priorities. Instead of focusing only on other people’s opinions, I started considering my own interests, strengths, and long-term goals. I also tried to gather more information about each option so that I could evaluate them more realistically. After reflecting carefully and discussing the situation with a few trusted people, I finally felt more confident about my choice. This experience taught me that confusion is sometimes a natural part of making important decisions, and that patience and thoughtful reflection can help people reach a clearer understanding."},"p3":{"topic":"Cities should limit cars and promote cycling","for":["reduces traffic congestion in urban areas","improves air quality and reduces pollution","encourages a healthier lifestyle through physical activity"],"against":["cycling infrastructure may be expensive to develop","not all people can cycle due to age, health, or distance","limiting cars may cause inconvenience for commuters and businesses"],"a":"The proposal that cities should limit the use of cars and promote cycling has attracted growing attention in recent years, especially as urban areas face increasing transportation and environmental challenges. One argument in favour of this idea is that it can help reduce traffic congestion in urban areas. When a larger number of people choose bicycles instead of cars, the overall number of vehicles on the roads decreases, which can make daily travel more efficient and less stressful. In addition, promoting cycling can improve air quality and reduce pollution because bicycles do not produce harmful emissions that contribute to environmental damage. Another important advantage is that cycling encourages a healthier lifestyle. Regular physical activity such as cycling can improve people’s fitness levels, reduce the risk of certain health problems, and promote a more active way of living. However, there are also several concerns related to limiting cars and encouraging cycling. One major issue is that developing proper cycling infrastructure may be expensive for cities. Governments may need to invest significant financial resources in building safe bike lanes, parking areas, and other facilities for cyclists. Furthermore, not all people can cycle due to factors such as age, health conditions, or long commuting distances. For many individuals, especially those who travel far for work or have physical limitations, cycling may not be a practical option. Finally, limiting cars may cause inconvenience for commuters and businesses that depend on quick and flexible transportation for their daily activities."},"wd":[["organize","to arrange or plan something carefully","v.","1.1"],["bookshelf","a shelf for keeping books","n.","1.1"],["concentrate","to give your full attention to one thing","v.","1.1"],["relax","to rest and stop feeling worried or tense","v.","1.1"],["vocabulary","the words a person knows or uses","n.","1.1"],["melody","a series of musical notes that make a tune","n.","1.1"],["meaningful","important and worth remembering","adj.","1.1"],["lyric","the words of a song","n.","1.1"],["physical fitness","the condition of being healthy and strong","phrase","1.2"],["stationary bicycle","an exercise bike that does not move","n.", ught about something","n.","2"],["clearer","easier to understand or see","adj.","2"],["ng","ture may be lop cycle due to age, e cause commuters and","","3"],["attract","to make someone interested in something","v.","3"],["urban area","a town or city area","n.","3"],["traffic congestion","too many vehicles causing delays","n.","3"],["bicycle","a two-wheeled vehicle you ride by pedalling","n.","3"],["decrease","to become smaller in size or amount","v.","3"],["stressful","causing worry and pressure","adj.","3"],["pollution","harmful substances that damage air or water","n.","3"],["harmful","causing damage or injury","adj.","3"],["lifestyle","the way a person lives","n.","3"],["invest","to put money or effort into something","v.","3"],["commute","to travel regularly between home and work","v.","3"],["limitation","a restriction on what is possible depend on (phr. v.) to be decided by something else","n.","3"]]},{"p11":[{"q":"Do you have a computer?","a":"Actually, I rely on a laptop quite heavily in my daily life. Most of my studying, research, and communication happens through it, so it has become an essential tool for me. Whether I am preparing materials, searching for information, or simply organizing my tasks, my computer makes everything far more efficient. From time to time, I also use it to relax by watching videos or reading interesting articles online."},{"q":"Tell me about your hometown.","a":"If I had to describe my hometown in a few words, I would say it is energetic and constantly evolving. Over the years, it has developed significantly, with new buildings, cafés, and public spaces appearing all the time. At the same time, it has managed to preserve its cultural identity and traditions. What I appreciate most, however, is the sense of community, because people tend to be friendly and supportive toward one another."},{"q":"What do you do with your friends?","a":"Spending time with my friends usually involves simple but enjoyable activities. Quite often, we meet somewhere in the city just to talk and catch up with each other. On other occasions, we might go for a walk, play sports, or watch a film together. What matters most is not the activity itself but the opportunity to relax, share ideas, and strengthen our friendships."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different ways of spending leisure time. In the first picture, there is a person sitting on a sofa and watching television in a dimly lit room. He seems to be relaxing after a busy day and focusing on the programme displayed on the screen. The comfortable atmosphere suggests that he is enjoying a passive form of entertainment at home. In contrast, the second picture shows a family spending quality time together by playing a board game. The parents and their child appear to be engaged in the activity and interacting with each other in a cheerful environment. This seems to be a more social and interactive way of relaxing."},{"q":"Which do you prefer: playing board games or watching TV?","a":"If I had to choose, I would probably go with board games. What makes them appealing is the interaction they create between people. When playing a board game, you usually have to think strategically and communicate with others, which makes the experience more dynamic. That being said, television certainly has its advantages as well. After a tiring day, simply sitting down and watching a good film or an interesting series can be a very relaxing way to unwind."},{"q":"Do you think people today spend too much time watching TV?","a":"To a certain extent, yes. With the huge amount of digital content available today, many people find themselves spending long hours in front of screens. Streaming platforms, TV shows, and online videos are extremely accessible, which can easily turn watching TV into a daily habit. Even so, I do not think television is necessarily harmful if it is consumed in moderation. The key is to maintain a balance between screen-based entertainment and other activities such as socializing or physical exercise."}],"p2":{"prompts":["Tell me about a cultural tradition that is important in your country.","Why do people value this tradition?","Do you think it will continue to be important in the future? Why or why not?"],"a":"One cultural tradition that is very important in my country is celebrating Navruz, which marks the beginning of spring and the new year. During this time, families prepare traditional food, visit relatives, and take part in community celebrations. People often clean their homes, cook special dishes such as sumalak, and spend time together outdoors. The atmosphere during Navruz is usually very joyful because it symbolizes renewal, hope, and a fresh start for everyone. People value this tradition because it brings families and communities closer together. It is not only a celebration but also a way of preserving cultural identity and remembering long-standing customs. Many people believe that traditions like Navruz help younger generations understand their heritage and respect the history of their country. It also creates an opportunity for people to relax, meet relatives, and enjoy time with loved ones. I believe this tradition will continue to be important in the future. Even though modern lifestyles are changing rapidly, cultural traditions often remain strong because they connect people with their roots. Younger generations still participate in these celebrations, and governments and communities also support them. For these reasons, I think this tradition will remain meaningful for many years."},"p3":{"topic":"A university degree is not necessary for success","for":["many successful entrepreneurs and professionals do not have university degrees","practical skills and experience can be more valuable than academic knowledge","alternative education paths such as vocational training or online courses are growing"],"against":["many careers require formal qualifications and academic training","universities provide structured learning and professional networks","a degree often increases employment opportunities and career stability"],"a":"The idea that a university degree is not necessary for success has become increasingly discussed as different career paths continue to develop in modern society. One argument supporting this view is that many successful entrepreneurs and professionals have achieved remarkable success without completing a university degree. Their achievements suggest that determination, creativity, and practical abilities can sometimes be more important than formal education. In addition, practical skills and real-world experience can often be more valuable than purely academic knowledge, particularly in fields that require problem- solving, innovation, or technical abilities. Another important point is that alternative education paths are becoming more popular and accessible. Options such as vocational training programs, professional certifications, and online courses allow individuals to develop useful skills without following a traditional university route. However, there are also strong arguments suggesting that a university degree still plays an important role in achieving success. Many careers, such as medicine, engineering, and law, require formal qualifications and specialized academic training that can only be obtained through higher education institutions. Furthermore, universities provide structured learning environments where students can gain deep theoretical knowledge and develop critical thinking skills. They also offer valuable professional networks, allowing students to connect with professors, classmates, and potential employers. Finally, having a university degree often increases employment opportunities and can contribute to greater career stability in the long term."},"wd":[["laptop","a small computer you can carry","n.","1.1"],["organize","to arrange or plan something carefully","v.","1.1"],["hometown","the town where you were born or grew up","n.","1.1"],["energetic","full of energy and enthusiasm","adj.","1.1"],["at the same time","used to add a different point","phrase","1.1"],["supportive","giving help and encouragement","adj.","1.1"],["involve","to include something as a necessary part","v.","1.1"],["enjoyable","giving pleasure; pleasant","adj.","1.1"],["relax","to rest and stop feeling worried or tense","v.","1.1"],["strengthen","to make something stronger / 30 seconds · no preparation","v.","1.1"],["leisure time","free time when you are not working dimly lit (phrase) with only a small amount of light","n.","1.2"],["passive","not taking an active part in something","adj.","1.2"],["entertainment","films, games and other things that amuse people","n.","1.2"],["quality time","time spent giving somebody full attention","phrase","1.2"],["board game","a game played on a special board","n.","1.2"],["interact","to talk to and work with other people","v.","1.2"],["cheerful","happy and full of positive feeling","adj.","1.2"],["interaction","the act of talking and working with others","n.","1.2"],["communicate","to share information with other people","v.","1.2"],["unwind","to relax after a period of work or stress","v.","1.2"],["accessible","easy to reach, enter or use","adj.","1.2"],["habit","something you do regularly, often without thinking","n.","1.2"],["harmful","causing damage or injury","adj.","1.2"],["socialize","to spend time with other people for pleasure","v.","1.2"],["celebration","a special event to mark something happy dish (n.) food prepared in a particular way","n.","2"],["spend time","to use time doing something","phrase","2"],["outdoor","happening or used outside a building","adj.","2"],["preserve","to keep something in its original state","v.","2"],["heritage","traditions and buildings passed down over time","n.","2"],["lifestyle","the way a person lives","n.","2"],["rapidly","very quickly","adv.","2"],["participate","to take part in an activity","v.","2"],["meaningful","important and worth remembering","adj.","2"],["cess","uire formal academic training de structured essional networks reases employment career stability","","3"],["increasingly","more and more over time","adv.","3"],["achievement","something good you have succeeded in doing","n.","3"],["determination","the will to keep trying until you succeed","n.","3"],["creativity","the ability to produce original ideas","n.","3"],["in addition","also; as well as that","phrase","3"],["skill","the ability to do something well","n.","3"],["obtain","to get something, often after effort","v.","3"],["institution","a large organisation such as a school or bank","n.","3"],["furthermore","in addition to what was said before","adv.","3"],["classmate","a person in the same class as you","n.","3"],["contribute","to help to make something happen","v.","3"]]},{"p11":[{"q":"Do you work or are you a student?","a":"At the moment, I’m a student, and most of my time is devoted to studying and improving my skills. I usually attend classes during the day and spend additional time reviewing materials or preparing for exams. Although it can sometimes be demanding, I find it quite rewarding because I feel that I’m gradually developing my knowledge and abilities."},{"q":"Do you like any foreign singers?","a":"Definitely. I really like Adele and Ed Sheeran. I admire Adele because her voice is incredibly powerful and her songs are about real emotions, so they never sound artificial. Ed Sheeran is different: his songs are simpler, but the lyrics tell a clear story and they are perfect for background listening. I also use their songs to practise English, because I can usually understand the words without looking them up."},{"q":"What do you usually do at the weekends?","a":"At the weekends, I usually try to relax and recharge after a busy week. Sometimes I spend time with friends or family, and other times I prefer quieter activities like reading, watching films, or going for a walk. Weekends are also a good opportunity for me to catch up on things I didn’t have time to do during the week."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different dining experiences and ways of sharing meals with others. In the first picture, there is a group of friends having dinner together in what appears to be a restaurant. They are sitting around a table, enjoying their food and engaging in a lively conversation. The warm lighting and relaxed atmosphere create a pleasant social environment, and they seem to be strengthening their friendships through this gathering. In contrast, the second picture shows a family having a meal together at home. The parents and children are sitting around a dining table, eating food and interacting with each other. It seems to be a more intimate and comfortable setting where family members can spend quality time together and maintain close relationships."},{"q":"Which do you prefer: eating out or eating at home?","a":"If I were asked to choose, I would probably say that eating at home is a better option for everyday life. Preparing meals at home is usually more affordable and healthier since people can select fresh ingredients and cook according to their preferences. Nevertheless, dining out can also be enjoyable from time to time. It gives people the opportunity to try new cuisines and spend quality time with friends or family in a pleasant environment."},{"q":"Do you think people today eat out more often than in the past?","a":"In many cases, yes. Compared with the past, people today seem to eat out much more frequently. One of the main reasons is that modern lifestyles are quite fast-paced, so individuals often prefer quick and convenient meal options. Another contributing factor is the growth of restaurants and food delivery services, which have made prepared meals extremely accessible. As a result, dining out has become a common part of everyday life for many people."}],"p2":{"prompts":["Tell me about a time when time seemed to pass very quickly or very slowly.","What were you doing during that moment?","Why do you think time felt different in that situation?"],"a":"One time when time seemed to pass very quickly was during a meeting with some close friends whom I had not seen for a long time. We decided to meet in a small café and simply spend some time talking and catching up with each other. At first, we thought we would only stay there for about an hour, but the conversation became so interesting and enjoyable that we completely lost track of time. We talked about many different topics, including our studies, future plans, and funny memories from the past. During that moment, we were mainly sharing stories and listening to each other’s experiences. Everyone had something interesting to say, and the atmosphere was very relaxed and friendly. Because we were fully engaged in the conversation, none of us paid attention to the clock. By the time we realized how late it had become, several hours had already passed, which was quite surprising for all of us. I think time felt different in that situation because we were genuinely enjoying ourselves and were completely focused on the moment. When people are interested in what they are doing and feel comfortable with the people around them, they often forget about time completely. On the other hand, when someone is bored or uncomfortable, time tends to feel very slow. This experience reminded me that meaningful conversations and positive emotions can make time seem to move much faster than we expect."},"p3":{"topic":"The government should ban gambling","for":["reduces gambling addiction and protects vulnerable people","prevents financial problems and family conflicts caused by gambling","decreases crime related to illegal betting and debt"],"against":["banning gambling may increase illegal underground gambling","governments would lose significant tax revenue from the gambling industry","people should have the freedom to decide how they spend their money"],"a":"The question of whether the government should ban gambling is widely debated because it involves both social protection and personal freedom. One argument in favour of banning gambling is that such a policy could reduce gambling addiction and protect vulnerable people. Many individuals develop serious problems when they become addicted to betting activities, which can negatively affect their mental health and daily lives. In addition, prohibiting gambling could prevent financial problems and family conflicts that often arise when people lose large amounts of money. Another significant benefit is that a ban could decrease crime related to illegal betting and debt, since some individuals may resort to dishonest or illegal actions in order to recover their losses or repay borrowed money. On the other hand, banning gambling may also create several challenges. One major concern is that strict prohibition could lead to the growth of illegal underground gambling activities that are much harder for authorities to control. Furthermore, governments would lose significant tax revenue that currently comes from the gambling industry, which is often used to fund public services and social programs. Finally, some people argue that individuals should have the freedom to decide how they spend their money, and that responsible adults should be allowed to participate in gambling if they choose to do so."},"wd":[["devote","to give time or effort to something exam (n.) an official test of knowledge","v.","1.1"],["gradually","slowly, over a period of time","adv.","1.1"],["admire","to respect and like someone very much","v.","1.1"],["emotion","a strong feeling such as joy or fear","n.","1.1"],["lyric","the words of a song","n.","1.1"],["relax","to rest and stop feeling worried or tense","v.","1.1"],["recharge","to get your energy back after resting","v.","1.1"],["spend time","to use time doing something","phrase","1.1"],["quieter","with less noise than before","adj.","1.1"],["dining experience","the whole experience of eating out lively (adj.) full of energy and interest","phrase","1.2"],["atmosphere","the general feeling of a place","n.","1.2"],["strengthen","to make something stronger","v.","1.2"],["gathering","a meeting of a group of people","n.","1.2"],["intimate","private, close and personal","adj.","1.2"],["setting","the place where something happens","n.","1.2"],["ingredient","one of the foods used to make a dish","n.","1.2"],["preference","a greater liking for one thing over another","n.","1.2"],["enjoyable","giving pleasure; pleasant","adj.","1.2"],["cuisine","a style of cooking of a country or region","n.","1.2"],["lifestyle","the way a person lives","n.","1.2"],["convenient","easy to use and saving time or effort","adj.","1.2"],["accessible","easy to reach, enter or use","adj.","1.2"],["as a result","because of this","phrase","1.2"],["dining","eating a meal, especially in a restaurant","n.","1.2"],["engage","to take part in something with interest","v.","2"],["on the other hand","used to introduce the opposite opinion","phrase","2"],["uncomfortable","not pleasant; causing slight pain or worry","adj.","2"],["remind","to make someone remember something","v.","2"],["meaningful","important and worth remembering","adj.","2"],["gamble","to risk money on the result of a game","v.","3"],["involve","to include something as a necessary part","v.","3"],["addiction","the state of being unable to stop something","n.","3"],["negatively","in a bad or harmful way","adv.","3"],["in addition","also; as well as that","phrase","3"],["prohibit","to officially stop something by law or rule","v.","3"],["arise","to happen or start to exist","v.","3"],["decrease","to become smaller in size or amount","v.","3"],["furthermore","in addition to what was said before","adv.","3"],["participate","to take part in an activity","v.","3"]]},{"p11":[{"q":"What is your favourite item of clothing?","a":"My favourite item is an old leather jacket that I have had for about four years. It is not particularly fashionable any more, but it goes with everything and it looks better the older it gets. It is also very practical, because it keeps the wind out in autumn and spring. I suppose I am attached to it because I was wearing it during a trip I really enjoyed."},{"q":"How do you use the internet?","a":"I use the internet mainly for learning and communication. For example, I often search for useful information, watch educational videos, or read articles about different topics. I also use it to stay in touch with friends and share ideas. In my opinion, the internet is an essential tool because it provides quick access to knowledge."},{"q":"What famous footballer do you know?","a":"One famous footballer that I know is Cristiano Ronaldo. He is widely recognized for his incredible skills, discipline, and achievements in football. What I admire most about him is his dedication and hard work, which helped him become one of the best players in the world. His career is very inspiring for many young athletes."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different ways of purchasing food and fresh products. In the first picture, there is a woman shopping in a supermarket. She appears to be comparing different products while holding a shopping basket. It seems that she is carefully choosing items from the shelves, possibly by checking their quality, price, or ingredients before making a purchase. The supermarket environment looks organised and convenient, offering a wide range of products. In contrast, the second picture shows a man selling fresh organic food at an outdoor market. He is standing behind a table full of fruits, vegetables, and other natural products. It seems that he is a local farmer or vendor who provides customers with fresh and environmentally friendly produce."},{"q":"Which do you prefer: shopping in big markets or small outdoor markets?","a":"Personally, I tend to prefer small outdoor markets. One reason is that the products there are often fresher, especially when it comes to fruits and vegetables. In addition, shopping in these markets feels more authentic because people can communicate directly with local sellers. However, large markets also have their advantages. They usually provide a wider variety of products and a more comfortable shopping environment."},{"q":"Do you think big markets will replace small outdoor markets in the future?","a":"Although large supermarkets are becoming increasingly common, I do not think small outdoor markets will disappear completely. Many people still appreciate buying fresh products directly from local farmers and vendors. Furthermore, outdoor markets often represent cultural traditions and community life. For this reason, both types of markets will likely continue to exist and serve different purposes."}],"p2":{"prompts":["Tell me about a time when you had to control yourself.","What made the situation difficult for you?","How did you manage to control your emotions or reactions?"],"a":"One situation when I had to control myself happened during a disagreement with someone about an important topic. We were discussing an issue that both of us cared about deeply, and at some point the conversation became quite intense. I started to feel frustrated because the other person did not seem to understand my perspective. For a moment, I felt the urge to respond emotionally and argue more strongly to defend my opinion. The situation was difficult because strong emotions can easily influence how people react. When someone feels misunderstood, it is natural to become defensive or even angry. However, I knew that reacting impulsively could make the situation worse and possibly damage our relationship. Instead of immediately responding, I tried to pause for a moment and think carefully about my words. I managed to control my emotions by taking a deep
