 waste ends up in landfill sites."]},{"h":"Litter","items":["People do not think about the consequences of dropping rubbish.","They assume that somebody is paid to clean the streets.","Plastic packaging does not break down easily.","Most of the litter seen on streets is fast food packaging."]},{"h":"Recycling and Other Solutions","items":["Companies should make goods that last longer.","They should not use so much packaging.","Governments should be stricter about waste produced by companies.","They should put legal limits on packaging.","Consumers should avoid buying over-packaged products.","We should recycle and reuse useful materials."]},{"h":"ielts-simon.com","items":["There are collection banks for glass, paper and plastic bottles.","Households can use several rubbish bins to separate waste.","Recycling saves energy and raw materials."]},{"h":"Nuclear Power: Positives","items":["There are several benefits to building more nuclear power stations.","Fossil fuels like oil and gas are running out.","Nuclear power is a relatively sustainable energy source.","It can be used to produce electricity without wasting natural resources.","It could replace the use of natural resources like coal, oil or gas.","Nuclear power stations are cleaner than fossil fuel power stations.","They could help to reduce carbon emissions that cause global warming.","The risks of accidents are being reduced."]},{"h":"Nuclear Power: Negatives","items":["Opponents of nuclear power worry about the safety of power stations.","The building of new nuclear power stations is unpopular.","Nobody wants to live near one.","Nuclear waste disposal is a significant problem.","There is currently no way to decontaminate radioactive material.","People worry that terrorists could steal radioactive materials.","It is safer to produce energy from solar, wind or water power."]},{"h":"ielts-simon.com","items":[]}],"wd":[["global warming","global isish"],["greenhouse effect","issiqxona effekti"],["emissions","zararli chiqindilar"],["fossil fuels","qazilma yoqilg'i"],["renewable energy","qayta tiklanadigan energiya"],["landfill","axlat poligoni"]]},{"title":"Family","groups":[{"h":"Family Size","items":["Families in many countries are not as large as they used to be.","We tend to live in small nuclear families rather than large extended families.","Parents tend to have fewer children.","Young children are no longer expected to work.","Nowadays both parents often work.","It costs so much to bring children up.","It is more difficult to raise a large family."]},{"h":"Working Parents (also see “Gender” topic)","items":["Children and their parents seem to be less close nowadays.","Parents spend less time with their children.","Women traditionally stayed at home to cook, clean and look after children.","Nowadays both parents often work full time.","Children may be left alone, or with nannies or babysitters.","Busy parents have less contact with their children.","Many families no longer eat meals together.","Children spend more time with friends or surfing the Internet."]},{"h":"Negative Effects on Children","items":["The lack of closeness in families can have a negative effect on children.","Many parents have no idea how their children spend their time.","Friends, television and the Internet become the main influences on children’s behaviour.","Teenagers are influenced by peer pressure.","Some of them join gangs.","Juvenile delinquency is on the increase.","Parents should be more involved with their children’s upbringing.","Young people need positive role models."]},{"h":"ielts-simon.com","items":[]},{"h":"Divorce","items":["In the past, divorce was unacceptable.","It was considered to be embarrassing for a family.","People stayed together for religious or family reasons.","Divorce is more socially acceptable nowadays.","It has become much more common.","Divorce can be extremely stressful.","Lone parents may face financial difficulties.","Many single parents have to rely on benefits paid by the state.","Divorce can have a negative effect on children.","Children from single-parent families are more likely to get lower grades or drop out of school.","The rise in divorce rates may be connected to some social problems."]},{"h":"Care for Old People","items":["Caring for elderly people was traditionally the responsibility of families.","Adults had to look after their elderly parents.","A woman’s job was to stay at home taking care of her family.","Nowadays, fewer elderly people are looked after by their relatives.","Residential homes provide care for large numbers of elderly people.","Some families are unable to look after elderly relatives.","Families tend to be smaller these days, and women often have full-time jobs.","Care homes provide a professional service for senior citizens.","Nurses are better trained than family members."]},{"h":"Care for Old People: Opinion","items":["The best form of care for the elderly depends on the family situation.","It depends on whether family members have the time and resources.","We all have a responsibility towards the older people in our society.","Governments should invest money in facilities and training for care workers."]},{"h":"ielts-simon.com","items":[]}],"wd":[["nuclear family","yadroviy oila"],["extended family","katta oila"],["juvenile delinquency","voyaga yetmaganlar huquqbuzarligi"],["peer pressure","tengdoshlar bosimi"],["lone parent","yolg'iz ota-ona"],["upbringing","tarbiya"]]},{"title":"Gender","groups":[{"h":"Gender and Education","items":["Men and women should have access to the same educational opportunities.","Males and females should be accepted onto courses according to their abilities.","It is wrong to discriminate against students because of their gender.","Gender should be irrelevant in education.","Students’ achievements should depend on hard work and individual merit.","In the UK, there are similar numbers of male and female students in higher education."]},{"h":"Gender and Work","items":["Men and women should have access to the same professional opportunities.","Both men and women should be able to pursue a career.","They should earn equal salaries.","They should be employed according to their abilities, qualifications and experience.","Traditionally, women have been restricted to certain roles.","They were often employed as secretaries or receptionists.","Nowadays, a range of occupations is available to both sexes.","Career success depends on individual merit."]},{"h":"Women’s and Men’s Role in the Family","items":["Some people argue that a mother should not work.","She should stay at home and bring up her children.","The father should be the breadwinner of the family.","Others believe that both parents should share these responsibilities.","Working women can take maternity leave during and after pregnancy.","Many mothers continue to work after this period.","Many fathers and mothers share their parenting and domestic responsibilities.","They contribute equally to childcare, cooking and cleaning.","Some women may have better career prospects than their husbands."]},{"h":"ielts-simon.com","items":["Paternity leave and “househusbands” are becoming more common.","Traditional gender roles are gradually changing.","Families can divide roles and responsibilities in the most convenient way."]}],"wd":[["discriminate","kamsitmoq"],["breadwinner","oilani boquvchi"],["maternity leave","tug'ruq ta'tili"],["equal salary","teng maosh"],["individual merit","shaxsiy qobiliyat va xizmat"],["gender roles","gender rollari"]]},{"title":"Genetic Engineering","groups":[{"h":"Positives of Genetic Engineering","items":["Genetic engineering is the practice of manipulating the genes of an organism.","It is used to produce crops that are more resistant to insects and diseases.","Some genetically modified crops grow more quickly.","Some drugs and vaccines are produced by genetic engineering.","It may become possible to change humans’ genetic characteristics.","Scientists may use genetic engineering to cure diseases.","Inherited illnesses would no longer exist.","Genes could be changed before a baby is born.","It could also be possible to clone human organs.","We could all have replacement body parts.","Humans could live longer, healthier lives."]},{"h":"Negatives of Genetic Engineering","items":["There are ethical concerns about human genetic engineering.","Parents might want to choose their children’s characteristics.","This would be unnatural.","It would be unacceptable in most religions.","Soldiers could be cloned from the genes of the strongest people.","Clones might be used like robots to do certain jobs.","Clones might even be developed just for organ replacements.","Society and human evolution would change completely.","Currently, human genetic engineering is prohibited."]},{"h":"ielts-simon.com","items":[]},{"h":"Genetically-Modified (GM) Foods: Advantages","items":["Farmers can produce crops that grow bigger and faster.","Some GM crops are more resistant to disease or insects.","This could be important for food production in developing countries.","Faster growing cereals, fruit and vegetables will mean more profit.","GM foods can be modified to look perfect.","They may be more attractive to customers."]},{"h":"Genetically-Modified (GM) Foods: Disadvantages","items":["There may be risks involved in the genetic engineering of foods.","GM crops might change whole ecosystems.","Food chains could be broken if crops are resistant to predators.","Organic foods are produced without chemicals or genetic modification.","Organic farming may be slower and more expensive.","However, the environment is not damaged by fertilisers or pesticides."]}],"wd":[["genetically modified","genetik o'zgartirilgan"],["clone","klonlamoq"],["inherited illness","irsiy kasallik"],["ethical concerns","axloqiy xavotirlar"],["organic food","organik oziq-ovqat"],["pesticide","pestitsid"]]},{"title":"Global Issues","groups":[{"h":"Problems in Developing Countries","items":["Developing countries face a range of problems.","Standards of healthcare and education are low.","Life expectancy is usually lower than in developed countries.","There is a lack of infrastructure, employment and good quality housing.","Many people are forced to live in poverty.","Food, drinking water and basic medicines are in short supply."]},{"h":"How to Help Developing Countries","items":["The best form of help for developing countries is development aid.","Richer nations can help by investing in long-term projects."]},{"h":"ielts-simon.com","items":["Governments and charities can help by building new houses and schools.","Globalisation may also help developing countries.","Multi-national companies are creating jobs in developing countries.","On the other hand, many people emigrate to find work in richer countries.","They often send money back home to their families.","This money helps to improve the standard of living in developing countries."]},{"h":"Immigration","items":["Some people move to another country in search of a better life.","Many immigrants come from less developed countries.","Richer, industrialised countries may offer opportunities for employment.","Free healthcare and schooling are available in some developed countries.","Other people migrate to a foreign country to improve their academic qualifications."]},{"h":"Positives of Immigration and Multi-Cultural Societies","items":["From an economic perspective, immigration can be extremely positive.","Many immigrants have skills that are needed in the country they move to.","Immigrants who find work contribute to the economy of their new country.","Many immigrants send money home to help family members.","Immigration also creates cultural diversity.","People of many different nationalities learn to live together.","This can help people to become more open-minded and tolerant."]},{"h":"Negatives of Immigration","items":["Some people believe that immigrants take jobs that should go to local people.","Some immigrant workers work longer hours for less money.","Companies might pay lower salaries to immigrant workers.","Unemployment rates could rise if there are too many immigrants."]},{"h":"Opinions about Immigration","items":["Immigration can help the economy of a country."]},{"h":"ielts-simon.com","items":["It can create multi-cultural societies.","However, immigration needs to be controlled.","In many countries, immigrants need visas or work permits.","Governments should stop companies from exploiting immigrant workers.","Foreign and local workers should have the right to equal pay and conditions."]},{"h":"Positives of Globalisation","items":["Business is becoming increasingly international.","Multi-national companies do business across the world.","Companies like MacDonald’s can be seen on high streets in most cities.","Goods are produced in one country and sold in many others.","A global economy means free trade between countries.","This can strengthen political relationships.","Globalisation can also create opportunities for employment.","It encourages investment in less developed countries.","It could reduce poverty in the developing world."]},{"h":"Negatives of Globalisation","items":["Globalisation is not always beneficial to everyone.","Companies can move to countries where labour is cheap.","This creates redundancies, or job losses.","Employees cannot be confident that they have stable jobs.","Companies sometimes exploit their employees in developing countries.","Global trade creates more waste and pollution."]},{"h":"The Future of Globalisation","items":["There should be global regulations for salaries and working conditions.","Governments should impose laws to protect the environment."]},{"h":"ielts-simon.com","items":[]}],"wd":[["developing countries","rivojlanayotgan mamlakatlar"],["life expectancy","umr davomiyligi"],["immigration","immigratsiya"],["development aid","rivojlanish yordami"],["multicultural society","ko'p madaniyatli jamiyat"],["exploit","ekspluatatsiya qilmoq"]]},{"title":"Government and Society","groups":[{"h":"What governments can do","items":["Governments provide public services like healthcare and education.","They support people who are living in poverty or unable to work.","Governments raise money by taxing working people.","They can spend money on resources and campaigns.","They can introduce new laws.","They can impose taxes.","They can raise people’s awareness of issues (e.g. climate change/healthy eating).","They can influence people’s habits and opinions.","They can create jobs.","They can regulate the activities of companies such as banks.","They can provide resources for schools.","They are also responsible for the security and well-being of their citizens.","They control armed forces and police forces."]},{"h":"Public Services","items":["Governments pay the salaries of public sector workers like police officers and teachers.","The necessary money is raised by taxing people’s income.","Free education and healthcare may be provided by the state.","Some governments control public transport systems and even TV channels.","In other countries, these services are provided by private companies.","Some people believe that competition between private companies is good.","It helps to improve quality while bringing prices down.","Other people think that essential services should be free.","Governments should pay for them."]},{"h":"Censorship: Opinion","items":["Governments can censor what the public sees or reads in the media."]},{"h":"ielts-simon.com","items":["To a certain extent censorship is necessary.","We should use censorship to protect children from violent images.","Some computer games involve killing people or committing crimes.","The Internet also needs to be controlled.","Many websites show pornography and violence.","There should be age limits for websites and computer games.","Parents need to take responsibility for checking what their children watch.","It is impossible for governments to control everything we see."]},{"h":"Video Cameras in Public Places","items":["The use of CCTV is becoming widespread.","Video cameras have been installed in many public places.","They are supposed to protect us and deter criminals.","Many people think that this surveillance violates our privacy.","The authorities could build databases with our pictures and identities.","We should not be treated like criminals."]},{"h":"Smart Cards: Positives","items":["Governments will probably introduce a digital identification card system.","Smart cards will have benefits and drawbacks.","They could help to reduce crime.","They could hold personal information, such as DNA.","Digital bank cards could contain fingerprint information.","It would be very difficult for criminals to use a stolen card.","It would be easier for police to identify people and catch criminals."]},{"h":"Smart Cards: Negatives","items":["Many people are worried about losing their privacy.","Governments could store all our personal and medical information.","This information could be used by insurance companies.","Employers could check our health records."]},{"h":"ielts-simon.com","items":[]},{"h":"People with Disabilities","items":["People with disabilities should be treated the same as everybody else.","They should have the same rights as other people.","They should have access to the same jobs as other citizens.","Discrimination against disabled people is illegal in many countries.","Ramps and lifts for wheelchairs should be installed in public buildings.","Support teachers can be employed to help children with learning difficulties."]}],"wd":[["public services","davlat xizmatlari"],["censorship","senzura"],["surveillance","kuzatuv"],["privacy","shaxsiy daxlsizlik"],["impose taxes","soliq solmoq"],["discrimination","kamsitish"]]},{"title":"Guns and Weapons","groups":[{"h":"Why guns should be legal","items":["In some countries, people are allowed to own firearms.","Individuals have the right to protect themselves.","People can use guns in self defence.","This deters criminals."]},{"h":"Why gun ownership should be illegal","items":["There is a risk of accidents with guns.","The number of violent crimes increases when guns are available.","Criminals may be armed.","The police then need to use guns.","Suicide rates have been shown to rise when guns are available.","Guns create violent societies with high murder rates."]},{"h":"Why police should use guns","items":["Many criminals use weapons.","The threat of a gun can deter criminals.","Police officers can force a criminal to surrender.","It is easier to arrest someone and avoid physical violence."]},{"h":"ielts-simon.com","items":["The police may shoot violent criminals in self defence.","They can protect the public.","They can shoot an escaping criminal who poses a serious danger to the public."]},{"h":"Why police should not carry guns","items":["There is a risk of accidents and mistakes.","The police might shoot an unarmed criminal or an innocent person.","Accidents can happen in public places.","There are several alternatives to guns (e.g. tear gas, sprays and electric shock weapons).","Only special police units should use guns."]},{"h":"Arms Trade: Positives","items":["The export of arms, or weapons, is an extremely controversial issue.","Governments of rich, industrialised countries sell arms to each other.","This industry creates jobs and wealth.","The trade of weapons may improve relationships between governments."]},{"h":"Arms Trade: Negatives","items":["Weapons may be used in conflicts and wars.","The supply of arms could be responsible for deaths.","Governments are promoting war in order to make a profit.","Rich countries can influence the politics of other nations."]},{"h":"Nuclear Weapons","items":["Nuclear weapons are capable of destroying whole cities.","A nuclear war between two countries would destroy both countries.","Nuclear weapons are used as a deterrent.","They prevent wars from starting."]},{"h":"Nuclear Weapons: Opinion","items":["Nuclear weapons should be prohibited.","Governments should limit the production of nuclear weapons."]},{"h":"ielts-simon.com","items":["There is a danger of nuclear weapons being obtained by terrorists.","Nuclear weapons cannot be used against terrorist organisations."]},{"h":"Armed Forces: Positives","items":["Armed forces provide security and protection.","They deter military attack by another country.","They can also be used to maintain peace within countries.","They can be used to give the police extra support.","Soldiers are also used to help in emergency situations, such as after a natural disaster."]},{"h":"Armed Forces: Negatives","items":["Armies require a lot of funding from governments.","Too much money is spent on weapons and military technology.","This money could be spent on schools, hospitals and other public services."]}],"wd":[["firearm","o'qotar qurol"],["self-defence","o'zini himoya qilish"],["arms trade","qurol savdosi"],["nuclear weapons","yadro quroli"],["armed forces","qurolli kuchlar"],["deterrent","to'xtatuvchi vosita"]]},{"title":"Health","groups":[{"h":"Diet","items":["The human body requires a balanced diet.","An unhealthy diet can cause various health problems.","Obesity, diabetes and heart disease are on the increase.","Many people nowadays rely on fast food or pre-prepared meals.","These foods often contain too much fat, salt and sugar.","They are cheap to buy and very easy to prepare.","Many young people have grown up on a diet of convenience foods.","Populations in developed countries are increasingly overweight."]},{"h":"Exercise","items":["Regular exercise is essential in maintaining a healthy body.","Exercise burns calories and helps to build healthy bones and muscles."]},{"h":"ielts-simon.com","items":["Doctors advise exercising at least three times a week for 20 minutes.","Most people nowadays lead a sedentary lifestyle.","We tend to walk less and do desk jobs.","Most adults relax by watching television.","Children play video games rather than doing outdoor sports.","In the past, people were more active in their jobs and at home."]},{"h":"Governments’ Role","items":["Governments have a significant role to play in reducing obesity.","More and more people, including young children, are seriously overweight.","They are at risk of heart disease and diabetes.","This situation will increase the burden on hospitals and taxpayers.","Hospitals rely on the government for money and resources.","Governments should promote a healthy diet and regular exercise.","There should be more time for sport on school timetables.","Unhealthy junk food should be banned from school menus.","People need information about what foods contain.","Food packaging must show the food’s nutritional content.","The British Government recommends eating five portions of fruit and vegetables per day."]},{"h":"State Health Systems: Advantages","items":["Good healthcare should be available to everyone for free.","State healthcare is paid by the government using money from taxes.","Everyone has access to the same quality of care and treatment.","Private healthcare is unfair because only wealthy people can afford it.","The National Health Service in the UK provides free healthcare for every resident."]},{"h":"Private Healthcare: Advantages","items":["State hospitals are often very large and difficult to run.","Private hospitals have shorter waiting lists for operations and appointments.","Patients can benefit from faster treatment."]},{"h":"ielts-simon.com","items":["Many people prefer to pay for a more personal service.","Patients have their own room and more comfortable facilities."]},{"h":"Alternative Medicine: Positives","items":["People are increasingly using alternative medicines to treat illnesses.","For example, acupuncture can be used to treat backache.","Herbal medicines can be used to treat allergies or viruses.","Many patients report positive experiences with these treatments.","Some traditional cures have been used for hundreds of years."]},{"h":"Alternative Medicine: Negatives","items":["Many alternative medicines have not been tested scientifically.","They may have no beneficial effects at all.","They may cause unknown side effects.","People should trust the opinions of qualified doctors.","An illness could get worse without treatment from a doctor."]},{"h":"Stress","items":["Modern lifestyles are increasingly stressful.","People work long hours with strict deadlines.","Our busy lifestyles mean we have less time to relax.","Unemployment is a major cause of stress.","Children may be affected by their parents’ relationship problems.","Tests and exams can also cause stress."]},{"h":"How to Reduce Stress","items":["Stress can be reduced by taking regular exercise and eating a healthy diet.","It is also important to get sufficient sleep and make leisure time a priority.","People should work less overtime and take regular holidays.","Schools have started to employ psychologists.","They can offer emotional support to students."]},{"h":"ielts-simon.com","items":["They can help students to cope with exam stress."]}],"wd":[["obesity","semizlik"],["sedentary lifestyle","kam harakat turmush tarzi"],["balanced diet","muvozanatli ovqatlanish"],["alternative medicine","muqobil tibbiyot"],["side effects","nojo'ya ta'sirlar"],["waiting list","navbat ro'yxati"]]},{"title":"Housing and Architecture","groups":[{"h":"State / Council Housing","items":["In some countries the government provides state or council housing.","This helps people who cannot afford to buy their own house.","It can be argued that state housing creates dependence on the government.","People should not rely on the government to look after them.","People have no incentive to earn money and buy their own home.","Council properties are often made with cheap, poor-quality materials."]},{"h":"Old Buildings","items":["Historic buildings are part of a country’s heritage.","They should be protected.","Old buildings are often considered to be works of art.","They give character to cities and attract tourists.","They show us how people lived in the past.","We identify countries by architectural symbols like the pyramids in Egypt.","Governments should spend money on looking after historic buildings.","They need regular repairs and maintenance.","New buildings should be designed to complement them."]},{"h":"Modern / Green Buildings","items":["Modern buildings should be designed to be environmentally friendly.","They should use less energy and produce less waste.","Modern insulation can make houses more energy-efficient.","Solar and wind power can be used to generate electricity.","Rainwater and waste water can be recycled and used to flush toilets."]},{"h":"ielts-simon.com","items":["Modern glass buildings take advantage of natural light."]}],"wd":[["state housing","davlat uy-joyi"],["heritage","meros"],["historic buildings","tarixiy binolar"],["energy-efficient","energiya tejamkor"],["insulation","izolyatsiya"],["maintenance","ta'mirlash va saqlash"]]},{"title":"Language","groups":[{"h":"English as an International Language","items":["English is widely used around the world.","It is becoming a global second language.","It is the dominant language of technology, science and international business.","International business meetings are regularly held in English.","The most important textbooks and journals are published in English.","The ability to speak English is a necessary skill in the modern world."]},{"h":"Negatives of English as an International Language","items":["If one language is dominant, other languages may disappear.","The dominant language brings its own culture.","American culture has become popular around the world.","Other cultures may be damaged.","As an alternative to English, a new global language could be invented.","It would have no nationality or culture attached to it.","This could help to promote international peace and understanding.","Esperanto is an example of a language that was invented with this aim."]},{"h":"ielts-simon.com","items":[]}],"wd":[["international language","xalqaro til"],["dominant language","hukmron til"],["global second language","global ikkinchi til"],["cultural identity","madaniy o'ziga xoslik"],["disappear","yo'qolib ketmoq"],["invented language","sun'iy yaratilgan til"]]},{"title":"Money","groups":[{"h":"Money and Society","items":["Society has become increasingly materialistic.","People aspire to earn more money.","They want a bigger house or a better car.","We connect wealth and material possessions with happiness and success.","Brands like ‘Armani’ or ‘Mercedes’ are status symbols.","Advertising creates new desires and needs.","It persuades us to buy the latest styles."]},{"h":"Positives of Consumerism","items":["Consumerism creates employment.","It helps to reduce poverty.","It encourages innovation and creativity in business.","We live in a global economy.","We have a better quality of life."]},{"h":"Negatives of Consumerism","items":["Consumerist societies create more waste.","They use more natural resources.","They cause damage to the environment.","Consumerism creates a “throw-away” culture.","Advertisers tell us who we are and what we want.","Wealth does not lead to happiness.","Materialism causes greed and crime.","We should return to traditional values like sharing."]},{"h":"ielts-simon.com","items":[]}],"wd":[["materialistic","moddiyatparast"],["status symbol","maqom belgisi"],["consumerism","iste'molchilik"],["throw-away culture","bir martalik madaniyat"],["greed","ochko'zlik"],["innovation","innovatsiya"]]},{"title":"Personality","groups":[{"h":"Happiness","items":["Happiness means different things to different people.","It can be described as a feeling of pleasure or enjoyment.","People enjoy spending time with family and friends.","Hobbies, sports and games can be a source of fun and enjoyment.","Some people see money as a source of happiness.","Other people define happiness as something deeper.","In order to be truly happy it is necessary to live a good life.","We need to feel that we are doing something useful with our lives.","Some people get a sense of achievement from their work.","Others find happiness in bringing up their children.","Religion or a sense of purpose can also be a source of happiness."]},{"h":"Success","items":["People define success in different ways.","Some people get a sense of achievement from raising a family.","For others, success is defined by wealth or status.","We often think of rich and famous people as being successful in life.","Millionaires like Bill Gates are considered to be successful.","They have risen to the top in their chosen professions.","For some, being successful means achieving personal or professional goals.","They see success as the result of hard work.","Success in any field requires long-term planning and effort."]},{"h":"Nature or Nurture","items":["Some people believe that our personalities are determined mainly by genetics.","We inherit our abilities and talents from our parents.","Others think that our education and upbringing are more important."]},{"h":"ielts-simon.com","items":["We develop according to the influences around us.","Our personalities and achievements depend more on nurture than nature.","Many people argue that we control our own destinies.","We can shape our own personalities.","By working hard we can achieve any goal that we put our minds to.","Many successful people are “self-made”.","We are not limited by our genetic characteristics or upbringing."]}],"wd":[["sense of achievement","yutuq hissi"],["nature or nurture","tabiat yoki tarbiya"],["inherit","meros qilib olmoq"],["self-made","o'zini o'zi yaratgan"],["personal goals","shaxsiy maqsadlar"],["long-term planning","uzoq muddatli rejalashtirish"]]},{"title":"Sport and Leisure","groups":[{"h":"Arguments against Professional / Competitive Sport","items":["Sport has become a business.","Professional sport encourages people to compete for money.","Many sports stars are only concerned about money and fame.","Some athletes take drugs in order to win at any cost.","Competitors are often selfish and rude.","They are not good role models for children.","All sports should be amateur.","Sports should be leisure activities rather than jobs.","People should do sporting activities for enjoyment and health reasons.","Taking part is more important than winning."]},{"h":"Arguments for Professional Sport","items":["Professional sports are the same as any other business.","Many people are employed in the sports industry.","People should be able to use their talents to earn a salary.","Sports stars entertain millions of people.","Money is necessary to improve facilities and train athletes.","The level of professional sport is much higher than that of amateur sport."]},{"h":"ielts-simon.com","items":[]},{"h":"Arguments for Competitive Sport","items":["Competition is a natural instinct in humans.","In daily life we compete to get jobs or the highest grades.","Sports are a safe form of competition.","Competition is healthy because it pushes us to give our best.","Competitors and fans can release energy and aggression.","Supporters of teams feel a sense of belonging to a community."]},{"h":"Opinion: professional sport salaries are too high","items":["Sports professionals earn too much money.","They do not provide a vital service.","Football players, for example, earn enormous salaries by simply kicking a ball.","We could all live happily without professional football.","Life would be difficult without doctors, engineers and other vital professionals.","Society does not seem to value these professions as highly as professional sport.","Sports salaries should be compatible with the wages most people earn."]},{"h":"Opinion: professional sport salaries are fair","items":["It is fair that the best professionals earn a lot of money.","Sport is a multi-million-pound industry.","There is a large audience of sports fans.","Sports on television attract many viewers.","Sports stars have dedicated hours of practice to developing their fitness and skills.","Only the most talented among them will reach the top.","A sports career may only last 10 years.","Sports fans are willing to pay to support their teams."]},{"h":"Sport and Politics","items":["Some people think that sport and politics should remain separate.","Governments are involved in the hosting of sporting events such as the Olympics.","These events attract investment and create jobs."]},{"h":"ielts-simon.com","items":["The Olympic Games are an advertisement for the host nation.","They attract huge numbers of visitors and sports fans.","Wealthy countries tend to hold these events.","Developing countries should be given the chance to become hosts."]}],"wd":[["professional sport","professional sport"],["amateur","havaskor"],["role model","ibrat, o'rnak"],["competitive","raqobatbardosh"],["salary","maosh"],["host nation","mezbon davlat"]]},{"title":"Television, Internet, Phones","groups":[{"h":"Positives of Television","items":["Watching television is a good way to relax.","It is many people’s favourite way to wind down after a hard day at work.","Television programmes can be entertaining and enjoyable.","Viewers have access to a huge variety of entertainment channels.","Television brings the best comedians, musicians and actors into our homes.","Programmes can also be informative and educational.","News coverage makes the public aware of events around the world.","Documentaries can make learning more interesting."]},{"h":"Negatives of Television","items":["Television is having a negative impact on society.","Some people link violence on television with crime rates in the real world.","Children copy the behaviour they see on the screen.","Children are less healthy because they spend less time playing.","Advertisers direct their marketing at children.","Most programmes do not require much thought.","Watching TV is a waste of time."]},{"h":"Opinions about Television","items":["Television has many benefits.","However, it can be addictive."]},{"h":"ielts-simon.com","items":["Children should play outside rather than sit in front of a screen all day.","Behaviour shown on TV can influence people.","Parents should choose carefully what their children watch.","Children should not be exposed to violence, swearing or sexual images.","Advertising during children’s programmes should be strictly controlled.","TV companies should make more positive, educational programmes."]},{"h":"Positives of the Internet","items":["There are many advantages to using the Internet.","It gives us instant access to information on almost any subject.","Shops and other services are now available online.","People can buy goods and services from the comfort of their homes.","The Internet is starting to replace other forms of entertainment.","It has revolutionised communication.","We can keep in touch by e-mail or instant messenger services.","Video messaging is becoming common for business meetings."]},{"h":"Negatives of the Internet","items":["Many websites contain offensive content.","Some sites show violent or sexual images.","Parents find it difficult to control what their children see online.","They do not always know who their children are chatting to.","With so many websites it is difficult to search for good information.","Criminals increasingly use the Internet to steal people’s money."]},{"h":"Internet Compared to Newspapers and Books","items":["Newspapers and books are now published online as well as in print.","We can read the news in any language from any country in the world.","It costs nothing to publish or access information on the Internet.","The Internet allows anybody to publish their own writing.","Newspaper articles and books are written by professionals."]},{"h":"ielts-simon.com","items":["Professionals produce better quality writing than amateurs.","People still buy newspapers and books because they are portable.","People do not like reading from a screen."]},{"h":"Positives of Mobile Phones","items":["The mobile phone is the most popular gadget in today’s world.","Mobile phones have revolutionised the way we communicate.","We can stay in touch with family, friends and colleagues wherever we are.","Users can send text messages, surf the Internet, take photos and listen to music.","Mobiles have also become fashion accessories."]},{"h":"Negatives of Mobile Phones","items":["Mobile phones can be a problem in some public places.","Ringing phones cause disturbances in cinemas and school lessons.","Some people are not aware that others can hear their conversations.","Mobile phones may also interfere with electronic equipment.","Their waves could cause damage to our brains.","Mobile phones can also be a dangerous distraction.","Using a phone while driving reduces the driver’s concentration.","Mobile phones are a popular target for thieves."]},{"h":"Opinion about Mobile Phones","items":["The benefits of mobile phones outweigh the drawbacks.","We need to use these phones with care."]},{"h":"ielts-simon.com","items":[]}],"wd":[["informative","ma'lumot beruvchi"],["addictive","qaramlik paydo qiluvchi"],["offensive content","haqoratli kontent"],["revolutionise","tubdan o'zgartirmoq"],["distraction","chalg'itish"],["instant access","zudlik bilan kirish"]]},{"title":"Tourism","groups":[{"h":"Positives of Tourism","items":["Tourism is a popular leisure activity.","People go on holiday to relax and have fun.","Tourists can experience different cultures.","They can sunbathe on beaches or go sight-seeing.","Travelling abroad opens our minds.","We can learn to speak other languages.","The tourist trade is vital for some economies.","It creates employment in services like accommodation, transport and entertainment.","Some areas rely on tourism for their income.","Tourists spend money.","Tourism attracts investment from multi-national companies.","It helps to improve the standard of living.","Low-cost airlines are making it cheaper to travel abroad."]},{"h":"Negative Effects of Tourism","items":["Tourism can have a negative effect on the natural environment.","The building of facilities and infrastructure can destroy the habitat of wild animals.","Beautiful beaches are spoilt by the building of hotels.","Tourism creates pollution and waste.","It puts pressure on local resources.","Local traditions and cultures may be endangered.","A rise in the cost of living affects local people.","The price of goods, services and housing may increase significantly."]},{"h":"The Future of Tourism","items":["Governments should introduce laws to protect natural environments and local cultures.","Tourism should have a low impact on wildlife."]},{"h":"ielts-simon.com","items":["Renewable resources like solar or water power should be used.","Waste should be recycled.","Local businesses such as farms should be supported."]}],"wd":[["sight-seeing","diqqatga sazovor joylarni ko'rish"],["infrastructure","infratuzilma"],["accommodation","turar joy"],["low-cost airline","arzon aviakompaniya"],["local culture","mahalliy madaniyat"],["put pressure on","bosim o'tkazmoq"]]},{"title":"Traditional vs. Modern","groups":[{"h":"Losing Traditional Skills","items":["Because of industrialisation and global trade, many traditions have disappeared.","Global advertising encourages everyone to buy the same products.","Most products are now made in factories.","Machinery has replaced skilled human labour.","Factory work is boring and leaves people feeling unfulfilled.","Goods are produced very quickly and in large numbers.","Products are cheaper, which means that more people can buy them."]},{"h":"Examples","items":["Clothes are mass produced in standard sizes.","People wear similar clothes, rather than traditional costumes.","Jeans and T-shirts are now worn throughout the world.","Historic buildings took skilled craftsmen years to build.","Modern concrete, steel and glass buildings are built in only weeks or months.","There are fewer people who can create hand-made goods."]},{"h":"Traditional Customs","items":["Traditional customs are still important during weddings and religious festivals.","People wear traditional costumes and eat special foods.","It is important to maintain our different cultural identities.","We should celebrate festivals, teach traditional skills and protect historic places."]},{"h":"ielts-simon.com","items":[]}],"wd":[["mass produced","ommaviy ishlab chiqarilgan"],["craftsman","hunarmand"],["traditional customs","an'anaviy urf-odatlar"],["industrialisation","industrlashtirish"],["hand-made","qo'lda yasalgan"],["unfulfilled","qoniqmagan"]]},{"title":"Transport","groups":[{"h":"Traffic Problems","items":["Traffic congestion is caused by commuters travelling to work.","Most people live in the suburbs outside city centres.","Commuters tend to travel at the same time of day.","They tend to travel alone.","Cars and road space are not used efficiently.","This causes traffic jams during the rush hour."]},{"h":"Traffic Solutions","items":["In order to reduce traffic we should change our working habits.","The Internet can now be used to connect people.","More people could work from home.","Meetings can be held as video conferences.","Workers could be given flexible timetables.","Another solution would be to tax drivers.","Workers should share their cars and travel together.","In London, for example, there is a congestion charge.","This helps to raise money for better public transport.","Public transport needs to be reliable and efficient."]},{"h":"Positives of Public Transport","items":["We need to reduce our dependence on cars.","Parking a car can be extremely difficult in big cities.","Well-designed transport systems are comfortable and convenient.","Modern public transport can be fast and cheap.","Public transport can help to reduce pollution in cities.","Investment in buses and trains will ease traffic congestion.","Buses can be given special lanes to avoid traffic."]},{"h":"ielts-simon.com","items":[]},{"h":"Negatives of Public Transport","items":["Public transport is often slow and unreliable.","Metro systems and trains are often dirty and crowded.","People feel like “sardines in a can”.","Cars are much more comfortable."]},{"h":"Road Safety","items":["Driving while tired or drunk is extremely dangerous.","Mobile phones can be a dangerous distraction for drivers.","They draw the driver’s attention away from the road.","The use of phones while driving has been banned in many countries.","Punishments are becoming stricter.","Television campaigns are used to remind people to drive safely.","Speed cameras have become more common.","Speed bumps are another form of traffic calming.","Many streets are designed with the aim of slowing traffic down."]}],"wd":[["commuter","har kuni qatnovchi"],["rush hour","gavjum soat"],["congestion charge","tirbandlik solig'i"],["public transport","jamoat transporti"],["speed camera","tezlik kamerasi"],["road safety","yo'l xavfsizligi"]]},{"title":"Water","groups":[{"h":"Importance of Clean Water","items":["Water is an essential natural resource.","Humans need access to clean, safe drinking water in order to live.","Poor water quality is a major cause of disease and death in some countries.","Water usually needs to be treated before we can drink it.","Developing countries often lack the means to treat and supply water to citizens.","Developed countries tend to have much better sanitation.","Citizens have access to clean tap water.","Drinking water is not contaminated by sewage or waste water.","The supply of clean water would improve public health in many developing countries."]},{"h":"ielts-simon.com","items":[]},{"h":"Water Supply","items":["Urban life would be impossible without water supply systems.","These systems are massive engineering projects.","Many professionals are involved in their planning, construction an async function ai(prompt){
  if(window.claude&&window.claude.use){const sm=await window.claude.use('sample').catch(()=>null);if(sm){const r=await sm(prompt);return r.text}}
  const px=cfg.proxy||DEFAULT_PROXY;if(px){const r=await fetch(px,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});const j=await r.json();if(!j.text)throw new Error(j.error||'Proxy javob bermadi');return j.text}
  if(!cfg.key)throw new Error('Gemini API kalit kiritilmagan. Admin → AI sozlamalari bo\'limiga kiriting.');
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(cfg.model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:.3,responseMimeType:'application/json'}})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||('Xato '+r.status));
  return j.candidates[0].content.parts.map(p=>p.text||'').join('');
}

  const qs=(lab,t,a)=>`<section class="card"><div class="ch2">${pt(lab)}<h3>${t}</h3></div>${a.map((x,i)=>`<h4>${i+1}-savol</h4><p class="prompt">${h(x.q)}</p>${det('Namuna javob',x.a)}`).join('')}</section>`;
  return qs('Part 1.1','30 soniya, tayyorgarliksiz',d.p11)+qs('Part 1.2','45 va 30 soniya',d.p12)+
  `<section class="card"><div class="ch2">${pt('Part 2')}<h3>1 daqiqa tayyorgarlik, 2 daqiqa</h3></div><div class="prompt">${d.p2.prompts.map(x=>h(x)).join('<br>')}</div>${det('Namuna javob',d.p2.a)}</section>
  <section class="card"><div class="ch2">${pt('Part 3')}<h3>Muhokama</h3></div><p class="prompt">${h(d.p3.topic)}</p><div class="cols"><div class="pro"><h4>For</h4>${ul(d.p3.for)}</div><div class="con"><h4>Against</h4>${ul(d.p3.against)}</div></div>${det('Namuna javob',d.p3.a)}</section>`;
}
function wView(d){
  const W=words(S.sec,S.day),ad=isAdmin();
  const rows=W.map(w=>`<div class="w"><div><b>${h(w[0])}</b>${w[2]?`<em>${h(w[2])}</em>`:''}<span data-a="rev">${h(w[1])}</span></div><button class="sm" data-a="spk" data-w="${h(w[0])}" aria-label="Eshitish">${ico}</button><a class="sm" href="${camb(w[0])}" target="_blank" rel="noopener">Cambridge</a>${ad?`<button class="sm" data-a="delw" data-w="${h(w[0])}" aria-label="O'chirish">✕</button>`:''}</div>`).join('');
  const add=ad?`<div class="card"><h3>So'z qo'shish</h3><label for="nw">Inglizcha</label><input id="nw"><label for="nu">${S.sec==='s'?'Ma\'nosi':'O\'zbekcha'}</label><input id="nu"><div class="row"><button class="btn" data-a="addw">Qo'shish</button></div></div>`:'';
  return `<section class="card${S.hide?' hide':''}"><div class="ch2"><h3>Kunlik so'zlar (${W.length})</h3></div><p class="note">${S.sec==='s'?'Key Vocabulary: so\'z, turi va inglizcha ma\'nosi.':'Namuna javoblardan olingan asosiy so\'zlar.'}</p><div class="row" style="margin:8px 0 4px"><button class="btn ghost" data-a="hidet">${S.hide?'Tarjimani ko\'rsatish':'Yodlash rejimi'}</button></div>${S.hide?'<p class="note">Tarjima yashirilgan. Ko\'rish uchun ustiga bosing.</p>':''}${rows||'<p>So\'z yo\'q.</p>'}</section>${add}`;
}
function mkQuiz(){
  const W=words(S.sec,S.day);let pool=[...W];
  if(pool.length<8)for(let k=1;k<=SEC[S.sec].c&&pool.length<20;k++)if(k!==S.day)pool.push(...words(S.sec,k).slice(0,3));
  const Q=shuf(W).slice(0,10).map(w=>{const f=Math.random()<.5,a=f?w[1]:w[0];let o=[];for(const p of shuf(pool)){const t=f?p[1]:p[0];if(t!==a&&!o.includes(t))o.push(t);if(o.length>=3)break}
    o.push(a);o=shuf(o);return{q:f?w[0]:w[1],o,a:o.indexOf(a),f}});
  return Q;
}
function qInit(Q){S.quiz={k:pk(),Q,i:0,sel:null,ok:0,bad:[]}}
function tView(){
  if(!S.quiz||S.quiz.k!==pk())qInit(mkQuiz());
  const z=S.quiz,Q=z.Q,best=P[pk()]?.t;
  if(z.i>=Q.length){const pc=Math.round(z.ok/Q.length*100);
    return `<section class="card"><h3>Natija</h3><div class="score"><b>${pc}%</b><span>${z.ok} / ${Q.length} to'g'ri</span></div><div class="bar2"><i style="width:${pc}%"></i></div><p>${pc>=80?'Ajoyib natija!':pc>=50?'Yaxshi. Yana bir marta urinib ko\'ring.':'So\'zlarni takrorlab, testni qayta ishlang.'}</p>${z.bad.length?`<h4>Xato qilingan savollar</h4>${z.bad.map(x=>`<p style="margin:8px 0"><b>${h(x.q)}</b><br><span class="note">To'g'ri javob: ${h(x.o[x.a])}</span></p>`).join('')}`:''}<div class="row"><button class="btn" data-a="newq">Qayta urinish</button><button class="btn alt" data-a="aiq">AI bilan yangi test</button></div><p class="note" id="aiq"></p></section>`}
  const q=Q[z.i];
  return `<section class="card"><div class="qtop"><span>${z.i+1} / ${Q.length}</span><span>${best!=null?'Eng yaxshi: '+best+'%':''}</span></div><div class="bar2"><i style="width:${z.i/Q.length*100}%"></i></div><p class="qq">${h(q.q)}</p><div class="qb">${q.o.map((o,j)=>`<button class="opt${z.sel!=null?(j===q.a?' ok':j===z.sel?' no':''):''}" data-a="pick" data-i="${j}"${z.sel!=null?' disabled':''}>${h(o)}</button>`).join('')}</div>${z.sel!=null?`<div class="row"><button class="btn" data-a="next">${z.i+1>=Q.length?'Natijani ko\'rish':'Keyingisi'}</button></div>`:''}</section>`;
}
function tasks(d){
  if(S.sec==='w')return[['p11','Part 1.1 · Norasmiy xat',d.sit.replace('\n\n','\n')+'\n'+d.t11],['p12','Part 1.2 · Rasmiy xat',d.t12],['p2','Part 2 · Blog post',d.q2]];
  const r=[];d.p11.forEach((x,i)=>r.push(['p11-'+i,'Part 1.1 · '+(i+1)+'-savol',x.q]));d.p12.forEach((x,i)=>r.push(['p12-'+i,'Part 1.2 · '+(i+1)+'-savol',x.q]));
  r.push(['p2','Part 2',d.p2.prompts.join(' ')]);r.push(['p3','Part 3',d.p3.topic+' (For: '+d.p3.for.join('; ')+' Against: '+d.p3.against.join('; ')+')']);return r;
}
function summary(){
  const p=pd(),mx=MAX[S.sec],parts=Object.keys(mx);let tot=0,n=0,rows='';
  for(const k of parts){const bs=Object.entries(p.b).filter(([x])=>x.split('-')[0]===k).map(x=>x[1]);const v=bs.length?Math.round(bs.reduce((a,b)=>a+b,0)/bs.length*2)/2:null;if(v!=null){tot+=v;n++}rows+=`<tr><td>${k.replace('p','Part ').replace('11','1.1').replace('12','1.2')}</td><td>${v==null?'—':v+' / '+mx[k]}</td></tr>`}
  const all=Object.values(mx).reduce((a,b)=>a+b,0);
  return `<section class="card"><h3>Kun natijasi</h3><table>${rows}</table>${n===parts.length?`<div class="score"><b>${tot}/${all}</b><span>Standart ball: <strong>${conv(TT[S.sec],tot)}</strong> / 75</span></div>`:`<p class="note">Umumiy ball chiqishi uchun barcha qismlarni tekshiring (${n}/${parts.length}).</p>`}</section>`;
}
function cView(d){
  const T=tasks(d);if(!S.tk||!T.find(t=>t[0]===S.tk))S.tk=T[0][0];
  const t=T.find(x=>x[0]===S.tk),spkr=S.sec==='s';
  return summary()+`<section class="card"><h3>AI tekshiruv</h3><label for="ts">Qism</label><select id="ts">${T.map(x=>`<option value="${x[0]}"${x[0]===S.tk?' selected':''}>${h(x[1])}</option>`).join('')}</select>
  <p style="margin-top:10px"><strong>Savol:</strong> ${nl(t[2])}</p><label for="ans">${spkr?'Javobingiz (gapiring yoki yozing)':'Matningiz'}</label><textarea id="ans" placeholder="${spkr?'Mikrofon tugmasini bosib gapiring...':'Shu yerga yozing...'}"></textarea>
  <p class="note" id="wc">0 so'z</p><div class="row">${spkr?'<button class="btn ghost mic" data-a="mic" id="mic">Mikrofon</button>':''}<button class="btn" data-a="check" id="chk">AI bilan tekshirish</button></div>
  ${spkr?'<p class="note">Speaking mezonlari kitobda berilmagan, shuning uchun umumiy CEFR mezonlari ishlatiladi. Talaffuz baholanmaydi.</p>':''}
  <div id="res">${resHtml(P[pk()]?.r?.[S.tk])}</div></section>`;
}
function resHtml(r){
  if(!r)return'';
  const mx=MAX[S.sec][S.tk.split('-')[0]];
  return `<hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><div class="score"><b>${r.band}/${mx}</b><span>Daraja: ${h(r.level)}</span></div><div class="bar2"><i style="width:${r.band/mx*100}%"></i></div>
  <h4>Mezonlar</h4><ul>${(r.criteria||[]).map(c=>`<li><b>${h(c.name)}:</b> ${h(c.note)}</li>`).join('')}</ul>
  ${(r.errors||[]).length?`<h4>Xatolar</h4><ul>${r.errors.map(e=>`<li><s>${h(e.wrong)}</s> → <b>${h(e.right)}</b><br><span class="note">${h(e.why)}</span></li>`).join('')}</ul>`:''}
  <h4>Maslahat</h4><p>${h(r.feedback)}</p>${det('Yaxshilangan variant',r.improved)}<p class="note">AI bahosi taxminiy, rasmiy imtihon natijasi emas.</p>`;
}
function admin(){
  const us=Object.entries(users).map(([k,u])=>`<tr><td>${h(u.n)}</td><td>${u.admin?'admin':'o\'quvchi'}</td><td>${u.admin?'':`<button class="sm" data-a="delu" data-u="${k}">O'chirish</button>`}</td></tr>`).join('');
  return shell(`<h1>Admin</h1><section class="card"><h3>AI sozlamalari (Gemini)</h3><label for="ak">API kalit</label><input id="ak" type="password" value="${h(cfg.key)}" autocomplete="off"><label for="am">Model nomi</label><input id="am" value="${h(cfg.model)}"><label for="ap">Proxy manzili (ixtiyoriy)</label><input id="ap" value="${h(cfg.proxy)}" placeholder="https://...">
  <p class="note">Kalitni Google AI Studio'dan oling. Sayt ochiq bo'lsa, kalitni proxy (server) orqali ulang: proxy {prompt} qabul qilib {text} qaytarsin.</p><div class="row"><button class="btn" data-a="savecfg">Saqlash</button></div></section>
  <section class="card"><h3>Foydalanuvchilar</h3><table>${us}</table><label for="nu1">Yangi login</label><input id="nu1" autocapitalize="off"><label for="np1">Parol</label><input id="np1"><div class="row"><button class="btn" data-a="addu">O'quvchi qo'shish</button></div></section>
  <section class="card"><h3>Ma'lumotlar</h3><p class="note">So'zlarni kunlar ichida "So'zlar" bo'limida qo'shasiz va o'chirasiz.</p><div class="row"><button class="btn ghost" data-a="exp">Zaxira nusxa (yuklab olish)</button><button class="btn ghost" data-a="imp">Zaxirani yuklash</button><button class="btn ghost" data-a="rst">Mening natijalarimni tozalash</button></div><input type="file" id="fi" accept=".json" hidden></section>`,true);
}
function render(){
  const a=$('#app');document.body.dataset.sec=S.sec;
  if(!S.u){a.innerHTML=login();return}
  a.innerHTML=S.view==='admin'?admin():S.day?day():home();
}

/* ---------- actions ---------- */
const act={
  home(){S.day=0;S.view='home';S.tk=null;render();scrollTo(0,0)},
  sec(t){S.sec=t.dataset.s;render()},
  day(t){S.day=+t.dataset.d;S.tab='q';S.tk=null;S.quiz=null;render();scrollTo(0,0)},
  tab(t){S.tab=t.dataset.t;render()},
  out(){localStorage.removeItem('cefr_sess');S.u=null;S.day=0;S.view='home';render()},
  admin(){S.view='admin';render();scrollTo(0,0)},
  spk(t){spk(t.dataset.w)},
  addw(){const a=$('#nw').value.trim(),b=$('#nu').value.trim();if(!a||!b)return toast('Ikkala maydonni to\'ldiring');const e=E[pk()]=E[pk()]||{};(e.add=e.add||[]).push([a,b]);sv('cefr_e',E);render()},
  delw(t){const e=E[pk()]=E[pk()]||{},w=t.dataset.w;const i=(e.add||[]).findIndex(x=>x[0]===w);if(i>=0)e.add.splice(i,1);else(e.del=e.del||[]).push(w);sv('cefr_e',E);render()},
  pick(t){const z=S.quiz;if(z.sel!=null)return;z.sel=+t.dataset.i;const q=z.Q[z.i];if(z.sel===q.a)z.ok++;else z.bad.push(q);render()},
  next(){const z=S.quiz;z.i++;z.sel=null;if(z.i>=z.Q.length){const p=pd(),pc=Math.round(z.ok/z.Q.length*100);if(p.t==null||pc>p.t)p.t=pc;saveP()}render()},
  hidet(){S.hide=!S.hide;render()},
  rev(t){if(S.hide)t.classList.toggle('rev')},
  newq(){S.quiz=null;render()},
  async aiq(t){
    const n=$('#aiq');n.textContent='AI savollar tuzmoqda...';
    try{const d=D[S.sec][S.day-1],W=words(S.sec,S.day).slice(0,25).map(w=>w[0]).join(', ');
      const Q=await aj(`Create 8 multiple-choice English vocabulary and usage questions for CEFR B2 learners on the topic "${dayTitle(d)}", using these words: ${W}. Return ONLY a JSON array: [{"q":"question or gap-fill sentence","o":["a","b","c","d"],"a":<index of correct option>}].`);
      qInit(Q.filter(x=>x.o&&x.o.length===4&&Number.isInteger(x.a)));render();
    }catch(e){n.innerHTML='<span class="err">'+h(e.message)+'</span>'}
  },
  async check(){
    const txt=$('#ans').value.trim();if(txt.split(/\s+/).length<3)return toast('Avval javob yozing yoki gapiring');
    const d=D[S.sec][S.day-1],t=tasks(d).find(x=>x[0]===S.tk),b=$('#chk');b.disabled=true;b.textContent='Tekshirilmoqda...';
    try{const r=await aj(gradePrompt(S.sec,S.tk,t[2],txt));const mx=MAX[S.sec][S.tk.split('-')[0]];r.band=Math.max(0,Math.min(mx,Math.round(+r.band)));
      const p=pd();p.b[S.tk]=r.band;p.r[S.tk]=r;saveP();render();$('#ans').value=txt;
    }catch(e){$('#res').innerHTML='<p class="err">'+h(e.message)+'</p>';b.disabled=false;b.textContent='AI bilan tekshirish'}
  },
  mic(t){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Ovoz tanish uchun Chrome kerak. Matn yozib ham javob berishingiz mumkin.');
    if(act.rec){act.rec.stop();return}
    const r=act.rec=new SR();r.lang='en-US';r.continuous=true;r.interimResults=true;const ta=$('#ans'),base=ta.value?ta.value+' ':'';
    r.onresult=e=>{ta.value=base+Array.from(e.results).map(x=>x[0].transcript).join(' ');ta.dispatchEvent(new Event('input',{bubbles:true}))};
    r.onend=()=>{act.rec=null;const m=$('#mic');if(m){m.classList.remove('on');m.textContent='Mikrofon'}};
    r.onerror=e=>toast('Mikrofon xatosi: '+e.error);r.start();t.classList.add('on');t.textContent='To\'xtatish';
  },
  savecfg(){cfg={key:$('#ak').value.trim(),model:$('#am').value.trim()||'gemini-2.5-flash',proxy:$('#ap').value.trim()};sv('cefr_cfg',cfg);toast('Saqlandi')},
  addu(){const u=$('#nu1').value.trim(),p=$('#np1').value;if(!u||p.length<4)return toast('Login kiriting, parol kamida 4 belgi');const k=u.toLowerCase();if(users[k])return toast('Bu login band');users[k]={n:u,h:hs(u,p)};sv('cefr_users',users);render()},
  delu(t){delete users[t.dataset.u];sv('cefr_users',users);render()},
  exp(){const b=new Blob([JSON.stringify({cfg,users,E,P:Object.fromEntries(Object.keys(localStorage).filter(k=>k.startsWith('cefr_p_')).map(k=>[k,ld(k)]))})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cefr-zaxira.json';a.click()},
  imp(){$('#fi').click()},
  rst(){if(confirm('Natijalaringiz o\'chiriladi. Davom etasizmi?')){P={};saveP();toast('Tozalandi')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&act[t.dataset.a])act[t.dataset.a](t)});
document.addEventListener('change',e=>{
  if(e.target.id==='ts'){S.tk=e.target.value;render()}
  if(e.target.id==='fi'&&e.target.files[0]){const f=new FileReader();f.onload=()=>{try{const j=JSON.parse(f.result);cfg=j.cfg||cfg;users=j.users||users;E=j.E||E;sv('cefr_cfg',cfg);sv('cefr_users',users);sv('cefr_e',E);Object.entries(j.P||{}).forEach(([k,v])=>sv(k,v));loadP();toast('Yuklandi');render()}catch{toast('Fayl noto\'g\'ri')}};f.readAsText(e.target.files[0])}
});
document.addEventListener('input',e=>{if(e.target.id==='ans')$('#wc').textContent=(e.target.value.trim()?e.target.value.trim().split(/\s+/).length:0)+' so\'z'});
document.addEventListener('submit',e=>{
  if(e.target.id!=='lf')return;e.preventDefault();
  const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value,x=users[u];
  if(x&&x.h===hs(u,p)){S.u=u;sv('cefr_sess',u);loadP();render()}else $('#le').textContent='Login yoki parol noto\'g\'ri.';
});
if(S.u&&!users[S.u])S.u=null;
if(S.u)loadP();
render();
</script>
