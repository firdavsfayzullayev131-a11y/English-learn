king together on a project, and every student had a specific role and responsibility. However, when the project was finished, there was some disagreement about how the work should be evaluated. A few students felt that their efforts were not being recognized fairly, while others believed that everyone had contributed equally. Fairness was necessary in that situation because the final result depended on the effort of the whole group. If some students received more credit than they deserved while others were ignored, it could create frustration and reduce motivation. Our teacher carefully reviewed the work that each student had done and tried to evaluate everyone’s contribution objectively. By doing this, the teacher made sure that the final evaluation was balanced and fair for all members of the group. This situation showed me why justice is very important in everyday life. When fairness is respected, people feel valued and respected for their efforts. On the other hand, when justice is ignored, it can create conflict, disappointment, and even distrust between people. For this reason, fairness is essential for maintaining positive relationships and cooperation in any community."},"p3":{"topic":"Education should be free","for":["free education ensures equal access to learning opportunities","it can reduce social inequality and improve social mobility","educated populations contribute to economic and national development"],"against":["providing free education requires significant government funding","education systems may become overcrowded and less efficient","students may not fully appreciate education if it is completely free"],"a":"The idea that education should be free is frequently debated because it involves both social equality and financial responsibility. One argument in favour of free education is that it ensures equal access to learning opportunities for people from different economic backgrounds. When education is free, students from low-income families have the same chances to study and develop their abilities as those from wealthier families. In addition, free education can reduce social inequality and improve social mobility, since individuals can achieve better careers and living conditions through learning. Another important benefit is that educated populations contribute to economic and national development. When more people receive quality education, they can develop valuable skills and knowledge that help strengthen the workforce and support long-term progress. However, there are also several arguments against completely free education. One major concern is that providing free education requires significant government funding, which may place heavy pressure on national budgets. Governments would need to allocate large financial resources to maintain schools, universities, and teaching staff. Furthermore, education systems might become overcrowded and less efficient if a large number of students enroll without sufficient infrastructure or resources. Finally, some people argue that students may not fully appreciate education if it is completely free, since they might take learning opportunities for granted and show less motivation to work hard."},"wd":[["landscape","the appearance of an area of countryside","n.","1.1"],["visitor","a person who comes to see a place or person","n.","1.1"],["treat","to behave towards somebody in a certain way","v.","1.1"],["extremely","to a very great degree","adv.","1.1"],["especially","more than usual; particularly free time (phrase) time when you are not working","adv.","1.1"],["spend time","to use time doing something","phrase","1.1"],["peaceful","quiet and free from noise or trouble","adj.","1.1"],["relax","to rest and stop feeling worried or tense hike (v.) to go for a long walk in the countryside","v.","1.1"],["outdoor","happening or used outside a building","adj.","1.1"],["properly","in the correct or suitable way / 30 seconds · no preparation","adv.","1.1"],["accommodation","a place where people stay or live","n.","1.2"],["fire pit","a container or hole where a fire is made tent (n.) a shelter made of cloth used for camping","n.","1.2"],["platform","a flat raised surface","n.","1.2"],["flame","the bright burning part of a fire","n.","1.2"],["suitcase","a large bag for carrying clothes when travelling","n.","1.2"],["neatly arranged","put in order in a tidy way","phrase","1.2"],["cushion","a soft bag used to make a seat comfortable","n.","1.2"],["comfort","a pleasant feeling of being relaxed and free from pain","n.","1.2"],["convenience","the quality of being easy and saving time","n.","1.2"],["peaceful environment","a quiet place with no noise or stress","phrase","1.2"],["stressful","causing worry and pressure","adj.","1.2"],["refresh","to make someone feel less tired","v.","1.2"],["beneficial","having a good effect","adj.","1.2"],["attract","to make someone interested in something","v.","1.2"],["traveler","a person who is travelling","n.","1.2"],["disagreement","a situation where people have different opinions","n.","2"],["evaluate","to judge how good or useful something is","v.","2"],["contribute","to help to make something happen","v.","2"],["equally","in the same way for everyone","adv.","2"],["fairness","treating everyone in an equal, right way","n.","2"],["depend","to be affected or decided by something else","v.","2"],["motivation","the reason that makes you want to do something","n.","2"],["evaluation","a judgement about the value of something","n.","2"],["on the other hand","used to introduce the opposite opinion","phrase","2"],["disappointment","sadness because something was not as good as hoped","n.","2"],["cooperation","working together towards the same goal","n.","2"],["involve","to include something as a necessary part","v.","3"],["wealthy","having a lot of money","adj.","3"],["in addition","also; as well as that","phrase","3"],["inequality","an unfair difference between groups of people","n.","3"],["mobility","the ability to move around easily","n.","3"],["educate","to teach someone over a period of time","v.","3"],["skill","the ability to do something well","n.","3"],["strengthen","to make something stronger","v.","3"],["resource","something useful that can be used","n.","3"],["furthermore","in addition to what was said before","adv.","3"],["overcrowded","having too many people in one place","adj.","3"],["sufficient","enough for a purpose","adj.","3"]]},{"p11":[{"q":"What is your favorite room at school?","a":"My favorite room at school is the library. I like it because it is quiet and provides a comfortable environment for studying and reading. The library also contains many useful books and learning materials. Whenever I have free time at school, I often go there to read, study, or simply relax in a peaceful atmosphere."},{"q":"What day do you dislike the most?","a":"The day I dislike the most is usually Monday. After the weekend, it can be difficult to return to a busy routine and start working again. Mondays often feel more demanding because there are many tasks and responsibilities waiting. However, once the day begins, I usually adapt and focus on my work."},{"q":"Can you describe your typical day at school?","a":"A typical day at school usually starts with morning classes, where students learn different subjects and participate in discussions. During breaks, students often talk with their friends or relax for a short time. After several lessons, the school day ends, and students either go home or continue with other activities such as studying or sports. Overall, school days are usually structured and productive."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two very different ways of relaxing and enjoying free time. In the first picture, there is a woman sitting by herself on a wooden bench in a park. Her back is turned to the camera, and in front of her there is a quiet pond surrounded by trees whose leaves have turned yellow and gold. It seems that she is enjoying the peaceful autumn scenery on her own. In contrast, the second picture shows a large group of people watching a film in a cinema. They are holding buckets of popcorn and cold drinks, and most of them appear to be laughing loudly at something on the screen."},{"q":"Which do you prefer: sitting alone in the park or watching a movie in the cinema?","a":"To be honest, quiet places like parks appeal to me much more than crowded entertainment venues. Whenever I sit in a calm natural setting, it becomes much easier to disconnect from daily pressures and simply enjoy the moment. The presence of trees, fresh air, and open space often creates a sense of peace that is difficult to find elsewhere. That said, cinemas can still be enjoyable, particularly when the film is interesting and the experience is shared with close friends."},{"q":"Do you think people today spend enough time relaxing outdoors?","a":"From my perspective, outdoor relaxation has become less common in recent years. Many people are now surrounded by technology throughout the day, whether it is for work, study, or entertainment, which naturally keeps them indoors most of the time. However, there has recently been a growing interest in healthier lifestyles. Because of this shift, some individuals are starting to prioritize activities like walking in parks or spending time in natural environments."}],"p2":{"prompts":["Describe a trip you took to a particular destination.","Why did you choose to visit this place?","What did you enjoy the most about this trip?"],"a":"One memorable trip I took was to a historical city in my country that is well known for its beautiful architecture and cultural heritage. I had heard many interesting things about this place before, especially about its ancient buildings, traditional markets, and historical monuments. Because of this, I decided to visit the city during a holiday in order to explore it personally. I chose this destination mainly because I am very interested in history and culture. I wanted to see the famous historical sites and learn more about the traditions and lifestyle of people who lived there in the past. In addition, many people had recommended the city as a peaceful and inspiring place to visit. What I enjoyed the most about the trip was walking through the old streets and observing the unique architectural style of the buildings. The atmosphere felt very special because the city seemed to combine history with everyday life. I also enjoyed trying traditional food and interacting with local people. Overall, the trip was both relaxing and educational, and it helped me appreciate the cultural richness of my country even more."},"p3":{"topic":"Social media should be banned for individuals under 16","for":["young teenagers may be exposed to harmful or inappropriate content","social media can negatively affect mental health and self- esteem","limiting social media may help students focus more on studies and real-life interaction"],"against":["social media can be useful for communication and learning","banning it may limit digital literacy and technological skills","strict restrictions may be difficult to enforce"],"a":"The idea that social media should be banned for individuals under the age of sixteen has become an important topic of discussion in modern society. One argument in favour of such a ban is that young teenagers may be exposed to harmful or inappropriate content on social media platforms. Since many online spaces are difficult to control, children may encounter material that is not suitable for their age. In addition, social media can negatively affect mental health and self-esteem, especially when teenagers constantly compare themselves with others or face online criticism. Another advantage of limiting social media use is that it may help students focus more on their studies and encourage more real-life interaction with friends and family. However, there are also arguments against banning social media for young people. Social media can be useful for communication and learning, as students can share information, collaborate on projects, and stay connected with classmates. Moreover, banning social media may limit the development of digital literacy and technological skills, which are increasingly important in modern education and future careers. Finally, strict restrictions may be difficult to enforce, since many teenagers might still find ways to access social media through different devices or accounts."},"wd":[["relax","to rest and stop feeling worried or tense","v.","1.1"],["peaceful","quiet and free from noise or trouble","adj.","1.1"],["routine","the usual way you do things every day","n.","1.1"],["participate","to take part in an activity","v.","1.1"],["productive","achieving a lot; effective","adj.","1.1"],["by herself","alone, without other people","phrase","1.2"],["bench","a long seat for two or more people pond (n.) a small area of still water","n.","1.2"],["autumn","the season between summer and winter","n.","1.2"],["scenery","the natural features of an area","n.","1.2"],["cinema","a building where films are shown","n.","1.2"],["popcorn","corn that is heated until it bursts open","n.","1.2"],["to be honest","used to say what you really think","phrase","1.2"],["enjoyable","giving pleasure; pleasant","adj.","1.2"],["outdoor","happening or used outside a building","adj.","1.2"],["relaxation","a state of rest after work or stress indoor (adj.) happening or used inside a building","n.","1.2"],["lifestyle","the way a person lives","n.","1.2"],["prioritize","to decide which thing is most important","v.","1.2"],["memorable","worth remembering; special","adj.","2"],["heritage","traditions and buildings passed down over time","n.","2"],["explore","to travel through a place or examine an idea","v.","2"],["destination","the place you are travelling to","n.","2"],["in addition","also; as well as that","phrase","2"],["inspire","to make someone want to do something good","v.","2"],["observe","to watch something carefully","v.","2"],["combine","to join two or more things together","v.","2"],["interact","to talk to and work with other people","v.","2"],["nder 16","be useful for nd learning mit digital literacy skills may be difficult to","","3"],["social media","websites where people share posts and photos","n.","3"],["teenager","a person between 13 and 19 years old","n.","3"],["expose","to make something known or visible","v.","3"],["harmful","causing damage or injury","adj.","3"],["negatively","in a bad or harmful way","adv.","3"],["collaborate","to work together with other people","v.","3"],["classmate","a person in the same class as you","n.","3"],["moreover","in addition; besides","adv.","3"],["restriction","a rule that limits what people can do","n.","3"],["enforce","to make people obey a rule or law","v.","3"]]},{"p11":[{"q":"Do you prefer to read local news or international news?","a":"I read both, but for different reasons. I check local news almost every day, because it affects me directly: prices, transport, weather and what is happening in my city. International news I read a few times a week, mainly to understand bigger events like elections or economic changes. If I had to choose, I would say local news is more useful to me, but international news is usually more interesting."},{"q":"Who taught you to be polite?","a":"Definitely my parents, and my grandmother in particular. From a very young age they insisted on simple things: greeting people properly, saying thank you and never interrupting an adult. My grandmother especially believed that how you speak to people says everything about you. At school, my primary teacher reinforced the same rules. Now these things are completely automatic for me, and I only notice them when somebody behaves rudely."},{"q":"Do you have a favorite hobby?","a":"Yes, I do. One of my favorite hobbies is reading because it helps me learn new ideas and improve my knowledge. I especially enjoy reading educational books or articles about different topics. In my opinion, hobbies like reading are very useful because they help people develop their thinking and creativity."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different forms of communication. In the first picture, there is a man in a striped suit holding a mobile phone to his ear. His expression looks serious, and the departure board glowing behind him suggests that he is standing in an airport or a railway station. It seems that he is dealing with something urgent while he is travelling. In contrast, the second picture shows two women sitting opposite each other at a small table. One of them is smiling warmly with her hands clasped together as she speaks, and their relaxed body language suggests a friendly, face-to-face conversation."},{"q":"Which do you prefer: online communication or face-to-face communication?","a":"If I had to choose, I would probably prefer face-to- face communication. Speaking directly with someone allows you to understand their emotions and reactions more clearly. It also makes conversations feel more genuine and engaging. However, online communication is extremely convenient, especially when people need to communicate quickly or when they live far away from each other."},{"q":"Do you think online communication will replace face-to-face communication in the future?","a":"Although digital communication has become extremely common, I do not think it will completely replace face-to-face interaction. Human communication often depends on emotional connection, body language, and personal presence. Online platforms will certainly continue to grow, but direct communication will remain important because it helps build stronger relationships and deeper understanding between people."}],"p2":{"prompts":["Describe a goal that you achieved.","What motivated you to pursue this goal?","How did achieving this goal affect you?"],"a":"One important goal that I managed to achieve was improving my skills in a particular academic area that required consistent effort and discipline. At the beginning, it seemed quite challenging because I needed to dedicate a lot of time and concentration to practicing and learning new concepts. What motivated me to pursue this goal was my desire to improve myself and reach a higher level of knowledge. I knew that achieving this goal could open new opportunities for me in the future. In addition, I wanted to prove to myself that with enough effort and persistence, it is possible to overcome difficult challenges. Achieving this goal had a very positive effect on me. It increased my confidence and made me realize the value of hard work and patience. The experience also taught me that progress often happens gradually rather than suddenly. Because of this achievement, I now feel more motivated to set new goals and continue improving myself in different areas."},"p3":{"topic":"Nature documentaries have a positive impact on environmental","for":["documentaries educate people about wildlife and environmental issues","they raise awareness about climate change and conservation","they encourage viewers to protect nature and support environmental organizations"],"against":["watching documentaries does not always lead to real action","some documentaries may exaggerate problems for dramatic effect","people may feel temporarily emotional but quickly forget the message"],"a":"The idea that nature documentaries have a positive impact on environmental awareness is often discussed in relation to education and public attitudes toward nature. One argument in favour of nature documentaries is that they educate people about wildlife and environmental issues. By showing different ecosystems and animal species, these films help viewers understand how nature functions and why it should be protected. In addition, documentaries raise awareness about climate change and conservation by presenting scientific information in a way that is accessible and engaging for the public. Another important benefit is that they can encourage viewers to protect nature and support environmental organizations, as many people feel inspired to take action after seeing the beauty and vulnerability of the natural world. However, there are also some arguments suggesting that the impact of documentaries may be limited. Watching documentaries does not always lead to real action, as many viewers simply enjoy the content without changing their behavior. Furthermore, some documentaries may exaggerate environmental problems for dramatic effect in order to capture the audience’s attention. Finally, people may feel emotional while watching such films, but these feelings can disappear quickly, and the message of environmental protection may soon be forgotten."},"wd":[["reason","why something happens or is done","n.","1.1"],["transport","the system of moving people from place to place","n.","1.1"],["economic","connected with money and business","adj.","1.1"],["particular","one specific thing rather than others","adj.","1.1"],["properly","in the correct or suitable way","adv.","1.1"],["especially","more than usual; particularly","adv.","1.1"],["completely","totally; in every way","adv.","1.1"],["hobby","an activity you enjoy in your free time","n.","1.1"],["in my opinion","used to give your personal view","phrase","1.1"],["creativity","the ability to produce original ideas / 30 seconds · no preparation","n.","1.1"],["form of communication","a way of sharing information","phrase","1.2"],["striped","having lines of different colours","adj.","1.2"],["expression","the look on a person’s face","n.","1.2"],["departure board","a screen showing times of trains or flights urgent (adj.) needing to be dealt with immediately","n.","1.2"],["clasp","to hold something tightly","v.","1.2"],["body language","the way you show feelings through movement","n.","1.2"],["face-to-face","with people in the same place, not online","adj.","1.2"],["emotion","a strong feeling such as joy or fear","n.","1.2"],["engage","to take part in something with interest","v.","1.2"],["convenient","easy to use and saving time or effort","adj.","1.2"],["communicate","to share information with other people","v.","1.2"],["interaction","the act of talking and working with others","n.","1.2"],["depend","to be affected or decided by something else deeper (adj.) going further down or further into a subject","v.","1.2"],["skill","the ability to do something well","n.","2"],["discipline","the ability to control yourself and keep working","n.","2"],["concentration","the ability to give full attention to something","n.","2"],["motivate","to make someone want to do something","v.","2"],["pursue","to try hard to achieve something","v.","2"],["in addition","also; as well as that","phrase","2"],["persistence","continuing to try even when it is difficult","n.","2"],["overcome","to deal with a problem successfully","v.","2"],["patience","the ability to wait calmly without complaining","n.","2"],["gradually","slowly, over a period of time","adv.","2"],["achievement","something good you have succeeded in doing","n.","2"],["vironmental","ntaries does not l action ies may exaggerate matic effect emporarily ckly forget the","","3"],["documentary","a film giving facts about a real subject","n.","3"],["awareness","knowing that something exists or is important","n.","3"],["educate","to teach someone over a period of time","v.","3"],["wildlife","animals and plants living in nature","n.","3"],["ecosystem","all the living things in one area together","n.","3"],["viewer","a person who watches something","n.","3"],["conservation","the protection of nature and wildlife","n.","3"],["accessible","easy to reach, enter or use","adj.","3"],["inspire","to make someone want to do something good","v.","3"],["furthermore","in addition to what was said before","adv.","3"],["disappear","to stop existing or being seen","v.","3"]]},{"p11":[{"q":"Why is sport important?","a":"To begin with, sport plays a crucial role in maintaining a healthy lifestyle. Regular physical exercise strengthens the body and improves mental well-being. Moreover, participating in sports allows people to develop important qualities such as discipline, perseverance, and teamwork. For these reasons, sport is considered an essential part of everyday life."},{"q":"Should everyone do sports?","a":"From my perspective, it would be beneficial for everyone to take part in some form of physical activity. It does not always have to involve intense training; even light activities like walking, jogging, or cycling can have a positive effect on health. Engaging in regular exercise helps individuals stay energetic and maintain a balanced lifestyle."},{"q":"Where is your favorite place in your home?","a":"As for my home, the place I enjoy the most is my personal room. It is a calm and comfortable space where I can focus on studying or simply relax after a busy day. I keep it organized so that the environment remains peaceful and suitable for concentration. Overall, it is the place where I feel the most comfortable."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different ways of obtaining fresh vegetables. In the first picture, there is a man kneeling on the soil in a vegetable garden and wearing gardening gloves. He has just picked a large green cabbage and appears to be examining it closely, while neat rows of leeks and other vegetables grow around him. It seems that he prefers to grow his own organic food. In contrast, the second picture shows a woman choosing fruit in the produce section of a supermarket. She is reaching up towards the top shelf, and the display in front of her is full of colourful fruit and vegetables arranged in baskets."},{"q":"Which do you prefer: growing vegetables yourself or buying them from the store?","a":"If I had enough space and time, I would probably prefer growing my own vegetables. Producing food yourself can be very satisfying, and it also allows people to know exactly how their food is grown. However, buying vegetables from a store is usually much more practical for people with busy lifestyles. It provides quick access to a wide variety of fresh products."},{"q":"Do you think more people will start growing their own food in the future?","a":"There is a possibility that more people will become interested in growing their own food in the future. Many individuals today are becoming more concerned about healthy eating and sustainable living. As a result, activities like home gardening may become increasingly popular, especially among people who want fresh and natural ingredients."}],"p2":{"prompts":["Describe a situation when you felt uncertain about something.","Why did you feel unsure in that situation?","How did you deal with this uncertainty?"],"a":"One situation when I felt uncertain happened when I had to make an important choice about something that could influence my future plans. At that moment, I had several different options, and each one seemed to have both advantages and disadvantages. I felt unsure mainly because I did not want to make the wrong decision. When a decision has long-term consequences, it is natural to think carefully about every possibility. I also considered how each option might affect my future opportunities, which made the situation even more complicated. To deal with this uncertainty, I decided to gather more information and think about the situation more calmly. I spoke with people whose opinions I trusted and considered their advice carefully. After reflecting on all the factors, I finally made a decision that felt right for me. This experience helped me understand that uncertainty is a normal part of decision-making and that thoughtful reflection can help people make better choices."},"p3":{"topic":"Online privacy is more important than national security","for":["protecting personal data is essential for individual freedom and civil rights","excessive surveillance can lead to misuse of personal information","strong privacy protections help prevent abuse of power by authorities"],"against":["governments need access to certain data to prevent crime and terrorism","national security measures can protect citizens from serious threats","some level of surveillance may be necessary to maintain public safety"],"a":"The idea that online privacy is more important than national security is widely debated because it involves balancing individual rights with collective safety. One argument in favour of prioritizing online privacy is that protecting personal data is essential for individual freedom and civil rights. When people feel that their personal information is secure, they are more likely to express their opinions and communicate freely. In addition, excessive surveillance can lead to the misuse of personal information, especially if authorities collect large amounts of data without strict regulation. Another important reason is that strong privacy protections help prevent the abuse of power by authorities, ensuring that governments cannot monitor citizens without proper justification or legal oversight. On the other hand, there are also strong arguments supporting the importance of national security. Governments often need access to certain data in order to prevent crime and terrorism, particularly in cases that involve organized criminal networks or potential security threats. Furthermore, national security measures can protect citizens from serious dangers by allowing authorities to detect suspicious activities before they lead to harmful events. Finally, some level of surveillance may be necessary to maintain public safety, as modern threats often involve digital communication that requires monitoring to ensure effective protection of society."},"wd":[["strengthen","to make something stronger","v.","1.1"],["moreover","in addition; besides","adv.","1.1"],["discipline","the ability to control yourself and keep working","n.","1.1"],["teamwork","working together as a group","n.","1.1"],["beneficial","having a good effect take part (phr. v.) to participate in an activity","adj.","1.1"],["involve","to include something as a necessary part","v.","1.1"],["energetic","full of energy and enthusiasm","adj.","1.1"],["organize","to arrange or plan something carefully","v.","1.1"],["peaceful","quiet and free from noise or trouble","adj.","1.1"],["concentration","the ability to give full attention to something","n.","1.1"],["obtain","to get something, often after effort","v.","1.2"],["kneel","to go down on your knees soil (n.) the earth in which plants grow","v.","1.2"],["gardening gloves","gloves worn to protect the hands in a garden","n.","1.2"],["cabbage","a round vegetable with thick green leaves leek (n.) a long white and green vegetable","n.","1.2"],["organic","grown without artificial chemicals","adj.","1.2"],["produce","food grown on a farm or in a garden","n.","1.2"],["vegetable","a plant used as food","n.","1.2"],["satisfy","to make someone pleased","v.","1.2"],["lifestyle","the way a person lives","n.","1.2"],["sustainable","able to continue without harming nature","adj.","1.2"],["as a result","because of this","phrase","1.2"],["increasingly","more and more over time","adv.","1.2"],["ingredient","one of the foods used to make a dish paration · 2 minutes to speak","n.","1.2"],["uncertain","not sure or not decided","adj.","2"],["disadvantage","a bad feature of something","n.","2"],["long-term","continuing for a long period","adj.","2"],["complicate","to make something more difficult deal with (phr. v.) to take action to solve a problem","v.","2"],["uncertainty","the state of not knowing what will happen","n.","2"],["gather","to come together in a group calmly (adv.) in a quiet, controlled way","v.","2"],["reflect","to think carefully about something","v.","2"],["thoughtful","showing care for other people's feelings","adj.","2"],["security","d access to certain ime and terrorism measures can protect ous threats veillance may be tain public safety","","3"],["prioritize","to decide which thing is most important","v.","3"],["communicate","to share information with other people freely (adv.) without being controlled or limited","v.","3"],["excessive","much more than is reasonable","adj.","3"],["surveillance","close watching of people or places","n.","3"],["misuse","the wrong or dishonest use of something strict (adj.) demanding that rules are obeyed","n.","3"],["on the other hand","used to introduce the opposite opinion","phrase","3"],["furthermore","in addition to what was said before","adv.","3"],["harmful","causing damage or injury","adj.","3"]]},{"p11":[{"q":"Tell me about your work or study","a":"At present, I am mainly focused on my studies. My daily routine usually involves attending classes, reviewing lessons, and preparing for exams. Studying allows me to develop new skills and expand my knowledge in different areas. Although it can sometimes be challenging, I believe that education plays a vital role in shaping a successful future."},{"q":"What do you do when you are bored?","a":"When I get bored, I try to do something that actually wakes my brain up rather than just scrolling on my phone, because that always makes it worse. Usually I go for a walk, cook something new or call a friend I have not spoken to for a while. Sometimes I start a small project, like tidying my room or learning something on the internet. Being bored is often when I get my best ideas."},{"q":"What role does the internet play in your life?","a":"In today’s world, the internet plays a significant role in my daily life. I frequently use it to search for information, watch educational content, and communicate with others. It also provides quick access to a wide range of knowledge. In many ways, the internet has become an essential tool for learning and staying connected."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different ways of producing written work. In the first picture, there is a teenage boy sitting at a table with a pencil in his hand and a sheet of paper in front of him. He is resting his chin on his hand and looking down at his work, which suggests that he is thinking carefully about what to write. It seems that he prefers the traditional method of writing by hand. In contrast, the second picture shows a younger boy typing on a keyboard in a computer room. He has both hands on the keys and is looking at the monitor, where lines of text are already visible."},{"q":"Which do you prefer: handwriting or typing?","a":"If I were asked to choose between the two, I would probably favor typing. Using a keyboard enables people to write much more quickly and organize their ideas efficiently, particularly when producing longer texts. Even so, handwriting still has certain advantages. For instance, writing things down manually can sometimes improve concentration and make it easier to retain information."},{"q":"Do you think handwriting will disappear in the future?","a":"Despite the rapid growth of digital technology, it seems unlikely that handwriting will vanish entirely. In many educational contexts, students are still encouraged to write by hand in order to develop fundamental writing skills. Furthermore, handwritten notes can feel more personal and meaningful, which is why this form of writing will probably remain relevant even in a highly digital world."}],"p2":{"prompts":["Describe a decision that changed your perspective.","What made this decision important for you?","How did it influence the way you think now?"],"a":"One decision that changed my perspective was choosing to approach challenges with a more positive and patient mindset. In the past, whenever I faced difficulties, I sometimes felt frustrated if progress was slow. However, after reflecting on my experiences, I realized that challenges are often valuable opportunities for learning and growth. This decision became important for me because it influenced the way I respond to difficult situations. Instead of focusing only on problems, I started looking for ways to learn from them. I began to see obstacles not as failures but as steps that can help me improve my skills and understanding. As a result, this change in perspective influenced the way I think about both success and failure. I now understand that progress usually takes time and consistent effort. This mindset has helped me remain more patient and determined when working toward my goals. It also encourages me to continue learning from every experience, whether it is positive or challenging."},"p3":{"topic":"Standardized testing should be removed from school systems","for":["standardized tests do not always reflect students’ true abilities","they can create excessive stress and pressure for students","education may become too focused on memorization instead of real understanding"],"against":["standardized tests provide a clear and consistent way to evaluate students","they help schools and governments measure educational performance","universities often rely on standardized results for fair admissions decisions"],"a":"The idea that standardized testing should be removed from school systems is widely debated because such tests influence both educational evaluation and student experience. One argument in favour of removing standardized testing is that these exams do not always reflect students’ true abilities. Many students may perform poorly in exam situations despite having a good understanding of the subject. In addition, standardized tests can create excessive stress and pressure, especially when students believe that their future academic opportunities depend on a single exam. Another concern is that education may become too focused on memorization rather than genuine understanding, as teachers sometimes prioritize preparing students for tests instead of encouraging critical thinking and deeper learning. However, there are also strong arguments against eliminating standardized testing entirely. These exams provide a clear and consistent way to evaluate students from different schools and regions using the same criteria. This allows educational institutions and governments to measure educational performance and identify areas that require improvement. Furthermore, universities often rely on standardized test results when making admission decisions because they provide a relatively fair method of comparing applicants from different educational backgrounds."},"wd":[["skill","the ability to do something well","n.","1.1"],["expand","to make something larger or wider","v.","1.1"],["project","a piece of planned work with a clear goal tidy (adj.) arranged neatly and in order","n.","1.1"],["communicate","to share information with other people","v.","1.1"],["a wide range of","many different types of / 30 seconds · no preparation","phrase","1.1"],["produce","to make or create something","v.","1.2"],["sheet of paper","a single flat piece of paper rest (v.) to place something on a support","phrase","1.2"],["traditional","following a way of doing things from the past by hand (phrase) done with a pen or pencil, not a machine type (v.) to write using a keyboard","adj.","1.2"],["keyboard","the set of keys used to type","n.","1.2"],["monitor","the screen of a computer","n.","1.2"],["typing","writing using a keyboard","n.","1.2"],["efficiently","without wasting time or energy","adv.","1.2"],["handwriting","writing done with a pen or pencil","n.","1.2"],["for instance","for example","phrase","1.2"],["furthermore","in addition to what was said before","adv.","1.2"],["handwritten","written by hand, not typed","adj.","1.2"],["meaningful","important and worth remembering","adj.","1.2"],["mindset","a person's usual way of thinking","n.","2"],["difficulty","a problem or something hard to do","n.","2"],["frustrated","annoyed because you cannot do something","adj.","2"],["reflect","to think carefully about something","v.","2"],["obstacle","something that blocks your progress","n.","2"],["as a result","because of this","phrase","2"],["encourage","to give someone confidence to do something","v.","2"],["ol systems","provide a clear and evaluate students and governments nal performance rely on standardized missions decisions","","3"],["standardized","made the same for everyone","adj.","3"],["evaluation","a judgement about the value of something exam (n.) an official test of knowledge","n.","3"],["in addition","also; as well as that","phrase","3"],["excessive","much more than is reasonable depend on (phr. v.) to be decided by something else","adj.","3"],["genuine","real and honest, not pretended","adj.","3"],["prioritize","to decide which thing is most important deeper (adj.) going further down or further into a subject","v.","3"],["eliminate","to remove something completely","v.","3"]]},{"p11":[{"q":"Have you ever bought clothes online?","a":"Yes, I buy clothes online quite often, maybe once or twice a month. It saves me a lot of time, because I don't have to walk around the shops for hours. Before I order anything, I always check the size chart and read a few customer reviews, because sending things back can be annoying. Sometimes the quality is better than I expected, and sometimes it is a little disappointing, but on the whole I am happy with it."},{"q":"Would you like to have a pet in the future?","a":"Yes, I would, although not immediately. I have always liked animals, and I think a cat would suit me best because cats are fairly independent and do not need constant attention. At the moment my flat is small and my timetable is quite unpredictable, so it would not be fair on the animal. Once I have a bigger place and a more regular routine, I would definitely get one."},{"q":"Is there any food that you don't like?","a":"Yes, there are one or two things I avoid. I have never really enjoyed very oily food, because it feels heavy and I usually regret it afterwards. I am also not keen on anything extremely spicy, since I cannot taste the other ingredients properly. Apart from that I am quite open-minded, and I am happy to try a dish at least once before I decide."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different working environments. In the first picture, there are three colleagues gathered around a desktop computer in a bright office. They appear to be discussing something on the screen, and one of them is pointing at it while the others listen carefully. It seems that they are solving a problem together in a professional environment. In contrast, the second picture shows a woman working from home. She is sitting at a table with a laptop and a phone, and a small child is sitting beside her at the same table. It seems that she is trying to combine her professional duties with looking after her family."},{"q":"Which do you think is better for working in teams: working in an office or from home?","a":"For teamwork, I think the office is definitely better. When everyone sits in the same room, communication is much faster, and you can solve a small problem in two minutes instead of sending ten emails. It is also easier to share ideas and build good relationships with your colleagues. Working from home can feel quite lonely, and answers often take a long time to arrive. Personally, I think a mixture of the two would be the ideal solution."},{"q":"Do you think companies save money if employees work from home?","a":"Yes, I am sure they save quite a lot. They need less office space, so they pay less rent, and their electricity and cleaning bills go down as well. They also spend less on things like coffee, paper and furniture. On the other hand, they have to buy laptops and software and pay for good internet security, so the savings are not as big as people imagine. Overall, though, I think it is cheaper for most companies."}],"p2":{"prompts":["Describe the time when you felt happy about something.","Why do you think it was a significant event for you?","To what extent do external factors like wealth, relationships, or achievements contribute to happiness?"],"a":"One of the happiest moments I can remember was when I finished a large project at work that I had been responsible for over several months. I was given full responsibility for it, which was quite frightening, because I had never managed anything that big before. There were weeks when I was completely overwhelmed and honestly doubted that I could finish it on time. I had to coordinate three different people, deal with unexpected problems and work several evenings. When we finally presented the results and my manager said publicly that it had been done well, I felt genuinely proud and relieved at the same time. I think it was so significant for me because it was not just about the result; it was about proving something to myself. Before that project I always assumed that I was better at following instructions than at leading. Finishing it successfully changed the way I see my own abilities, and that is why I still remember the feeling so clearly. It also changed how my colleagues saw me, and I was given more interesting work afterwards. As for external factors, I think they matter, but only up to a point. Money certainly helps, because financial stress makes people miserable, but once your basic needs are covered, extra money adds very little happiness. Achievements give you a strong feeling of satisfaction, although it usually fades after a few weeks. In my opinion, relationships are the factor that matters most in the long term, because good friendships and a supportive family affect how you feel every single day."},"p3":{"topic":"Countries should invest more in renewable energy sources","for":["reduces dependence on fossil fuels, which will run out sooner or later","brings long-term economic benefits once the panels or turbines pay for themselves","the technology is improving every year and creates thousands of new jobs"],"against":["the initial cost of the infrastructure is extremely high","renewable energy is weather- dependent and therefore less reliable","changing an entire energy system takes years and can damage the economy"],"a":"This is a very popular topic these days, and I can see strong arguments on both sides, although I personally support the idea. Starting with the arguments in favour, the most obvious one is that renewable energy reduces our dependence on fossil fuels. Oil, gas and coal will run out sooner or later, so countries that build solar and wind farms today will be much more independent tomorrow and will not have to worry about rising oil prices. There are also long-term economic benefits. The first investment is expensive, but after a few years the panels or turbines pay for themselves, and the electricity they produce is almost free. On top of that, renewable sources are becoming more efficient every year, and the whole industry creates thousands of new jobs. However, there are some fair arguments against it as well. The initial cost of the infrastructure is extremely high, and poorer countries simply cannot afford it without help. Renewable energy is also weather-dependent, which makes it less reliable. The sun does not shine at night and the wind does not always blow, so you still need batteries or a back-up system. Finally, changing an entire energy system takes many years, and if a government moves too quickly, it can damage the economy and cost people their jobs. All things considered, I still think governments should invest much more in renewable energy, but they should do it gradually. In my opinion, the best solution is to keep traditional power stations running while renewable capacity grows, so that the country is protected during the transition."},"wd":[["customer","a person who buys goods or services","n.","1.1"],["quality","how good or bad something is","n.","1.1"],["disappoint","to make someone feel sad about a result","v.","1.1"],["on the whole","considering everything","phrase","1.1"],["independent","not needing help from other people","adj.","1.1"],["unpredictable","changing often, so you cannot know what will happen","adj.","1.1"],["routine","the usual way you do things every day","n.","1.1"],["avoid","to keep away from something","v.","1.1"],["ingredient","one of the foods used to make a dish","n.","1.1"],["open-minded","willing to consider new ideas","adj.","1.1"],["regret","to feel sorry about something you did / 30 seconds · no preparation","v.","1.1"],["working environment","the conditions in which people work","phrase","1.2"],["colleague","a person you work with","n.","1.2"],["desktop computer","a computer that stays on a desk","n.","1.2"],["professional","connected with a person’s job","adj.","1.2"],["work from home","to do your job at home instead of an office","phrase","1.2"],["combine","to join two or more things together duty (n.) something you must do as part of your job","v.","1.2"],["look after","to take care of somebody or something","phr. v.","1.2"],["teamwork","working together as a group","n.","1.2"],["office","a room or building where people work at desks","n.","1.2"],["communication","the sharing of information between people","n.","1.2"],["solution","a way of solving a problem","n.","1.2"],["on the other hand","used to introduce the opposite opinion","phrase","1.2"],["laptop","a small computer you can carry","n.","1.2"],["software","the programs used by a computer","n.","1.2"],["imagine","to form a picture of something in your mind","v.","1.2"],["company","a business that sells goods or services","n.","1.2"],["responsible","having a duty to deal with something","adj.","2"],["responsibility","a duty that you must take care of","n.","2"],["completely","totally; in every way","adv.","2"],["overwhelm","to affect someone so strongly they cannot cope","v.","2"],["at the same time","used to add a different point","phrase","2"],["significant","large or important enough to notice","adj.","2"],["afterwards","after something has happened","adv.","2"],["achievement","something good you have succeeded in doing","n.","2"],["in my opinion","used to give your personal view","phrase","2"],["friendship","the relationship between friends","n.","2"],["supportive","giving help and encouragement","adj.","2"],["y sources","the infrastructure is is weather- erefore less reliable e energy system an damage the","","3"],["argument","a reason given to support an opinion","n.","3"],["renewable","able to be replaced naturally, like sun or wind","adj.","3"],["long-term","continuing for a long period","adj.","3"],["investment","money put into something to make a profit","n.","3"],["expensive","costing a lot of money","adj.","3"],["efficient","working well without wasting time or energy","adj.","3"],["infrastructure","the basic systems and buildings a place needs","n.","3"],["extremely","to a very great degree","adv.","3"],["government","the group of people who control a country","n.","3"],["all things considered","after thinking about everything","phrase","3"],["gradually","slowly, over a period of time","adv.","3"]]},{"p11":[{"q":"Who do you get on best within your family?","a":"I get on best with my older brother, without any doubt. We are only three years apart, so we grew up doing everything together and we share a lot of the same interests, especially football and music. He is also the person I ask for advice, because he is calm and he never judges me. We argue sometimes, of course, but it never lasts more than a few hours."},{"q":"Do you do much exercise?","a":"Yes, I try to stay active, although I am not a professional athlete or anything like that. I go for a run two or three times a week, usually early in the morning when the streets are quiet. I also walk a lot instead of taking the bus for short distances. In winter it is harder to stay motivated, so I sometimes do simple exercises at home instead. It really helps me sleep better and feel less stressed."},{"q":"Have you ever given anybody flowers?","a":"Yes, several times. The last time was on my mother's birthday, when I bought her a big bunch of yellow tulips because they are her favourite. She was genuinely surprised and put them on the kitchen table straight away. In my country giving flowers is very common, especially on the eighth of March and on the first day of school. I think it is a simple gesture, but it always makes people happy."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different ways of shopping for clothes. In the first picture, there are two young women walking along a street and carrying several paper shopping bags. They appear to be talking and laughing, which suggests that they see shopping as an enjoyable social activity rather than a simple task. In contrast, the second picture shows a close-up of a person holding a smartphone and browsing an online clothing store. Several items are displayed on the screen, and the person seems to be scrolling through them from a comfortable chair at home. It seems that they value convenience above everything else."},{"q":"Is it easier to compare products online or in a supermarket?","a":"I would say it is much easier online. On a website you can put two or three products side by side, see all the prices immediately and read dozens of customer reviews before you decide. In a supermarket you have to walk between the shelves, pick things up and try to remember the prices. On the other hand, in a shop you can actually touch the product and check its quality, and that is something a website cannot give you."},{"q":"Do you trust the quality of products more when shopping online?","a":"Honestly, no. When I shop online I cannot touch the material or try anything on, so I have to trust the photographs, and photographs can be very misleading. I usually only order from websites I already know, and I always read the negative reviews first. In a shop I can check the product myself before I pay, so I feel more confident. For expensive things, I still prefer to buy them in person."}],"p2":{"prompts":["Describe an achievement that you consider a personal success.","How did this success influence your approach to future goals?","How does the definition of success vary between cultures or individuals?"],"a":"The achievement I am most proud of is finishing my first marathon last year. It was never really about the race itself; it was about proving to myself that I could do something that seemed impossible at the beginning. I trained for almost six months, running early in the morning before work, and I had to deal with a knee injury in the middle of my preparation, which almost made me give up. On the day of the race the last ten kilometres were extremely painful, but I kept going, and when I crossed the finish line I felt a kind of pride I had never felt before. That experience completely changed the way I set goals. Before the marathon, I used to give up quite easily whenever something became difficult. Now I break every big goal into small weekly steps, exactly the way I did with my training plan, and I accept that progress is slow. I also learned to be patient with myself, because I know that one bad week does not ruin the whole project. As for the meaning of success, I think it varies enormously. In some cultures success is mainly financial: a good salary, a car and a house. In others it is about family, reputation or being useful to your community. And even inside one country, individuals see it differently. For a doctor, success might be saving lives; for an artist, it might be creating something original; for many people, it is simply having a healthy family and enough free time. So I do not think there is one correct definition at all."},"p3":{"topic":"Parents should have the right to choose their child's school curriculum","for":["parents have a right to raise their children according to their own values","it would encourage variety, with schools focusing on languages, science or new methods","it gives parents more control and makes them more involved in school life"],"against":["a standardised curriculum guarantees every child the same basic knowledge","parents are not education experts and may not know what children need today","it would widen the gap between well- informed families and everyone else"],"a":"This is a difficult question, because it touches both the rights of parents and the interests of society as a whole. Those who agree usually start with a very simple argument: parents have a fundamental right to bring up their children according to their own values, and education is a huge part of that. They also say that giving parents a choice would encourage variety in education. Instead of every school teaching exactly the same thing, we could have schools that focus on languages, on science or on alternative teaching methods, and families could pick the one that suits their child best. Finally, supporters argue that it gives parents more control over their child's future, which makes them far more involved in what happens at school. The arguments against are just as serious, though. A standardised national curriculum guarantees that every child, in every region, receives the same basic knowledge, and that is what makes qualifications fair and comparable. Parents are not education experts either, so they may not always know what a modern child really needs to learn. Perhaps the strongest objection is about equality: if wealthy, well-informed families design excellent programmes while others do not, the gap between schools will grow, and children from different backgrounds will stop mixing with each other. In my view, the best answer is somewhere in the middle. The core subjects, such as mathematics, science and the national language, should stay the same for everybody, but parents and schools could be given real freedom over optional subjects and extra activities."},"wd":[["especially","more than usual; particularly","adv.","1.1"],["argue","to give reasons for your opinion; to disagree","v.","1.1"],["professional","done by a trained expert","adj.","1.1"],["motivated","wanting to work hard to reach a goal","adj.","1.1"],["stressed","worried and unable to relax","adj.","1.1"],["genuinely","really; truly common (adj.) happening often; usual","adv.","1.1"],["shopping bag","a bag for carrying things you have bought","n.","1.2"],["enjoyable","giving pleasure; pleasant","adj.","1.2"],["social activity","something done together with other people","phrase","1.2"],["close-up","a photograph taken very near the subject","n.","1.2"],["browse","to look through goods or pages without hurrying","v.","1.2"],["display","to show something so it can be seen","v.","1.2"],["scroll","to move text or images up and down on a screen","v.","1.2"],["convenience","the quality of being easy and saving time","n.","1.2"],["website","a place on the internet with pages of information","n.","1.2"],["customer","a person who buys goods or services","n.","1.2"],["supermarket","a large shop selling food and household goods","n.","1.2"],["on the other hand","used to introduce the opposite opinion","phrase","1.2"],["quality","how good or bad something is online (adj.) connected to or done through the internet","n.","1.2"],["photograph","a picture taken with a camera","n.","1.2"],["confident","sure that you can do something well","adj.","1.2"],["expensive","costing a lot of money","adj.","1.2"],["achievement","something good you have succeeded in doing deal with (phr. v.) to take action to solve a problem give up (phr. v.) to stop doing something before you finish","n.","2"],["extremely","to a very great degree","adv.","2"],["experience","something that happens to you and teaches you","n.","2"],["completely","totally; in every way","adv.","2"],["project","a piece of planned work with a clear goal","n.","2"],["success","achieving what you wanted","n.","2"],["salary","the money you are paid for your job","n.","2"],["community","the people who live in one area","n.","2"],["individual","one single person free time (phrase) time when you are not working","n.","2"],["ool curriculum","rriculum guarantees me basic knowledge ucation experts and at children need e gap between well- and everyone else","","3"],["society","people living together in an organised way","n.","3"],["argument","a reason given to support an opinion","n.","3"],["education","the process of teaching and learning","n.","3"],["encourage","to give someone confidence to do something focus on (phr. v.) to give your attention to one thing","v.","3"],["involve","to include something as a necessary part","v.","3"],["curriculum","the subjects taught in a school basic (adj.) simple and most necessary","n.","3"],["strongest","having the most power or effect","adj.","3"],["equality","the state of being equal in rights","n.","3"],["wealthy","having a lot of money","adj.","3"],["subject","an area of knowledge studied at school","n.","3"],["mathematics","the study of numbers and shapes","n.","3"]]},{"p11":[{"q":"What is your town like?","a":"My town is fairly small and very peaceful, which is exactly what I like about it. There is a big park in the centre, a few cafes and a market that gets really busy at the weekend. Everybody seems to know everybody, so you always meet someone you know on the street. There is not much nightlife, of course, and young people sometimes complain about that, but for me it is a comfortable place to live."},{"q":"Who is your favourite sports person?","a":"My favourite sports person is Serena Williams. I admire her not only because she won so many titles, but because of how hard she worked to get there. She came back after injuries and after becoming a mother, which shows incredible determination. She also speaks openly about equal pay and about believing in yourself, so she is a good role model for young people. Watching her matches always motivates me to keep going."},{"q":"In what situations do you listen to music?","a":"I listen to music at several points in the day, but mostly when I am travelling. On the bus in the morning it helps me wake up and prepare for the day ahead. I also put something calm on while I am studying, because it covers background noise and helps me concentrate. In the evening I prefer slower songs, since they help me relax before I go to bed."}],"p12":[{"q":"What can you see in these pictures?","a":"In these pictures, I can see two different eating experiences. In the first picture, there is a young woman having a meal alone at a restaurant table. She is cutting her food carefully and looking down at her plate, and nobody else is sitting with her. It seems that she is enjoying a quiet moment and some time to herself. In contrast, the second picture shows a family sharing a meal together around a large table. There are several dishes in front of them, and the parents and children appear to be talking and laughing while they eat. It seems to be a warm and lively family gathering."},{"q":"Do you prefer dining with family or alone?","a":"I definitely prefer eating with my family. For me a meal is not only about food, it is the time of day when we actually talk to each other and hear what everybody has been doing. The atmosphere is warmer and the food somehow tastes better. Having said that, I do enjoy eating alone occasionally, especially at lunchtime on a busy day, because it gives me twenty quiet minutes to myself."},{"q":"When was the last time you gathered with family to dine?","a":"The last time was yesterday evening, actually, because we always have dinner together during the week. But if you mean a bigger family gathering, that was about two weeks ago at my grandmother's house. All my uncles, aunts and cousins came, and there were probably fifteen of us around the table. My grandmother cooked plov, we stayed for hours talking, and the children ran around the garden. It was a really lovely evening."}],"p2":{"prompts":["Describe a book that seriously impacted you.","How did the book make you feel when you first read it?","Has this book influenced your other reading choices, or shaped your taste in literature?"],"a":"The book that had the strongest effect on me is The Alchemist by Paulo Coelho. I read it for the first time when I was about eighteen, at a moment when I was really unsure about what to study and what to do with my life. It tells the story of Santiago, a young shepherd who leaves everything behind to follow a dream and travel across the desert. The story itself is very simple, and the language is easy, but the ideas behind it are quite deep. It is about listening to yourself, taking risks and understanding that the journey matters as much as the destination. When I first read it, I felt calm and motivated at the same time. Some sentences honestly felt as if they had been written for me personally, and I remember stopping several times just to think about my own situation. It made me ask myself an uncomfortable question: was I choosing my path because I really wanted it, or simply because other people expected it? By the end of the book I felt much more confident about making my own decisions. It definitely changed my reading habits as well. Before that, I mostly read whatever was required at school. Afterwards I started looking for books about people who change their lives, and I discovered other authors with a similar style. I also began reading a lot more non-fiction, especially biographies, because I became interested in real stories of people who took a risk. So one short novel opened up a whole new area of reading for me."},"p3":{"topic":"Everyone should have a hobby","for":["a hobby is a healthy way of dealing with stress and gives the mind a real break","it encourages creativity and personal growth because nobody is forcing you","people build genuine skills, and some even turn a hobby into a career"],"against":["not everyone has the time or the money for a regular hobby","some hobbies are genuinely expensive or even dangerous","a hobby can turn into an obsession that costs money and time with family"],"a":"I think this is one of those statements that most people would agree with, although there are still a few practical objections. The strongest argument in favour is that a hobby is a healthy way to deal with stress. Modern life is fast and demanding, and having an activity that has nothing to do with work or exams gives your mind a real break. Hobbies also encourage creativity and personal growth, because you are doing something because you enjoy it, not because somebody is forcing you. On top of that, you build genuine skills. Someone who plays the guitar, cooks or repairs bicycles for fun often becomes surprisingly good at it, and many people have even turned a hobby into a career. On the other hand, I understand the counter- arguments. Not everyone has the time or the money for a hobby. If a person works twelve hours a day and then looks after children, free time is a luxury rather than a choice. Some hobbies are also genuinely expensive or even dangerous, such as skiing, photography or motorsport. And occasionally a hobby stops being a rest and becomes an obsession, so that people spend money they do not have or ignore their family because of it. In my opinion, everybody should have some kind of hobby, but it does not need to be expensive or impressive. Reading, walking or growing plants on a balcony cost almost nothing, and they give you the same benefits as an activity that costs a fortune."},"wd":[["peaceful","quiet and free from noise or trouble","adj.","1.1"],["nightlife","entertainment available in the evening","n.","1.1"],["admire","to respect and like someone very much","v.","1.1"],["determination","the will to keep trying until you succeed openly (adv.) without hiding your feelings or opinions","n.","1.1"],["motivate","to make someone want to do something","v.","1.1"],["background noise","sounds you can hear behind what you are listening to","phrase","1.1"],["concentrate","to give your full attention to one thing","v.","1.1"],["relax","to rest and stop feeling worried or tense / 30 seconds · no preparation","v.","1.1"],["have a meal","to eat food at a particular time","phrase","1.2"],["carefully","with a lot of attention","adv.","1.2"],["time to yourself","time spent alone, away from others","phrase","1.2"],["share a meal","to eat together with other people dish (n.) food prepared in a particular way lively (adj.) full of energy and interest","phrase","1.2"],["gathering","a meeting of a group of people","n.","1.2"],["atmosphere","the general feeling of a place","n.","1.2"],["occasionally","sometimes, but not often","adv.","1.2"],["especially","more than usual; particularly","adv.","1.2"],["gather","to come together in a group","v.","1.2"],["strongest","having the most power or effect","adj.","2"],["moment","a very short period of time","n.","2"],["journey","an act of travelling from one place to another","n.","2"],["destination","the place you are travelling to","n.","2"],["motivated","wanting to work hard to reach a goal","adj.","2"],["at the same time","used to add a different point","phrase","2"],["situation","the things that are happening at a certain time","n.","2"],["uncomfortable","not pleasant; causing slight pain or worry","adj.","2"],["confident","sure that you can do something well","adj.","2"],["habit","something you do regularly, often without thinking","n.","2"],["afterwards","after something has happened","adv.","2"],["practical","useful and sensible in real life","adj.","3"],["argument","a reason given to support an opinion deal with (phr. v.) to take action to solve a problem","n.","3"],["encourage","to give someone confidence to do something","v.","3"],["creativity","the ability to produce original ideas","n.","3"],["surprisingly","in a way you did not expect","adv.","3"],["on the other hand","used to introduce the opposite opinion free time (phrase) time when you are not working","phrase","3"],["genuinely","really; truly","adv.","3"],["expensive","costing a lot of money","adj.","3"],["in my opinion","used to give your personal view","phrase","3"]]},{"p11":[{"q":"Tell me about a typical weekend for you.","a":"My weekends are usually pretty relaxed. On Saturday morning I sleep a little longer than usual, and then I do some cleaning or help my parents with the shopping. In the afternoon I often meet friends in a cafe or go for a walk in the park. Sunday is my quiet day: I catch up on my studies, watch a film and get ready for the week ahead. It is not exciting, but it is exactly what I need."},{"q":"Is there anything you would change about your room?","a":"Yes, a few things. The main problem is storage: I have more books than shelf space, so they end up in piles on the floor. If I could, I would put up another bookshelf and buy a proper desk lamp, because the light in the evening is quite poor. I would also repaint the walls in a lighter colour, since that would make the room feel considerably bigger."},{"q":"Which sport would you like to try?","a":"I would really like to try swimming properly. I can stay afloat, but my technique is poor, and I have always admired people who move through the water without any effort. It is also one of the few sports that works the whole body and is gentle on your joints. If there were a pool closer to my home, I would probably have started already."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different ways of taking photographs. In the first picture, there is a young woman taking a selfie outdoors with her smartphone. She is holding the phone at arm's length and smiling towards the camera, and the green trees behind her suggest a park on a sunny day. It seems that she wants to capture a spontaneous moment and share it with her friends. In contrast, the second picture shows a professional photo session in a studio. A photographer is holding a camera in front of a man who is posing on a chair, and powerful lighting equipment has been set up around them."},{"q":"Do you prefer taking a selfie or regular photo?","a":"I generally prefer a normal photo taken by someone else. Selfies are quick and convenient, but the angle is always the same and only your face fits in the picture. When a friend takes the photo, you can see the whole place behind you, which is much nicer if you are travelling. Having said that, when I am alone, a selfie is the only realistic option, so I still take plenty of them."},{"q":"When was the last time you took a photo of yourself?","a":"It was last weekend, when I went hiking with two friends. We reached the top of the hill and the view over the valley was beautiful, so I took a few selfies with the mountains behind me. I sent one to my mother because she always wants to know where I am. I do not photograph myself very often, to be honest, maybe once or twice a month."}],"p2":{"prompts":["Can you describe a teacher who inspired you?","Why do you think education is important for personal growth?","How can education systems adapt to modern challenges?"],"a":"The teacher who inspired me most was my English teacher at high school, Ms Safarova. She had an energy that made every lesson feel different, and she never simply read from the textbook. What made her special was that she did not only teach us grammar and vocabulary; she encouraged us to express our own opinions and to argue about things in English, even when our sentences were far from perfect. She also treated every student with real respect. If somebody made a mistake, she never let anyone laugh; she turned it into something the whole class could learn from. Because of her, I stopped being afraid of speaking, and that changed my results completely within one year. I think education matters for personal growth because it does much more than fill your head with facts. It teaches you how to think: how to compare two arguments, how to check whether a source is reliable and how to change your mind when you are shown better evidence. It also builds confidence, because every difficult subject you master proves to you that you can learn something hard. And it opens doors, giving people choices they would never otherwise have had. As for adapting to modern challenges, I think education systems need to change in several ways. They should teach digital skills properly, including how to recognise false information online, since that is now an essential life skill. They also need to focus more on creativity and problem-solving, because those are exactly the things technology cannot replace. And finally, they should accept that learning does not stop at twenty-two, so adults need affordable ways to retrain during their careers."},"p3":{"topic":"Fast food should be heavily taxed","for":["higher prices discourage unhealthy eating, as happened with cigarettes","the money collected can fund hospitals and school nutrition programmes","a tax sends a clear public message and raises awareness about diet"],"against":["it hits low-income families hardest, since fast food is their cheapest hot meal","fast food restaurants employ thousands of young people whose jobs are at risk","adults should be free to decide what they eat without price pressure"],"a":"This is a topic where health and personal freedom come into conflict, so opinions are very divided. The people who support the tax have some convincing arguments. First, higher prices discourage unhealthy eating: if a burger suddenly costs significantly more, at least some customers will choose something else, and that is exactly what happened with cigarettes in many countries. Second, the money collected does not disappear. It can be spent on hospitals, on nutrition programmes in schools, or on making fresh food cheaper. And third, a tax like this sends a clear public message. It makes people stop and think about what they are actually eating, which raises awareness about diet in general. However, the arguments against are also strong. The biggest problem is that this kind of tax hits low- income families hardest, because fast food is often the cheapest hot meal available to them. Wealthy people would simply pay the extra amount and change nothing. There is also an economic concern: fast food restaurants employ thousands of young people, and if sales fall sharply, some of those jobs will disappear. Finally, many people argue that adults should be free to decide what they eat, and that the government has no right to control personal choices through prices. My own view is that a moderate tax could work, but only as part of a bigger plan. If governments tax fast food, they should use that money to make fruit, vegetables and school meals cheaper, otherwise they are just punishing people rather than helping them."},"wd":[["relax","to rest and stop feeling worried or tense catch up (phr. v.) to talk to somebody about recent news","v.","1.1"],["storage","space for keeping things you are not using","n.","1.1"],["shelf","a flat board for keeping things on pile (n.) a number of things placed on top of each other","n.","1.1"],["considerably","much; a lot","adv.","1.1"],["technique","the way of doing something that needs skill","n.","1.1"],["admire","to respect and like someone very much","v.","1.1"],["effort","the energy you use to do something","n.","1.1"],["joint","a place where two bones meet, such as the knee / 30 seconds · no preparation","n.","1.1"],["take a selfie","to photograph yourself with a phone","phrase","1.2"],["at arm’s length","as far away as your arm can reach","phrase","1.2"],["capture","to record a moment in a photograph","v.","1.2"],["spontaneous","not planned in advance","adj.","1.2"],["photo session","an arranged time for taking photographs","n.","1.2"],["studio","a room where photographs or films are made pose (v.) to sit or stand in a position for a photograph","n.","1.2"],["lighting equipment","lamps used to light a photograph","n.","1.2"],["convenient","easy to use and saving time or effort","adj.","1.2"],["selfie","a photograph you take of yourself","n.","1.2"],["option","one of the things you can choose hike (v.) to go for a long walk in the countryside","n.","1.2"],["valley","low land between two hills or mountains","n.","1.2"],["photograph","a picture taken with a camera","n.","1.2"],["to be honest","used to say what you really think","phrase","1.2"],["vocabulary","the words a person knows or uses","n.","2"],["encourage","to give someone confidence to do something","v.","2"],["completely","totally; in every way","adv.","2"],["education","the process of teaching and learning","n.","2"],["compare","to look at how things are similar or different","v.","2"],["argument","a reason given to support an opinion","n.","2"],["reliable","able to be trusted to work well","adj.","2"],["confidence","the feeling that you can do something well","n.","2"],["otherwise","if not; in a different way","adv.","2"],["properly","in the correct or suitable way","adv.","2"],["essential","completely necessary","adj.","2"],["creativity","the ability to produce original ideas","n.","2"],["opinion","what a person thinks about something","n.","3"],["divide","to separate into parts","v.","3"],["discourage","to make someone less willing to do something","v.","3"],["suddenly","quickly and without warning","adv.","3"],["customer","a person who buys goods or services","n.","3"],["collect","to bring things together","v.","3"],["disappear","to stop existing or being seen","v.","3"],["awareness","knowing that something exists or is important","n.","3"],["wealthy","having a lot of money","adj.","3"],["economic","connected with money and business","adj.","3"],["government","the group of people who control a country","n.","3"],["vegetable","a plant used as food","n.","3"]]},{"p11":[{"q":"Do you think y
