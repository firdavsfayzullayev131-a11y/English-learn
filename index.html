breath and focusing on listening rather than reacting. By doing this, I was able to calm down and respond in a more reasonable way. Eventually, the conversation became more balanced and respectful, and we were able to understand each other’s opinions better. This experience taught me that self-control and patience are very important when dealing with disagreements."},"p3":{"topic":"The government should limit how much people earn","for":["reduces income inequality between the rich and the poor","allows governments to redistribute wealth for public services like healthcare and education","prevents excessive concentration of wealth and economic power"],"against":["may reduce motivation and ambition to work hard or innovate","could discourage entrepreneurship and investment","wealthy individuals and businesses might move to countries with fewer financial restrictions"],"a":"The idea that the government should limit how much people earn is a controversial topic that raises questions about fairness, economic motivation, and financial freedom. One argument in favour of limiting income is that it could reduce income inequality between the rich and the poor. In many countries, wealth is heavily concentrated among a small group of individuals, which can create social and economic imbalance. By introducing limits on extremely high earnings, governments may be able to reduce this gap and create a more equal distribution of wealth. In addition, such policies would allow governments to redistribute financial resources and invest more in essential public services such as healthcare and education. Another important benefit is that income limits could prevent the excessive concentration of wealth and economic power, which sometimes allows a small number of individuals or corporations to influence economic and political decisions. On the other hand, there are also strong arguments against limiting how much people can earn. One major concern is that such restrictions may reduce motivation and ambition to work hard or develop innovative ideas. High financial rewards often encourage people to pursue ambitious goals and contribute to economic progress. Furthermore, limiting income could discourage entrepreneurship and investment because individuals might feel that their potential rewards are restricted. Finally, wealthy individuals and businesses might move their activities to countries with fewer financial regulations, which could result in the loss of talent, investment, and economic growth for the country that imposes such limits."},"wd":[["practical","useful and sensible in real life","adj.","1.1"],["autumn","the season between summer and winter","n.","1.1"],["in my opinion","used to give your personal view","phrase","1.1"],["admire","to respect and like someone very much","v.","1.1"],["dedication","giving a lot of time and effort to something","n.","1.1"],["inspire","to make someone want to do something good","v.","1.1"],["purchase","something that has been bought","n.","1.2"],["shopping basket","a container you carry goods in while shopping","n.","1.2"],["ingredient","one of the foods used to make a dish","n.","1.2"],["a wide range of","many different types of","phrase","1.2"],["organic","grown without artificial chemicals","adj.","1.2"],["vendor","a person who sells goods, often outdoors","n.","1.2"],["environmentally friendly","causing little or no harm to nature","adj.","1.2"],["produce","food grown on a farm or in a garden","n.","1.2"],["vegetable","a plant used as food","n.","1.2"],["in addition","also; as well as that","phrase","1.2"],["communicate","to share information with other people","v.","1.2"],["seller","a person who sells something","n.","1.2"],["supermarket","a large shop selling food and household goods","n.","1.2"],["outdoor","happening or used outside a building","adj.","1.2"],["disappear","to stop existing or being seen","v.","1.2"],["furthermore","in addition to what was said before","adv.","1.2"],["disagreement","a situation where people have different opinions deeply (adv.) very strongly","n.","2"],["intense","very strong or extreme","adj.","2"],["frustrated","annoyed because you cannot do something","adj.","2"],["emotionally","in a way connected with feelings","adv.","2"],["emotion","a strong feeling such as joy or fear","n.","2"],["react","to behave in a certain way because of something","v.","2"],["patience","the ability to wait calmly without complaining","n.","2"],["e earn","vation and ambition nnovate entrepreneurship ls and businesses untries with fewer ons","","3"],["fairness","treating everyone in an equal, right way","n.","3"],["motivation","the reason that makes you want to do something","n.","3"],["inequality","an unfair difference between groups of people","n.","3"],["concentrate","to give your full attention to one thing","v.","3"],["excessive","much more than is reasonable","adj.","3"],["concentration","the ability to give full attention to something","n.","3"],["on the other hand","used to introduce the opposite opinion","phrase","3"],["restriction","a rule that limits what people can do","n.","3"],["ambition","a strong wish to achieve something","n.","3"],["discourage","to make someone less willing to do something","v.","3"],["restrict","to limit what someone can do","v.","3"],["wealthy","having a lot of money","adj.","3"]]},{"p11":[{"q":"What is your favourite TV show?","a":"My favourite TV show is usually something educational or informative. I enjoy programs that explore real-life topics such as science, history, or culture. These kinds of shows are not only entertaining but also very useful because they help me learn new things and broaden my understanding of the world."},{"q":"Do you like animals?","a":"Yes, I do. I think animals are fascinating and important for the natural balance of the environment. Many people enjoy keeping pets because animals can be loyal companions and bring a lot of happiness. Personally, I find it relaxing to spend time with animals or simply observe them in nature."},{"q":"How often do you read?","a":"I try to read quite regularly, usually several times a week. Reading is a great way to expand my knowledge and improve my language skills. I often read articles, books, or online materials about different topics. In my opinion, reading is one of the most effective ways to develop critical thinking and vocabulary."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different methods of travelling in urban areas. In the first picture, there is a person driving a car. He appears to be sitting behind the steering wheel and concentrating on the road ahead. It seems that he is using a private vehicle as a convenient and comfortable way of transportation. In contrast, the second picture shows a person walking across a street in a city centre. He is using a pedestrian crossing, and the surrounding area appears to be a busy urban environment with modern buildings."},{"q":"Which do you prefer: using a private car or walking?","a":"If the distance is short, I would definitely prefer walking. It is a healthy habit and a great way to stay active. Walking also allows people to enjoy their surroundings and reduce stress. However, when the destination is far away or when time is limited, using a private car becomes much more practical. It saves time and makes traveling more comfortable."},{"q":"Do you think people rely too much on private cars today?","a":"To some extent, yes. Many people depend heavily on private cars because they are fast and convenient. In large cities, however, this can create serious problems such as traffic congestion and air pollution. As a result, many governments are encouraging people to walk more or use public transportation. Promoting healthier and more sustainable ways of traveling could improve both environmental conditions and public health."}],"p2":{"prompts":["Tell me about a time when you had to be patient after experiencing a failure.","Why was patience important in that situation?","What did this experience teach you about dealing with failure?"],"a":"One time when I had to be patient after experiencing failure was when I did not achieve the result I expected in an important exam. I had spent quite a long time preparing for it, so naturally I hoped to perform very well. When I finally saw the result, I felt disappointed and frustrated because it did not reflect the amount of effort I had put into my preparation. At that moment, it would have been easy to become discouraged or even lose motivation completely. However, I realized that success often requires persistence and patience. Instead of focusing only on the disappointment, I tried to analyze what went wrong. I looked at my preparation methods and identified areas where I could improve, such as time management and practicing more difficult questions. This experience taught me several important lessons about dealing with failure. First, failure does not necessarily mean the end of progress; sometimes it simply shows that we need to change our approach. Second, patience allows people to learn from their mistakes and improve gradually. As a result of this experience, I became more determined to continue working toward my goals and to see challenges as opportunities for growth."},"p3":{"topic":"Handwriting is becoming less important in modern education","for":["digital devices have replaced many traditional writing tasks","typing is faster and more efficient for academic and professional work","most communication today happens through digital platforms"],"against":["handwriting helps improve memory and learning retention","it develops fine motor skills and cognitive development","handwritten notes can help students understand information more deeply"],"a":"The idea that handwriting is becoming less important in modern education is often discussed as technology continues to change the way students learn and communicate. One argument supporting this view is that digital devices have replaced many traditional writing tasks in schools and universities. Students now frequently use laptops, tablets, or smartphones to complete assignments, take notes, and access learning materials. In addition, typing is generally faster and more efficient than handwriting, especially when students need to produce long pieces of academic work or professional documents. Another important factor is that most communication today takes place through digital platforms such as emails, messaging applications, and online learning systems, which further reduces the need for handwritten communication. However, there are also strong reasons why handwriting should still remain an important part of education. Research suggests that handwriting can help improve memory and learning retention because the physical process of writing encourages deeper mental engagement with the material. Furthermore, practicing handwriting develops fine motor skills and supports cognitive development, particularly for younger students who are still developing coordination and concentration. Another advantage is that handwritten notes often help students understand and organize information more effectively, as writing by hand usually requires them to process ideas more carefully rather than simply typing them quickly."},"wd":[["informative","giving useful information","adj.","1.1"],["explore","to travel through a place or examine an idea","v.","1.1"],["entertain","to interest and amuse someone","v.","1.1"],["broaden","to make something wider; to increase","v.","1.1"],["relax","to rest and stop feeling worried or tense","v.","1.1"],["spend time","to use time doing something","phrase","1.1"],["observe","to watch something carefully","v.","1.1"],["expand","to make something larger or wider","v.","1.1"],["in my opinion","used to give your personal view","phrase","1.1"],["vocabulary","the words a person knows or uses","n.","1.1"],["urban area","a town or city area","n.","1.2"],["steering wheel","the wheel a driver turns to guide a car","n.","1.2"],["concentrate","to give your full attention to one thing","v.","1.2"],["private vehicle","a car owned and used by one person","n.","1.2"],["pedestrian crossing","a marked place where people cross a road","n.","1.2"],["city centre","the main central part of a city","n.","1.2"],["habit","something you do regularly, often without thinking","n.","1.2"],["destination","the place you are travelling to","n.","1.2"],["convenient","easy to use and saving time or effort","adj.","1.2"],["traffic congestion","too many vehicles causing delays","n.","1.2"],["as a result","because of this","phrase","1.2"],["sustainable","able to continue without harming nature paration · 2 minutes to speak exam (n.) an official test of knowledge","adj.","1.2"],["disappoint","to make someone feel sad about a result","v.","2"],["frustrated","annoyed because you cannot do something","adj.","2"],["reflect","to think carefully about something","v.","2"],["discourage","to make someone less willing to do something","v.","2"],["motivation","the reason that makes you want to do something","n.","2"],["persistence","continuing to try even when it is difficult","n.","2"],["patience","the ability to wait calmly without complaining","n.","2"],["disappointment","sadness because something was not as good as hoped","n.","2"],["analyze","to examine something carefully to understand it","v.","2"],["gradually","slowly, over a period of time","adv.","2"],["education","improve memory ntion otor skills and ment can help students mation more deeply","","3"],["handwriting","writing done with a pen or pencil","n.","3"],["communicate","to share information with other people","v.","3"],["laptop","a small computer you can carry","n.","3"],["tablet","a small flat computer with a touch screen","n.","3"],["smartphone","a mobile phone that works like a small computer","n.","3"],["assignment","a piece of work given to a student","n.","3"],["in addition","also; as well as that","phrase","3"],["typing","writing using a keyboard","n.","3"],["handwritten","written by hand, not typed","adj.","3"],["furthermore","in addition to what was said before","adv.","3"],["cognitive","connected with thinking and understanding","adj.","3"],["concentration","the ability to give full attention to something","n.","3"],["organize","to arrange or plan something carefully","v.","3"]]},{"p11":[{"q":"When do you usually get up?","a":"I usually get up quite early in the morning, especially on weekdays. Waking up early helps me start the day in a calm and organized way. After getting up, I normally have breakfast and prepare for the day ahead. I believe having a regular routine in the morning makes the whole day more productive."},{"q":"What do you do to stay healthy?","a":"To stay healthy, I try to maintain a balanced lifestyle. I usually do some physical activities such as walking or playing sports, and I also try to eat nutritious food. In addition, I make sure to get enough rest because sleep is essential for both physical and mental health."},{"q":"Do you like to wear dark or bright colours?","a":"I definitely lean towards darker colours, like navy blue, grey and black. I find them easier to combine, so I never spend much time deciding what to wear in the morning, and they also look smarter for university and work. In summer I add a few brighter pieces, usually white or light blue, because dark clothes get very hot in the sun. So I would say dark colours in winter and lighter ones in summer."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different eating habits and approaches to food. In the first picture, there is a woman preparing and eating a healthy meal. She is sitting at a table with a bowl of salad, fruits, and vegetables around her. It seems that she is choosing fresh ingredients and focusing on a balanced meal. In contrast, the second picture shows a man eating fast food. He is sitting at a table with items such as pizza, burgers, and a soft drink. He appears to be eating a slice of pizza while other fast-food products are placed in front of him."},{"q":"Which do you prefer: healthy food or junk food?","a":"If I had to choose, I would definitely prefer healthy food. One reason is that it provides the body with important nutrients and helps maintain long-term health. Eating balanced meals can improve energy levels and overall well-being. That being said, junk food can still be enjoyable from time to time. Many people occasionally eat fast food because it is quick, convenient, and often very flavorful."},{"q":"Do you think people today eat too much junk food?","a":"In many cases, yes. Modern lifestyles are often very busy, so people tend to choose fast and convenient meals instead of cooking at home. Junk food is also widely available and heavily advertised, which encourages frequent consumption. However, awareness about healthy eating is gradually increasing. Many people are beginning to pay more attention to their diets and try to include more nutritious foods in their daily meals."}],"p2":{"prompts":["Tell me about a critical decision you had to make.","What factors did you consider before making this decision?","What was the result of your decision, and how did it affect you?"],"a":"One critical decision I had to make was choosing an important direction for my future studies. At that time, I had several different options, and each of them offered different opportunities and challenges. Because this decision could influence my long-term goals and career path, I wanted to think about it very carefully before making a final choice. Before deciding, I considered a variety of factors. For example, I thought about my personal interests, my strengths, and the kind of work I might want to do in the future. I also tried to evaluate the potential opportunities each option could provide in terms of education and professional development. In addition, I asked for advice from people I trusted, such as teachers, friends, and family members. Their perspectives helped me see the situation from different angles. In the end, the decision turned out to be very positive for me. It gave me a clearer sense of direction and helped me focus more seriously on my goals. Although making such a decision was not easy, the process taught me the importance of careful thinking and responsibility. It also helped me become more confident in making important choices about my future."},"p3":{"topic":"Schools should start later in the morning","for":["students can get enough sleep and feel more rested","better concentration and academic performance during lessons","improved mental health and reduced stress for students"],"against":["later schedules may conflict with parents’ work schedules","school activities and sports may finish much later in the day","transportation and school logistics could become more complicated"],"a":"The idea that schools should start later in the morning has received increasing attention in recent years, particularly because of growing concerns about students’ health and academic performance. One strong argument in favor of later school start times is related to sleep. Many teenagers struggle to get enough rest because their biological sleep patterns tend to shift during adolescence. If schools begin very early in the morning, students may arrive feeling tired and unable to concentrate properly. Another benefit is that students may perform better academically when they are well-rested. When individuals have sufficient sleep, their attention span, memory, and overall cognitive performance tend to improve. As a result, lessons may become more productive and effective. However, changing school schedules may also create certain difficulties. For example, later start times could conflict with parents’ working hours, which might make it harder for families to manage daily routines. In addition, extracurricular activities such as sports or clubs could end later in the evening, leaving students with less time for homework or relaxation. Overall, although starting school later could improve students’ health and academic focus, schools would need to carefully consider the practical challenges before implementing such changes."},"wd":[["weekday","any day from Monday to Friday","n.","1.1"],["organize","to arrange or plan something carefully","v.","1.1"],["productive","achieving a lot; effective","adj.","1.1"],["stay healthy","to keep your body in good condition","phrase","1.1"],["nutritious","containing substances the body needs","adj.","1.1"],["in addition","also; as well as that","phrase","1.1"],["combine","to join two or more things together","v.","1.1"],["university","a place where people study after school","n.","1.1"],["eating habits","the way a person usually eats","n.","1.2"],["balanced","containing the right mixture of things","adj.","1.2"],["ingredient","one of the foods used to make a dish","n.","1.2"],["fast food","food that is prepared and served very quickly","n.","1.2"],["soft drink","a cold drink that contains no alcohol","n.","1.2"],["slice","a thin flat piece cut from something","n.","1.2"],["nutrient","a substance that plants or people need to grow junk (n.) cheap food that is not good for health","n.","1.2"],["enjoyable","giving pleasure; pleasant","adj.","1.2"],["convenient","easy to use and saving time or effort junk (n.) cheap food that is not good for health","adj.","1.2"],["gradually","slowly, over a period of time","adv.","1.2"],["long-term","continuing for a long period","adj.","2"],["evaluate","to judge how good or useful something is","v.","2"],["clearer","easier to understand or see","adj.","2"],["confident","sure that you can do something well","adj.","2"],["teenager","a person between 13 and 19 years old","n.","3"],["concentrate","to give your full attention to one thing","v.","3"],["sufficient","enough for a purpose","adj.","3"],["cognitive","connected with thinking and understanding","adj.","3"],["as a result","because of this","phrase","3"],["difficulty","a problem or something hard to do","n.","3"],["routine","the usual way you do things every day","n.","3"],["homework","school work that students do at home","n.","3"],["relaxation","a state of rest after work or stress","n.","3"]]},{"p11":[{"q":"Are there any photos on the walls of your home?","a":"Yes, we have quite a few. In the living room there is a large family photograph from my parents' wedding, and next to it several smaller pictures of me and my brother when we were children. My mother keeps adding new ones every year, so the wall is getting quite full. I like it, because visitors always stop and ask about them, and it makes the room feel personal rather than like a hotel."},{"q":"Can you tell me about your typical day?","a":"My daily routine usually begins fairly early in the morning. After getting ready, I normally focus on my main responsibilities, which mostly involve studying and preparing materials. During the day, I spend time working, reading, or organizing different tasks. In the evening, I try to relax a little by talking with friends, going for a walk, or watching something interesting. Overall, my day is usually quite productive but also balanced."},{"q":"Do you have a pet?","a":"At the moment, I do not have a pet, although I have always liked animals. Keeping a pet can be a wonderful experience because animals often bring companionship and positive emotions into people’s lives. However, having a pet also requires responsibility, including proper care, feeding, and regular attention. For that reason, I would probably consider getting one only when Ihave enough time to look after it properly."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different ways of studying and working on tasks. In the first picture, there is a person sitting at a desk and working on a computer. He appears to be writing notes while looking at the screen. The environment seems to be a quiet personal workspace where he is focusing on his individual task. In contrast, the second picture shows a group of people working together around a table. They are looking at documents and discussing ideas with each other. It seems that they are collaborating on a project in a shared workspace."},{"q":"Which do you prefer: working alone or working in a group?","a":"If I were given the choice, I would probably lean toward working independently, especially when the task requires deep concentration. Being on my own allows me to organize my ideas clearly and proceed at a pace that suits me. That being said, group work certainly has its strengths. When several people collaborate, they can combine their skills and knowledge, which often leads to more creative and effective outcomes."},{"q":"Do you think teamwork is important in the workplace?","a":"Without a doubt, teamwork plays a crucial role in most workplaces today. Many projects are simply too complex for one person to handle alone, so cooperation becomes essential. Moreover, working in teams encourages people to exchange knowledge and support one another when difficulties arise. As a result, organizations that promote strong teamwork often achieve better productivity and overall success."}],"p2":{"prompts":["Tell me about a time when someone gave you useful advice.","Who gave you this advice and why did they give it to you?","How did this advice influence your decisions or behavior?"],"a":"One time when someone gave me very useful advice was during an important period of my studies. I was feeling quite stressed because I had many tasks to complete and several goals that I wanted to achieve. At that time, I sometimes tried to do too many things at once, which made me feel overwhelmed and less productive than I expected. The advice was given to me by one of my teachers. They noticed that I was putting a lot of pressure on myself and trying to finish everything quickly. They told me that instead of rushing, I should focus on working consistently and improving step by step. Their main advice was to concentrate on small daily progress rather than worrying about big results immediately. This advice influenced my behavior quite a lot. After hearing it, I started organizing my work more carefully and creating a more realistic schedule. Instead of stressing about the final outcome, I began focusing on completing smaller tasks every day. Over time, I noticed that this approach made me feel more confident and productive. It also taught me that steady effort is often more effective than trying to achieve everything at once."},"p3":{"topic":"Transportation should be free for everyone","for":["increases accessibility and mobility for low-income citizens","reduces traffic congestion because more people use public transport","helps decrease air pollution and environmental damage"],"against":["governments may struggle to cover the high financial costs","public transport systems could become overcrowded","free services might reduce efficiency and service quality"],"a":"The idea that transportation should be free for everyone is widely discussed as governments try to improve mobility and reduce environmental problems. One argument in favour of free transportation is that it would increase accessibility and mobility for low- income citizens. Many people cannot afford daily transport costs, and free public transport would allow them to travel more easily for work, education, and other important activities. In addition, if transportation were free, more people might choose public transport instead of private cars, which could reduce traffic congestion in busy cities. Another important advantage is that increased use of public transport could help decrease air pollution and environmental damage because fewer private vehicles would be on the roads. However, there are also several arguments against making transportation completely free. One major concern is that governments may struggle to cover the high financial costs of operating and maintaining public transport systems. Without ticket revenue, authorities would need to rely heavily on public funds, which could create pressure on national budgets. Furthermore, free transport might lead to overcrowding, especially during peak hours, since a larger number of people would use buses and trains. Finally, some critics argue that completely free services could reduce efficiency and service quality, as transport providers might have fewer financial incentives to maintain high standards."},"wd":[["living room","the main room where a family sits together","n.","1.1"],["photograph","a picture taken with a camera","n.","1.1"],["wedding","the ceremony when two people get married","n.","1.1"],["visitor","a person who comes to see a place or person","n.","1.1"],["involve","to include something as a necessary part","v.","1.1"],["spend time","to use time doing something","phrase","1.1"],["organize","to arrange or plan something carefully","v.","1.1"],["productive","achieving a lot; effective","adj.","1.1"],["companionship","the pleasant feeling of having company","n.","1.1"],["emotion","a strong feeling such as joy or fear / 30 seconds · no preparation","n.","1.1"],["workspace","the area where a person works","n.","1.2"],["individual","done by one person alone","adj.","1.2"],["collaborate","to work together with other people","v.","1.2"],["project","a piece of planned work with a clear goal","n.","1.2"],["document","a paper with official information on it","n.","1.2"],["discuss","to talk about something with other people","v.","1.2"],["concentration","the ability to give full attention to something","n.","1.2"],["combine","to join two or more things together","v.","1.2"],["teamwork","working together as a group","n.","1.2"],["workplace","the place where a person works","n.","1.2"],["arise","to happen or start to exist","v.","1.2"],["as a result","because of this","phrase","1.2"],["overwhelm","to affect someone so strongly they cannot cope","v.","2"],["consistently","in the same way every time","adv.","2"],["concentrate","to give your full attention to one thing","v.","2"],["outcome","the result of an action or process","n.","2"],["confident","sure that you can do something well","adj.","2"],["e","struggle to cover costs ystems could ded ht reduce efficiency y","","3"],["mobility","the ability to move around easily","n.","3"],["accessibility","how easy something is to reach or use","n.","3"],["citizen","a person who lives in a country or city","n.","3"],["public transport","buses and trains used by everyone","n.","3"],["in addition","also; as well as that","phrase","3"],["traffic congestion","too many vehicles causing delays","n.","3"],["decrease","to become smaller in size or amount","v.","3"],["furthermore","in addition to what was said before","adv.","3"],["peak hours","the busiest times of the day","n.","3"]]},{"p11":[{"q":"Do you like watching TV?","a":"Yes, I do, although I don’t watch TV very often. When I have some free time, I usually prefer watching documentaries or educational programs because they help me learn something new. In my opinion, TV can be both entertaining and informative if you choose the right type of content."},{"q":"What is a famous food in your country?","a":"One famous food in my country is a traditional dish that many people enjoy during family gatherings or special occasions. It is usually prepared with rice, meat, and different spices, which create a rich and distinctive flavor. This dish is very popular and is often considered an important part of our cultural traditions."},{"q":"Do you usually listen to music?","a":"Yes, I listen to music quite regularly. I often listen to it when I’m studying, relaxing, or traveling somewhere. Music helps me improve my mood and feel more motivated. I particularly enjoy calm or meaningful songs because they create a relaxing atmosphere."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different learning environments and ways of receiving education. In the first picture, there is a group of students sitting in a classroom. They appear to be listening to their teacher, and some of them are raising their hands to answer questions. The classroom looks like a traditional learning environment with desks, books, and a teacher standing at the front. In contrast, the second picture shows a student attending an online lesson using a laptop. The student is sitting at a desk and watching a teacher on the computer screen while taking notes. Other people can also be seen in the background, possibly participating in the same online class."},{"q":"Which do you prefer: classroom learning or online learning?","a":"If I had to make a choice, I would probably prefer classroom learning. Being physically present in a class makes it easier to concentrate and participate in discussions. It also allows students to receive immediate feedback from their teachers. That said, online learning can be extremely convenient. It offers flexibility and allows people to access educational materials from any location."},{"q":"Do you think online education will become more popular in the future?","a":"It seems very likely that online education will continue to grow in popularity. Technological advancements have made digital learning platforms more accessible and effective than before. However, I do not think traditional classrooms will disappear completely. Many students still benefit from direct interaction with teachers and classmates, which is something that online education cannot always fully replicate."}],"p2":{"prompts":["Tell me about a time when you disagreed with someone.","How did you handle the disagreement?","Why is it important to learn how to handle conflicts?"],"a":"The disagreement I remember most clearly happened during a group project at work. I was working with a colleague who had a completely different way of approaching problems. I wanted to take a creative, slightly risky direction so that our presentation would stand out, while he preferred a traditional, safe format that had worked before. At the beginning the situation was quite tense, because we were both convinced that our idea was the right one, and neither of us wanted to give way. It was frustrating, and after a few days I noticed that the atmosphere in the whole team had become uncomfortable. Instead of arguing in front of everyone or simply ignoring him, I asked him to have a coffee with me so that we could talk properly. I let him explain his reasoning first, and I actually understood it much better once I heard the details. Then I explained my concerns. In the end we combined the two ideas: we kept his clear, traditional structure but used my creative visual design. The presentation went really well, and honestly, the result was better than either of our original plans. I think learning to handle conflict is essential, because disagreement itself is completely normal. The difference between a good team and a bad one is not whether people argue, but how they argue. If conflicts are handled badly, they destroy relationships and slow everything down. If they are handled well, they often produce better ideas, because different opinions are exactly what stops a group from making obvious mistakes."},"p3":{"topic":"Keeping domestic pets is beneficial for people","for":["pets provide emotional support and companionship","they can reduce stress and improve mental well-being","taking care of pets teaches responsibility and empathy"],"against":["keeping pets requires time, money, and long-term commitment","some pets may cause allergies or health problems","irresponsible pet ownership can lead to animal neglect"],"a":"The idea that keeping domestic pets is beneficial for people is often discussed because pets can influence both emotional well-being and daily responsibilities. One argument in favour of keeping pets is that they provide emotional support and companionship. Many people develop strong bonds with their pets, which can help reduce feelings of loneliness and provide comfort during difficult times. In addition, pets can reduce stress and improve mental well- being. Spending time with animals, such as walking a dog or simply interacting with a pet, can help people relax and improve their mood. Another advantage is that taking care of pets teaches responsibility and empathy. Owners must regularly feed, care for, and pay attention to their animals, which can help them develop discipline and a deeper understanding of others’ needs. However, there are also several challenges related to keeping domestic pets. One major concern is that pets require time, money, and long-term commitment. Owners must provide food, medical care, and regular attention, which may be difficult for people with busy lifestyles. Furthermore, some pets may cause allergies or health problems, especially for individuals who are sensitive to animal hair or certain bacteria. Finally, irresponsible pet ownership can lead to animal neglect if people are not prepared to ca"},"wd":[["in my opinion","used to give your personal view","phrase","1.1"],["informative","giving useful information dish (n.) food prepared in a particular way","adj.","1.1"],["spice","a substance used to give food a strong taste","n.","1.1"],["distinctive","easy to recognise because it is different","adj.","1.1"],["flavor","the taste of a food or drink","n.","1.1"],["relax","to rest and stop feeling worried or tense","v.","1.1"],["motivate","to make someone want to do something","v.","1.1"],["meaningful","important and worth remembering","adj.","1.1"],["learning environment","the surroundings in which people study","phrase","1.2"],["raise your hand","to lift your arm to answer a question","phrase","1.2"],["traditional","following a way of doing things from the past","adj.","1.2"],["online lesson","a lesson given through the internet","n.","1.2"],["take notes","to write down important information","phrase","1.2"],["participate","to take part in an activity","v.","1.2"],["background","the part of a picture behind the main subject","n.","1.2"],["classroom","a room where lessons take place","n.","1.2"],["physically","with the body","adv.","1.2"],["concentrate","to give your full attention to one thing","v.","1.2"],["convenient","easy to use and saving time or effort","adj.","1.2"],["technological","connected with technology","adj.","1.2"],["advancement","progress in knowledge or technology","n.","1.2"],["disappear","to stop existing or being seen","v.","1.2"],["classmate","a person in the same class as you","n.","1.2"],["replicate","to copy something exactly","v.","1.2"],["disagreement","a situation where people have different opinions","n.","2"],["colleague","a person you work with","n.","2"],["completely","totally; in every way","adv.","2"],["presentation","a talk given to a group of people","n.","2"],["situation","the things that are happening at a certain time","n.","2"],["atmosphere","the general feeling of a place","n.","2"],["uncomfortable","not pleasant; causing slight pain or worry","adj.","2"],["properly","in the correct or suitable way","adv.","2"],["explain","to make something clear to somebody","v.","2"],["combine","to join two or more things together","v.","2"],["essential","completely necessary","adj.","2"],["difference","the way in which things are not the same","n.","2"],["ple","ires time, money, mmitment use allergies or ownership can lead","","3"],["beneficial","having a good effect","adj.","3"],["companionship","the pleasant feeling of having company","n.","3"],["comfort","a pleasant feeling of being relaxed and free from pain","n.","3"],["in addition","also; as well as that","phrase","3"],["interact","to talk to and work with other people","v.","3"],["pay attention to","to watch or listen carefully","phrase","3"],["discipline","the ability to control yourself and keep working deeper (adj.) going further down or further into a subject","n.","3"],["long-term","continuing for a long period","adj.","3"],["lifestyle","the way a person lives","n.","3"],["furthermore","in addition to what was said before","adv.","3"]]},{"p11":[{"q":"Can you describe your family?","a":"My family is quite close and supportive. We usually try to spend time together whenever we have the opportunity. Each member of my family has a different personality, but we always respect and help each other. I think having a supportive family is very important because it gives people motivation and confidence in life."},{"q":"What place would you like to visit?","a":"One place I would really like to visit is a country with a rich culture and beautiful landscapes. I’m particularly interested in exploring historical landmarks and experiencing different traditions. Traveling to such places would allow me to broaden my perspective and learn more about the world."},{"q":"What do you use a computer to do?","a":"I use my computer for a lot of different things. Most of the time it is for studying, so writing assignments, doing research and joining online classes. I also use it for communication, because most of my messages and video calls happen there. In my free time I watch films, edit photographs and sometimes play games. Honestly, it has replaced my television, my notebook and my music player completely."}],"p12":[{"q":"What do you se in these pictures?","a":"In these pictures, I can see two different ways of getting around a busy city. In the first picture, there is a young woman stepping onto a public bus through its open door. She appears to be carrying a bag and getting on quickly, and the pavement behind her suggests that this is a busy street in the city centre. It seems that she relies on public transport for her daily journeys. In contrast, the second picture shows a man riding a bicycle to work. He is wearing a formal suit and a safety helmet, and he has a shoulder bag across his chest. It seems that he prefers an active and environmentally friendly way of commuting."},{"q":"Which do you prefer: using public transport or cycling?","a":"Personally, I would lean toward cycling whenever the distance is not too long. Riding a bicycle is both healthy and refreshing because it allows people to stay physically active while commuting. However, public transport can be much more convenient when traveling longer distances or when the weather conditions are not favorable."},{"q":"Do you think more people will start cycling in the future?","a":"There is a strong possibility that cycling will become more popular in the future. Many cities are already encouraging this habit by building special bicycle lanes and promoting environmentally friendly transportation. In addition, as people become more concerned about their health and the environment, cycling may become an attractive alternative to cars and other motorized vehicles."}],"p2":{"prompts":["Tell me about the most significant challenge you have faced.","Why was this challenge particularly difficult for you?","How did you manage to overcome it, and what did you learn from it?"],"a":"One of the most significant challenges I have faced was working toward an important academic goal that required a great deal of effort and discipline. During that time, I had to study many complicated topics and spend long hours practicing and reviewing information. At the same time, I also had other responsibilities that needed my attention. This challenge was particularly difficult because it required both mental concentration and emotional resilience. Sometimes I felt tired or discouraged, especially when progress seemed slower than I expected. There were moments when I doubted whether I would be able to achieve the result I wanted. In addition, balancing different tasks at the same time made the situation even more demanding. I managed to overcome this challenge mainly through persistence and better organization. I started creating a clear schedule for my daily activities and setting small, achievable goals for each day. Gradually, I began to see improvement in my performance, which gave me more motivation to continue working. This experience taught me that determination, patience, and consistent effort are essential when dealing with difficult situations, and that even very challenging goals can be achieved step by step."},"p3":{"topic":"Zoos should be banned worldwide","for":["keeping animals in captivity may harm their natural behavior","zoos often limit animals’ freedom and natural habitats","animals may suffer from stress and poor living conditions"],"against":["zoos help protect endangered species through conservation programs","they provide educational opportunities for the public","zoos support scientific research about animal behavior and biology"],"a":"The idea that zoos should be banned worldwide is widely debated because it raises important questions about animal welfare, conservation, and education. One argument in favour of banning zoos is that keeping animals in captivity may harm their natural behavior. Many wild animals are used to living in large natural habitats where they can hunt, explore, and interact freely with other animals. In zoos, however, their movement and activities are often restricted. I n addition, zoos frequently limit animals’ freedom and natural habitats, which may prevent them from behaving as they normally would in the wild. Another concern is that animals may suffer from stress and poor living conditions, particularly when enclosures are small or do not properly replicate their natural environments. On the other hand, there are also strong arguments against banning zoos completely. One important reason is that many zoos help protect endangered species through conservation programs. Some animals that are close to extinction can be bred and protected in controlled environments. Furthermore, zoos provide educational opportunities for the public, especially for children who can learn about wildlife and environmental protection. Finally, zoos support scientific research about animal behavior and biology, which can help scientists better understand different species and develop more effective strategies for protecting them in the wild."},"wd":[["supportive","giving help and encouragement","adj.","1.1"],["spend time","to use time doing something","phrase","1.1"],["motivation","the reason that makes you want to do something","n.","1.1"],["landscape","the appearance of an area of countryside","n.","1.1"],["explore","to travel through a place or examine an idea","v.","1.1"],["broaden","to make something wider; to increase","v.","1.1"],["assignment","a piece of work given to a student","n.","1.1"],["communication","the sharing of information between people free time (phrase) time when you are not working","n.","1.1"],["photograph","a picture taken with a camera","n.","1.1"],["completely","totally; in every way","adv.","1.1"],["get around","to travel from place to place","phr. v.","1.2"],["public transport","buses and trains used by everyone","n.","1.2"],["pavement","the path at the side of a road rely on (phr. v.) to depend on something or someone","n.","1.2"],["safety helmet","a hard hat that protects your head","n.","1.2"],["shoulder bag","a bag carried by a strap over the shoulder","n.","1.2"],["environmentally friendly","causing little or no harm to nature","adj.","1.2"],["commute","to travel regularly between home and work","v.","1.2"],["physically active","doing regular exercise or sport","phrase","1.2"],["bicycle","a two-wheeled vehicle you ride by pedalling","n.","1.2"],["in addition","also; as well as that paration · 2 minutes to speak","phrase","1.2"],["a great deal of","a large amount of","phrase","2"],["discipline","the ability to control yourself and keep working","n.","2"],["complicate","to make something more difficult","v.","2"],["at the same time","used to add a different point","phrase","2"],["concentration","the ability to give full attention to something","n.","2"],["resilience","the ability to recover quickly from difficulties","n.","2"],["discourage","to make someone less willing to do something slower (adj.) less fast","v.","2"],["overcome","to deal with a problem successfully","v.","2"],["persistence","continuing to try even when it is difficult","n.","2"],["gradually","slowly, over a period of time","adv.","2"],["determination","the will to keep trying until you succeed","n.","2"],["patience","the ability to wait calmly without complaining","n.","2"],["conservation","the protection of nature and wildlife","n.","3"],["habitat","the natural home of an animal or plant","n.","3"],["interact","to talk to and work with other people freely (adv.) without being controlled or limited","v.","3"],["restrict","to limit what someone can do","v.","3"],["replicate","to copy something exactly","v.","3"],["on the other hand","used to introduce the opposite opinion","phrase","3"],["furthermore","in addition to what was said before","adv.","3"],["wildlife","animals and plants living in nature","n.","3"]]},{"p11":[{"q":"Do you like to take photographs?","a":"Yes, I really enjoy it. I mostly photograph landscapes and street scenes rather than people, because I like capturing a moment or a particular light. I only use my phone, but modern phone cameras are surprisingly good, so I have never felt the need to buy a real camera. I have thousands of photos on my phone, and going back through them a year later is like reading a diary."},{"q":"What types of animals do you have in your country?","a":"My country has a surprising variety of animals, mostly because the landscape changes so much. In the mountains there are snow leopards, wolves and mountain goats, although the snow leopard is very rare now and strictly protected. In the desert areas there are foxes, tortoises and many kinds of lizards. There are also a lot of birds, especially around the lakes. Of course, in the towns you mainly see cats, dogs and pigeons."},{"q":"Are there many traditional clothes in your country?","a":"Yes, there are several traditional clothes in my country that reflect our culture and history. These clothes are usually worn during festivals, weddings, or other important celebrations. They often include colorful fabrics and unique patterns, which make them both beautiful and meaningful."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different ways of spending free time. In the first picture, there is a young woman standing alone on a balcony surrounded by pots of flowers and herbs. She appears to be holding a cup and looking at the plants, and the atmosphere seems calm and peaceful. It seems that she enjoys solitude and finds gardening a relaxing hobby. In contrast, the second picture shows a group of teenagers sitting side by side on a low wall outside a building. Some of them are holding books while others are looking at a phone, and they appear to be chatting and laughing together in the sunshine."},{"q":"Which do you prefer: spending time alone or hanging out with friends?","a":"If I had to choose, I would probably say that I enjoy a balance of both. Spending time alone helps me focus on my hobbies and relax without distractions. It can be very refreshing after a busy day. On the other hand, hanging out with friends is equally important because it allows me to socialize, exchange ideas, and create enjoyable memories."},{"q":"Do you think people today spend enough time with their friends","a":"In many cases, people nowadays seem to spend less time with friends than before. Busy schedules, work responsibilities, and digital distractions often reduce opportunities for face-to-face interaction. Nevertheless, many people still make an effort to maintain their friendships by meeting occasionally or staying in touch through social media and messaging platforms."}],"p2":{"prompts":["Tell me about a time when you forgave someone.","Why was it difficult to forgive that person?","What did this experience teach you about forgiveness?"],"a":"One time when I had to forgive someone happened after a misunderstanding between me and another person. During a conversation, something was said that I felt was unfair and slightly hurtful. At that moment, I believed that my intentions had been misunderstood, and this made me feel disappointed and somewhat frustrated. Because of this misunderstanding, the atmosphere between us became a little tense, and for a short time our communication was not as comfortable as before. Forgiving that person was not easy at first because emotions can sometimes make people focus mainly on negative feelings. For several days, I kept thinking about what had happened and replaying the conversation in my mind. I or reacted differently at that moment. However, after thinking wondered whether I should have explained myself more clearly about the situation more calmly, I realized that misunderstandings can easily happen in everyday communication, especially when people are discussing something important. Eventually, I decided that continuing to feel upset would not improve the situation. Instead, I chose to forgive the person and move forward. I tried to understand that people sometimes say things without fully realizing how their words might affect others. This experience taught me that forgiveness is an important part of maintaining healthy relationships. It also showed me that letting go of negative feelings often helps people communicate more openly and rebuild trust over ti"},"p3":{"topic":"Everyone should include musical instruments in their life","for":["playing musical instruments improves creativity and cognitive development","music can reduce stress and improve emotional well-being","learning an instrument develops patience, discipline, and focus"],"against":["learning an instrument requires significant time and practice","musical instruments and lessons can be expensive","not everyone has a strong interest or natural ability in music"],"a":"The idea that everyone should include musical instruments in their life is often discussed because music can influence both personal development and emotional well-being. One argument in favour of this idea is that playing musical instruments improves creativity and cognitive development. Learning music requires individuals to think carefully about rhythm, melody, and coordination, which can stimulate different areas of the brain. In addition, music can reduce stress and improve emotional well-being. Many people use music as a way to relax, express their emotions, and temporarily escape from daily pressures. Another important benefit is that learning an instrument develops patience, discipline, and focus, since mastering musical skills requires regular practice and long-term dedication. However, there are also several reasons why not everyone may include musical instruments in their life. One major challenge is that learning an instrument requires significant time and consistent practice, which may be difficult for people with busy schedules. Furthermore, musical instruments and lessons can be quite expensive, especially for high- quality instruments or professional training. Finally, not everyone has a strong interest or natural ability in music, and forcing individuals to learn an instrument may reduce their motivation and enjoyment."},"wd":[["photograph","a picture taken with a camera","n.","1.1"],["landscape","the appearance of an area of countryside","n.","1.1"],["moment","a very short period of time","n.","1.1"],["particular","one specific thing rather than others","adj.","1.1"],["surprisingly","in a way you did not expect","adv.","1.1"],["especially","more than usual; particularly","adv.","1.1"],["reflect","to think carefully about something","v.","1.1"],["celebration","a special event to mark something happy","n.","1.1"],["meaningful","important and worth remembering / 30 seconds · no preparation","adj.","1.1"],["balcony","a small platform outside an upper window herb (n.) a plant used to add flavour to food","n.","1.2"],["atmosphere","the general feeling of a place","n.","1.2"],["peaceful","quiet and free from noise or trouble","adj.","1.2"],["solitude","the state of being alone and enjoying it","n.","1.2"],["side by side","next to each other","phrase","1.2"],["sunshine","the light and heat that come from the sun","n.","1.2"],["refresh","to make someone feel less tired","v.","1.2"],["on the other hand","used to introduce the opposite opinion","phrase","1.2"],["socialize","to spend time with other people for pleasure","v.","1.2"],["distraction","something that stops you concentrating","n.","1.2"],["nevertheless","in spite of that; however","adv.","1.2"],["social media","websites where people share posts and photos","n.","1.2"],["forgive","to stop being angry with someone","v.","2"],["misunderstand","to understand something in the wrong way","v.","2"],["disappoint","to make someone feel sad about a result","v.","2"],["frustrated","annoyed because you cannot do something","adj.","2"],["emotion","a strong feeling such as joy or fear","n.","2"],["react","to behave in a certain way because of something calmly (adv.) in a quiet, controlled way","v.","2"],["communicate","to share information with other people openly (adv.) without hiding your feelings or opinions","v.","2"],["their life","ment requires nd practice nts and lessons can a strong interest or music","","3"],["creativity","the ability to produce original ideas","n.","3"],["cognitive","connected with thinking and understanding","adj.","3"],["melody","a series of musical notes that make a tune","n.","3"],["coordination","the ability to control body movements well","n.","3"],["stimulate","to encourage something to develop","v.","3"],["in addition","also; as well as that","phrase","3"],["patience","the ability to wait calmly without complaining","n.","3"],["discipline","the ability to control yourself and keep working","n.","3"],["dedication","giving a lot of time and effort to something","n.","3"],["furthermore","in addition to what was said before","adv.","3"],["motivation","the reason that makes you want to do something","n.","3"]]},{"p11":[{"q":"Can you describe a teacher you disliked?","a":"I once had a teacher who was quite strict and rarely showed patience toward students. The lessons were often stressful because students felt uncomfortable asking questions. I believe a good teacher should be supportive and encouraging, so learning can become a more positive and effective experience."},{"q":"What is your favorite meal?","a":"One of my favorite meals is a traditional dish that is both delicious and satisfying. It usually includes rice, meat, and a variety of spices that create a rich flavor. I particularly enjoy eating it with my family during special occasions because it makes the meal more enjoyable."},{"q":"Is using a mobile phone important for you?","a":"Yes, using a mobile phone is quite important for me. I use it for communication, learning, and staying updated with different information. It also helps me organize my daily activities and stay connected with friends and family. However, I try not to rely on it too much."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different ways of travelling long distances. In the first picture, there is a businesswoman sitting in a window seat on an aeroplane. She appears to be holding a phone to her ear while making notes on a pile of documents, and a cup of coffee is standing on the tray in front of her. It seems that she is combining work with travel in order to save time. In contrast, the second picture shows a young woman leaning out of the open window of a moving train. She is smiling and looking along the carriages, and the railway line passes through a green valley surrounded by wooded mountains."},{"q":"Which do you prefer: traveling by train or by plane?","a":"If I had to choose, I would probably prefer traveling by plane, especially when the destination is far away. Flying saves a significant amount of time and makes long-distance travel much more convenient. However, train journeys can also be very enjoyable. They are often more relaxing and give passengers the opportunity to admire landscapes along the way."},{"q":"Do you think air travel will become more common in the future?","a":"It seems very likely that air travel will become even more popular in the future. As globalization continues to grow, more people need to travel for business, tourism, and education. At the same time, advancements in aviation technology may make flights more efficient and accessible. As a result, flying could become the preferred option for many travelers."}],"p2":{"prompts":["Describe a time when you worked together with your classmates.","What was the purpose of the activity or project?","How did working together help you complete the task?"],"a":"One time when I worked together with my classmates was during a group project at school. Our teacher asked us to prepare a presentation about a specific topic, and the class was divided into several small groups. Each group had to research the topic, organize the information clearly, and then present it to the rest of the class in an understandable and engaging way. The purpose of this activity was not only to learn new information but also to help students develop teamwork and communication skills. In our group, we divided the responsibilities so that everyone could contribute to the project. For example, some students focused on collecting useful information from books and online resources, while others organized the material and prepared the visual part of the presentation. A few students also practiced explaining the main ideas so that the final presentation would be clear and interesting. Working together helped us complete the project much more effectively than if we had worked individually. We were able to share different ideas and support each other whenever someone faced difficulties. If one person did not understand a certain concept, another member of the group could explain it. In addition, discussing the topic together helped us think more deeply and produce better ideas for the presentation. This experience showed me that teamwork can be very productive and that cooperation often leads to stronger and more creative results than working alone."},"p3":{"topic":"Video games are beneficial for children","for":["video games can improve problem- solving and strategic thinking","they develop hand-eye coordination and quick decision- making","some educational games help children learn new skills and knowledge"],"against":["excessive gaming may lead to addiction and reduced physical activity","violent games may negatively influence children’s behavior","spending too much time on games can affect academic performance"],"a":"The idea that video games are beneficial for children is often discussed because gaming has become a common part of modern childhood. One argument in favour of video games is that they can improve problem-solving and strategic thinking. Many games require players to analyze situations, plan actions, and make decisions in order to progress through different levels or challenges. In addition, video games help develop handeye coordination and quick decision-making, since players must react rapidly to visual information on the screen. Another advantage is that some educational games help children learn new skills and knowledge, such as mathematics, language, or logical reasoning, while still keeping the learning process engaging and enjoyable. However, there are also concerns about the negative effects of video games on children. One major issue is that excessive gaming may lead to addiction and reduced physical activity, which can negatively affect children’s health and lifestyle. Furthermore, violent games may influence children’s behavior, particularly if they are exposed to aggressive content at a young age. Finally, spending too much time playing games can affect academic performance, as children may devote less time to studying, homework, and other educational responsibilities."},"wd":[["stressful","causing worry and pressure","adj.","1.1"],["uncomfortable","not pleasant; causing slight pain or worry","adj.","1.1"],["supportive","giving help and encouragement","adj.","1.1"],["satisfy","to make someone pleased","v.","1.1"],["spice","a substance used to give food a strong taste","n.","1.1"],["flavor","the taste of a food or drink","n.","1.1"],["enjoyable","giving pleasure; pleasant","adj.","1.1"],["organize","to arrange or plan something carefully rely on (phr. v.) to depend on something or someone","v.","1.1"],["window seat","a seat next to a window","n.","1.2"],["aeroplane","a vehicle that flies through the air","n.","1.2"],["document","a paper with official information on it tray (n.) a flat surface used for carrying food or drink","n.","1.2"],["combine","to join two or more things together","v.","1.2"],["carriage","one of the separate parts of a train","n.","1.2"],["valley","low land between two hills or mountains wooded (adj.) covered with trees","n.","1.2"],["destination","the place you are travelling to","n.","1.2"],["convenient","easy to use and saving time or effort","adj.","1.2"],["admire","to respect and like someone very much","v.","1.2"],["at the same time","used to add a different point","phrase","1.2"],["advancement","progress in knowledge or technology","n.","1.2"],["accessible","easy to reach, enter or use","adj.","1.2"],["as a result","because of this","phrase","1.2"],["traveler","a person who is travelling paration · 2 minutes to speak","n.","1.2"],["classmate","a person in the same class as you","n.","2"],["presentation","a talk given to a group of people","n.","2"],["divide","to separate into parts","v.","2"],["engage","to take part in something with interest","v.","2"],["teamwork","working together as a group","n.","2"],["skill","the ability to do something well","n.","2"],["contribute","to help to make something happen","v.","2"],["collect","to bring things together","v.","2"],["resource","something useful that can be used","n.","2"],["in addition","also; as well as that deeply (adv.) very strongly","phrase","2"],["productive","achieving a lot; effective","adj.","2"],["cooperation","working together towards the same goal","n.","2"],["beneficial","having a good effect","adj.","3"],["analyze","to examine something carefully to understand it","v.","3"],["coordination","the ability to control body movements well","n.","3"],["react","to behave in a certain way because of something","v.","3"],["mathematics","the study of numbers and shapes","n.","3"],["excessive","much more than is reasonable","adj.","3"],["addiction","the state of being unable to stop something","n.","3"],["negatively","in a bad or harmful way","adv.","3"],["expose","to make something known or visible","v.","3"],["homework","school work that students do at home","n.","3"]]},{"p11":[{"q":"Do you play or watch any sport?","a":"Yes, I both play and watch sports occasionally. In terms of playing, I particularly enjoy football because it is both entertaining and physically beneficial. I usually play it with my friends, which makes the experience even more enjoyable. As for watching sports, I tend to follow major football tournaments or important matches since they are often exciting and highly competitive. Overall, sports are a great way to relax, stay healthy, and spend quality time with others."},{"q":"Tell me about the park in your city.","a":"There are several parks in my city where people can relax and enjoy outdoor activities. One of the most popular parks is located near the city center and attracts many visitors, especially in the evening. The park is filled with green trees and has walking paths as well as benches where people can sit and enjoy the peaceful atmosphere. Families often bring their children there, while others go for walks, exercise, or simply enjoy the fresh air. Overall, it is an important place for both recreation and social interaction."},{"q":"Please tell me about your best friend.","a":"My best friend is someone I have known since primary school, so we have been friends for more than ten years. What I value most is that he is completely honest with me, even when I do not want to hear it. He is also very calm, which balances my personality, because I worry about things far too much. We do not see each other every week any more, but when we meet it feels like nothing has changed."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different outdoor activities that people enjoy in completely different seasons. In the first picture, there is a group of young people playing volleyball on a sandy beach. One of them has jumped into the air to hit the ball over the net, while the others are standing with their arms raised, ready to return it. It seems that they are enjoying an energetic game under a clear summer sky. In contrast, the second picture shows several small children kneeling in deep snow. They are wearing thick winter jackets, woolly hats and gloves, and they appear to be building something out of the snow together."},{"q":"Which do you prefer: going to the beach or playing in the snow?","a":"If I had the option, I would probably choose going to the beach. Warm weather, fresh sea air, and the relaxing atmosphere make it a very pleasant experience. It is also a great opportunity to swim or spend time outdoors. That being said, winter activities in the snow can also be extremely exciting, especially when people take part in sports like skiing or snowboarding."},{"q":"Do you think people prefer summer holidays or winter holidays?","a":"In general, it seems that many people prefer summer holidays. Warm temperatures allow people to travel, swim, and participate in a wide range of outdoor activities. Nevertheless, winter holidays also have their own charm. For some individuals, snowy landscapes and winter sports create a unique and memorable travel experience."}],"p2":{"prompts":["What is your favorite movie?","What is the movie about?","Why do you like this movie so much?"],"a":"One of my favorite movies is a film that tells an inspiring story about determination, ambition, and personal growth. The movie focuses on a main character who faces many difficulties in life but continues to pursue an important goal despite numerous obstacles. Throughout the story, the character encounters situations that test their patience, confidence, and resilience. The movie follows the character’s journey as they experience both success and failure while trying to achieve their dream. Along the way, the character meets different people who influence their decisions and provide guidance or support during challenging moments. Some situations in the film are emotionally powerful because they show how difficult it can be to stay motivated when things do not go as planned. However, the character continues to move forward and learn from each experience. I like this movie very much because it is not only entertaining but also meaningful. The story reminds viewers that success usually requires persistence, effort, and belief in oneself. In addition, the message of the movie is very motivating because it shows that challenges are a natural part of personal growth. Whenever I watch this film, it encourages me to stay determined and keep working toward my goals even when I face difficulties. For these reasons, the movie has left a very strong and lasting impression on me."},"p3":{"topic":"Tourism should be limited","for":["excessive tourism can damage natural environments and ecosystems","large numbers of tourists may cause overcrowding in popular destinations","limiting tourism can help preserve local culture and historical sites"],"against":["tourism generates significant income for local economies","it creates employment opportunities in many industries","tourism promotes cultural exchange and international understanding"],"a":"The idea that tourism should be limited is widely debated because tourism brings both economic benefits and environmental challenges. One argument in favour of limiting tourism is that excessive tourism can damage natural environments and ecosystems. When large numbers of visitors travel to the same destinations, they may harm wildlife habitats, increase pollution, and place pressure on natural resources. In addition, popular tourist destinations often become overcrowded, which can reduce the quality of life for local residents and make the experience less enjoyable for visitors. Another important reason is that limiting tourism can help preserve local culture and historical sites, as too many tourists may lead to the commercialization or gradual loss of traditional practices and heritage. However, there are also strong arguments against restricting tourism. Tourism generates significant income for local economies, particularly in regions that rely heavily on visitors for economic growth. It also creates employment opportunities in many industries, including hospitality, transportation, and entertainment. Furthermore, tourism people from different countries have the chance to learn about promotes cultural exchange and international understanding, as new cultures, traditions, and ways of life."},"wd":[["entertain","to interest and amuse someone","v.","1.1"],["beneficial","having a good effect","adj.","1.1"],["enjoyable","giving pleasure; pleasant","adj.","1.1"],["relax","to rest and stop feeling worried or tense","v.","1.1"],["stay healthy","to keep your body in good condition","phrase","1.1"],["outdoor","happening or used outside a building","adj.","1.1"],["attract","to make someone interested in something","v.","1.1"],["visitor","a person who comes to see a place or person","n.","1.1"],["peaceful","quiet and free from noise or trouble","adj.","1.1"],["recreation","activities done for enjoyment","n.","1.1"],["value","how useful or important something is","n.","1.1"],["completely","totally; in every way honest (adj.) telling the truth / 30 seconds · no preparation","adv.","1.1"],["outdoor activity","something you do outside a building","phrase","1.2"],["season","one of the four parts of the year","n.","1.2"],["volleyball","a game in which a ball is hit over a net net (n.) material with holes, used in some sports","n.","1.2"],["energetic","full of energy and enthusiasm","adj.","1.2"],["kneel","to go down on your knees","v.","1.2"],["woolly hat","a warm hat made of wool","n.","1.2"],["glove","clothing that covers your hand","n.","1.2"],["pleasant","enjoyable and nice swim (v.) to move through water using your body","adj.","1.2"],["spend time","to use time doing something take part (phr. v.) to participate in an activity swim (v.) to move through water using your body","phrase","1.2"],["a wide range of","many different types of","phrase","1.2"],["memorable","worth remembering; special","adj.","1.2"],["inspire","to make someone want to do something good","v.","2"],["determination","the will to keep trying until you succeed","n.","2"],["ambition","a strong wish to achieve something","n.","2"],["difficulty","a problem or something hard to do","n.","2"],["pursue","to try hard to achieve something","v.","2"],["obstacle","something that blocks your progress","n.","2"],["encounter","to meet or experience something unexpectedly","v.","2"],["patience","the ability to wait calmly without complaining","n.","2"],["resilience","the ability to recover quickly from difficulties","n.","2"],["emotionally","in a way connected with feelings","adv.","2"],["motivate","to make someone want to do something","v.","2"],["meaningful","important and worth remembering","adj.","2"],["remind","to make someone remember something","v.","2"],["viewer","a person who watches something","n.","2"],["in addition","also; as well as that","phrase","3"],["encourage","to give someone confidence to do something paration · 2 minutes to speak significant income es ment opportunities in cultural exchange understanding","v.","3"],["excessive","much more than is reasonable","adj.","3"],["ecosystem","all the living things in one area together","n.","3"],["habitat","the natural home of an animal or plant","n.","3"],["pollution","harmful substances that damage air or water","n.","3"],["tourist","a person visiting a place on holiday","n.","3"],["overcrowded","having too many people in one place","adj.","3"],["quality of life","how good and comfortable a person's life is","n.","3"],["preserve","to keep something in its original state","v.","3"],["restrict","to limit what someone can do","v.","3"],["generate","to produce or create something","v.","3"]]},{"p11":[{"q":"Tell me about your country.","a":"My country is in Central Asia and it is very rich in history. Cities like Samarkand and Bukhara were important stops on the Silk Road, so there is incredible architecture that is hundreds of years old. The landscape is varied too, with mountains in the east and deserts in the west. But what visitors usually mention first is the hospitality, because guests are treated extremely well here, and of course the food, especially plov."},{"q":"Where do you go in your free time?","a":"In my free time, I usually go to places where I can relax or spend time with friends. For example, I sometimes visit a park, a café, or a quiet place where I can read or think. These places give me an opportunity to take a break from daily responsibilities and enjoy some peaceful moments."},{"q":"What do you like to do in your free time?","a":"In my free time I mainly relax with simple things. I listen to a lot of music, I read before bed, and I meet friends in a cafe at the weekend. When the weather is good, I go walking or hiking, because being outdoors clears my head after a week of studying. I also enjoy cooking, although I only do it properly when I have a whole free afternoon."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different types of accommodation that people choose when they travel. In the first picture, there is a group of friends sitting outdoors around a fire pit in the middle of a forest. A large tent stands behind them on a wooden platform, and they appear to be relaxing in wooden chairs and warming themselves by the flames. It seems that they prefer to be close to nature. In contrast, the second picture shows a woman who has just arrived in a modern hotel room. She is standing beside a large window with her suitcase, and behind her there is a wide bed with neatly arranged towels and cushions."},{"q":"Which do you prefer: camping or staying at a hotel?","a":"From my point of view, I would probably prefer staying at a hotel. One reason is that hotels usually provide a high level of comfort and convenience. After a long day of traveling, it is nice to have a comfortable bed and access to different facilities.That being said, camping can also be an exciting experience. It allows people to connect with nature and enjoy a peaceful environment away from crowded cities."},{"q":"Do you think camping will become more popular in the future?","a":"There is a strong possibility that camping will become more popular in the future. Many people today are looking for ways to relax and escape from stressful urban lifestyles. Spending time in nature can be refreshing and beneficial for both mental and physical well-being. For this reason, outdoor activities such as camping may attract more travelers in the coming years."}],"p2":{"prompts":["Describe a situation when justice was important.","Why was fairness necessary in that situation?","What can happen when justice is not respected?"],"a":"One situation where justice was very important happened during a group activity at school. Our class was wor
