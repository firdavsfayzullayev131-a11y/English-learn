evenue that can be reinvested in public services. Consequently, local businesses thrive and traditional crafts are revived. For instance, the growing number of foreign tourists in Samarkand and Bukhara has enabled many families to earn a living by running guesthouses and selling handmade ceramics.\nIn conclusion, although tourism may overburden local communities, I believe its benefits outweigh its drawbacks, provided that it is managed responsibly.\n(199 words)","wd":[["electricity supply issues","elektr ta’minoti muammolari"],["cause significant inconvenience","jiddiy noqulaylik tug‘dirmoq"],["unfair","adolatsiz"],["extends its working hours","ish vaqtini uzaytirmoq"],["considerable benefits","katta foyda"],["inflict harm on","... ga zarar yetkazmoq"],["place enormous pressure on infrastructure","infratuzilmaga katta bosim tushirmoq"],["generating litter","axlat paydo qilib"],["housing prices often soar","uy narxlari ko‘pincha keskin oshadi"],["converted into","... ga aylantirilgan"],["overcrowded","odam haddan tashqari ko‘p"],["forced to move out","ko‘chib ketishga majbur bo‘lgan"],["a powerful driver of economic growth","iqtisodiy o‘sishning kuchli harakatlantiruvchisi"],["souvenirs","esdalik sovg‘alari"],["generates revenue","daromad keltiradi"],["reinvested in public services","davlat xizmatlariga qayta sarmoya qilingan"],["thrive","gullab-yashnamoq"],["traditional crafts are revived","an’anaviy hunarmandchilik qayta tiklanadi"],["earn a living","tirikchilik qilmoq"],["guesthouses","mehmon uylari"],["overburden","haddan tashqari yuklamoq"],["managed responsibly","mas’uliyat bilan boshqarilgan"]]},{"title":"Library Quiet Zone → Gaming Zone","topic":"Technology in Learning","sit":"You are a member of a local library. You received a message from the library manager.\n\nDear Member,\nWe would like to inform you that the Quiet Zone will be replaced with a new Gaming Zone. Please note that there may also be an additional fee added. We understand that this change may affect some members. We would appreciate it if you could let us know how this change might affect you. We also welcome your suggestions on what actions could be taken to avoid losing existing quiet spaces.\nThe Manager","t11":"Write about 50 words Write a short letter to your friend who also uses this library. Explain what changes have been announced and tell them how you feel about it.","s11":"Hi Shahnoza,\nIt was great to hear from you. Just wanted to let you know about a message I received from the library manager, and I'm not happy about it. Basically, they're replacing the Quiet Zone with a Gaming Zone, and we may have to pay an extra fee. What would you suggest?\nTake care, Abror\n(56 words)","t12":"Write 120–150 words Write a letter to the library manager. Give your opinion about replacing the Quiet Zone with a Gaming Zone. Explain how this change and the additional fee will affect you. Suggest what could be done to keep the quiet spaces.","s12":"Dear Sir or Madam,\nI am writing to express my concern about replacing the Quiet Zone with a new Gaming Zone.\nIn my opinion, a library should be a place for reading and studying. Although a Gaming Zone may attract more young visitors, it will make the library much noisier. Therefore, I believe this change goes against the main purpose of the library.\nThis decision will affect me directly, as I prepare for my exams in the Quiet Zone every day. Without it, I will have to look for another place to study. Moreover, I am not satisfied with the additional fee, since many members are students with limited budgets.\nI would be grateful if you could keep at least one quiet room, for example on the upper floor, far from the Gaming Zone. Soundproof walls would also help.\nI look forward to your reply.\nYours faithfully, Abror Rahmatullayev\n(149 words)","q2":"Some people believe that technology makes learning more effective\nand accessible, while others believe that it distracts students.\nDiscuss both views and give your opinion.\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK MORE EFFECTIVE & ACCESSIBLE","pro":["Free online lectures, apps and digital libraries.","Students learn at their own pace, anywhere.","Interactive tools make lessons more engaging.","Remote areas get access to good teachers."],"ch":"DISTRACTING","con":["Games, social media and videos are tempting.","Attention is divided; less information is remembered.","Easy to copy answers instead of thinking.","Too much screen time harms eyes and sleep. ational exams with mobile apps. entertainment apps during computer lessons."],"ex":["Pupils in remote villages prepare for international exams with mobile apps.","Students switch between assignments and entertainment apps during computer lessons."],"s2":"Some people believe that technology makes learning more effective and accessible, whereas others argue that it distracts students. Both views have merit, but I would argue that technology is beneficial when it is used under proper guidance.\nOn the one hand, technology can seriously divert learners' attention. This is because laptops and tablets give students instant access to games, social networks and videos, which are far more tempting than lessons. As a result, their attention is constantly divided, and they absorb considerably less information. For example, teachers frequently notice students switching between their assignments and entertainment apps during computer-based lessons, which noticeably slows down their progress.\nOn the other hand, technology has revolutionised access to knowledge. Since online platforms offer lectures, interactive exercises and digital libraries free of charge, students can learn at their own pace regardless of where they live. Consequently, educational opportunities are no longer confined to big cities. For instance, pupils in remote villages of Uzbekistan can now prepare for international exams using mobile applications and video tutorials.\nIn conclusion, although technology may distract students, I believe it makes learning more effective and accessible, provided that its use is carefully monitored.\n(194 words)","wd":[["attract","jalb qilmoq"],["goes against the main purpose","asosiy maqsadga zid keladi"],["affect me directly","menga bevosita ta’sir qilmoq"],["limited budgets","cheklangan mablag‘"],["Soundproof walls","ovoz o‘tkazmaydigan devorlar"],["have merit","asosga ega bo‘lmoq"],["under proper guidance","to‘g‘ri yo‘l-yo‘riq ostida"],["divert learners' attention","o‘quvchilar e’tiborini chalg‘itmoq"],["far more tempting","ancha jozibaliroq"],["constantly divided","doimo bo‘lingan"],["absorb","o‘zlashtirmoq"],["switching between","... o‘rtasida almashib"],["noticeably slows down","sezilarli darajada sekinlashtiradi"],["revolutionised access to knowledge","bilimga yo‘lni tubdan o‘zgartirdi"],["interactive exercises","interaktiv mashqlar"],["digital libraries","raqamli kutubxonalar"],["at their own pace","o‘z sur’atida"],["confined to","... bilan cheklangan"],["remote villages","olis qishloqlar"],["video tutorials","video darsliklar"],["carefully monitored","diqqat bilan nazorat qilingan"]]},{"title":"Cinema Club Schedule & Films","topic":"Public Transport or Private Cars?","sit":"You received a message from your cinema club manager.\n\nDear Member,\nTo reduce the theatre rental costs, we are considering moving our weekly movie time from Friday evenings to Tuesday mornings. We are also planning to stop showing international films with subtitles and to focus only on high-budget Hollywood films. What do you think about these changes? What should the club do instead?\nBest wishes,\nThe Cinema Club Manager","t11":"Write about 50 words Write a short letter to your friend who also attends this cinema club with you. Explain the situation about the possible changes and tell them how you feel about it.","s11":"Hi Jahongir,\nHope you're doing well. Just wanted to let you know about a message from our cinema club manager about the new movie time, and I feel a bit upset. They want to move the movie time to Tuesday mornings and show only Hollywood films. I can't come in the mornings because of work. What do you think?\nSee you soon, Abror\n(63 words)","t12":"Write 120–150 words Write a letter to the cinema club manager. • Give your opinion about moving the movie time to Tuesday mornings. • Explain what you think about focusing only on Hollywood movies. • Suggest what the club should do instead.","s12":"Dear Sir or Madam,\nI am writing to express my concern about the possible changes to the cinema club.\nI understand that the theatre rental costs are high. However, moving the movie time to Tuesday mornings would not be suitable for most members, as we work or study at that time. As a result, many people would simply stop coming.\nMoreover, I am not satisfied with the idea of focusing only on Hollywood films. Although they are popular, international films with subtitles are the main reason why many of us joined the club. They allow us to learn about different cultures.\nInstead, I believe the club could slightly increase the membership fee or find a sponsor. Showing films in a cheaper hall on Friday evenings would also be a good solution.\nI hope my suggestions will be helpful in finding the best option.\nYours faithfully, Abror Rahmatullayev\n(147 words)","q2":"Should people use public transport more often instead of private\ncars?\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK PUBLIC TRANSPORT","pro":["Much cheaper than fuel, insurance, repairs and parking.","Fewer emissions per person; cleaner air.","Fewer cars mean less traffic congestion.","No stress of driving or finding a parking space."],"ch":"PRIVATE CARS","con":["More comfortable, private and flexible.","Door-to-door travel, useful with children or luggage.","Buses can be crowded and late.","Little public transport in rural areas. saves a large part of the monthly budget. us journeys faster and more reliable."],"ex":["A Tashkent commuter who takes the metro saves a large part of the monthly budget.","Dedicated bus lanes in Seoul have made bus journeys faster and more reliable."],"s2":"There has been much debate as to whether people should rely on public transport rather than private cars. I firmly believe that they should, as public transport is both more economical and far less harmful to the environment.\nThe first reason why people should switch to public transport is that it is considerably cheaper. This is because car owners have to pay for fuel, insurance and repairs, whereas a bus or metro ticket costs only a fraction of these expenses. As a result, households can save a substantial portion of their monthly budget. For example, a daily commuter in Tashkent taking the metro instead of driving saves a considerable sum every month.\nWhile I acknowledge that private cars offer greater comfort and flexibility, public transport is far better for the environment. Since one bus carries dozens of passengers, it produces significantly fewer emissions per person than individual vehicles. Consequently, wider use of buses would improve air quality and ease rush-hour gridlock. For instance, cities that have introduced dedicated bus lanes, such as Seoul, have made bus journeys faster and more reliable.\nIn conclusion, I believe people should use public transport more often, because it saves money and protects the environment.\n(200 words)","wd":[["rental costs","ijara xarajatlari"],["not be suitable for","... uchun mos bo‘lmaslik"],["with subtitles","subtitrlar bilan"],["membership fee","a’zolik to‘lovi"],["find a sponsor","homiy topmoq"],["rely on","... ga tayanmoq"],["economical","tejamkor"],["far less harmful to the environment","atrof- muhitga ancha kam zararli"],["switch to","... ga o‘tmoq"],["insurance","sug‘urta"],["only a fraction of these expenses","bu xarajatlarning kichik bir qismi"],["a substantial portion","katta qismi"],["monthly budget","oylik byudjet"],["daily commuter","har kuni ishga qatnovchi"],["greater comfort and flexibility","ko‘proq qulaylik va moslashuvchanlik"],["produces significantly fewer emissions","sezilarli darajada kam chiqindi chiqaradi"],["improve air quality","havo sifatini yaxshilamoq"],["ease rush-hour gridlock","tig‘iz soatlardagi tirbandlikni kamaytirmoq"],["dedicated bus lanes","avtobuslar uchun ajratilgan yo‘laklar"],["reliable","ishonchli"]]},{"title":"Cancelled Nature Exhibition","topic":"Studying Abroad","sit":"You are a member of a nature club. You received a message from your club manager.\n\nDear Member,\nDue to a lack of funding, the club has decided to cancel the annual Nature Exhibition. Instead, we are planning to organize an online gallery. In addition, the club is planning to introduce a $20 insurance fee for members who want to take part in future field trips. How did this affect members’ motivation? What do you think about the fee? Please share your opinion and suggestions.\nThe Club Manager","t11":"Write about 50 words Write a short letter to your friend who was planning to take part in the annual Nature Exhibition with you. Explain what has changed and tell them how you feel about it.","s11":"Hi Feruza,\nHow have you been? I just received a message from the club manager about cancelling the Nature Exhibition, and I'm really disappointed. The exhibition has been cancelled because there isn't enough money. Instead, they're planning an online gallery. They also want a $20 fee for field trips. What do you think?\nAll the best, Abror\n(57 words)","t12":"Write 120–150 words Write a letter to the club manager. • Give your opinion about cancelling the Nature Exhibition. • Explain what you think about organizing an online gallery instead. • Say what you think about the $20 insurance fee for the field trip and give your suggestions.","s12":"Dear Sir or Madam,\nI would like to express my dissatisfaction with the cancellation of the annual Nature Exhibition.\nMany members had been preparing their photos and projects for months. The exhibition was also a great chance to share our work with local people. Therefore, its cancellation has seriously reduced members' motivation.\nAs for the online gallery, I believe it is better than nothing. However, it cannot replace a real exhibition, because visitors cannot meet the members or ask them questions.\nIn my opinion, the $20 insurance fee is quite high for students. I would be grateful if you could reduce it or allow members to pay in parts. Moreover, the club could look for local sponsors, which would help to fund next year's exhibition.\nI look forward to your reply.\nYours faithfully, Abror Rahmatullayev\n(135 words)","q2":"Many students are choosing to study abroad. What are the\nadvantages and disadvantages of this trend?\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK ADVANTAGES","pro":["World-class universities and modern facilities.","Become fluent in a foreign language.","International diploma helps to find a good job.","Become independent and open-minded."],"ch":"DISADVANTAGES","con":["Very high tuition fees and living costs.","Homesickness, loneliness and culture shock.","Some students fail or drop out.","Brain drain: graduates may never come back. universities are in high demand at home. e than a family earns in several years."],"ex":["Uzbek graduates from Korean and British universities are in high demand at home.","One year of study in London can cost more than a family earns in several years."],"s2":"Over the last few decades, an increasing number of students have chosen to pursue their education overseas. Although this trend has certain drawbacks, I believe its benefits are of greater significance.\nOn the one hand, studying abroad offers invaluable opportunities. This is because students gain access to world-class universities and modern research facilities while becoming fluent in a foreign language. As a result, they return home with internationally recognised qualifications that considerably enhance their employability. For example, Uzbek graduates of universities in South Korea and the United Kingdom are now in high demand among local employers.\nOn the other hand, studying overseas presents considerable challenges. Since tuition fees and living costs in developed countries are extremely high, many families have to take out loans to support their children. Moreover, students often suffer from homesickness and culture shock in an unfamiliar environment. Consequently, some of them struggle academically or abandon their studies altogether. For instance, a single year in London can cost more than an average Uzbek family earns in several years.\nIn conclusion, although studying abroad can be costly and emotionally demanding, I believe its advantages outweigh its disadvantages, as it provides world-class education and better career prospects.\n(198 words)","wd":[["seriously reduced members' motivation","a’zolarning motivatsiyasini jiddiy pasaytirdi"],["better than nothing","hech narsadan yaxshiroq"],["insurance fee","sug‘urta to‘lovi"],["pay in parts","bo‘lib-bo‘lib to‘lamoq"],["local sponsors","mahalliy homiylar"],["fund","moliyalashtirmoq"],["pursue their education overseas","ta’limni chet elda davom ettirmoq"],["invaluable opportunities","bebaho imkoniyatlar"],["world-class universities","jahon darajasidagi universitetlar"],["research facilities","tadqiqot imkoniyatlari (laboratoriyalar)"],["fluent","ravon gapiradigan"],["internationally recognised qualifications","xalqaro tan olingan malaka"],["enhance their employability","ishga joylashish imkoniyatini oshirmoq"],["in high demand","talab yuqori"],["presents considerable challenges","jiddiy qiyinchiliklar tug‘diradi"],["tuition fees","o‘qish to‘lovlari"],["living costs","yashash xarajatlari"],["take out loans","qarz (kredit) olmoq"],["homesickness","vatan sog‘inchi"],["culture shock","madaniy zarba"],["struggle academically","o‘qishda qiynalmoq"],["abandon their studies altogether","o‘qishni butunlay tashlab ketmoq"],["emotionally demanding","ruhan og‘ir"]]},{"title":"Science Centre Trip Rescheduled","topic":"Who Should Protect the Environment?","sit":"You planned a school trip to the Science Centre to see robotic displays. You received this message from the Science Centre.\n\nDear Organiser,\nWe are sorry to inform you that our robotic displays will be closed this Wednesday for technical maintenance, so your group’s visit has been cancelled. We would be happy to welcome your students next Thursday at the same time instead. Students who cannot come on the new date can receive a full refund. Those who wish to come next week can keep their place.\nKind regards,\nThe Science Centre","t11":"Write about 50 words Write a short email to your friend. • Explain that the trip to the Science Centre has been cancelled. • Tell your friend that it will take place next week instead.","s11":"Hi Ulugbek,\nHope you're doing well. I received an email from the Science Centre, and I'm a bit upset. Our trip on Wednesday has been cancelled because of technical maintenance. But don't worry, we can go next Thursday at the same time instead. What do you think?\nTake care, Abror\n(50 words)","t12":"Write 120–150 words Write an email to the students who registered for the trip. • Inform them that the trip has been cancelled for now. • Explain that it has been rescheduled for next week. • Ask them whether they want a refund or prefer to keep their place for the new date.","s12":"Dear Sir or Madam,\nI am writing to inform you that our trip to the Science Centre on Wednesday has been cancelled. According to the information available, the robotic displays will be closed for technical maintenance on that day.\nPlease accept my apologies for this sudden change. I understand that many of you were looking forward to the visit, and I regret any inconvenience this may have caused.\nFortunately, the Science Centre has offered us a new date. The trip has been rescheduled for next Thursday at the same time, so the plan for the day will remain the same.\nCould you please let me know whether you would like to keep your place for the new date or receive a full refund? I would be grateful if you could reply by Monday.\nI look forward to your reply.\nYours faithfully, Abror Rahmatullayev\n(143 words)","q2":"Some people believe protecting the environment is the\nresponsibility of governments, while others think individuals\nshould act. What is your opinion?\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK GOVERNMENTS","pro":["Have the power to pass laws and limit factory emissions.","Can fund renewable energy and public transport.","Make large-scale changes and international agreements.","Their decisions can cause or reverse huge damage."],"ch":"INDIVIDUALS","con":["Millions of small actions add up: saving water and electricity.","Recycling and using public transport.","Consumer demand forces companies to go green.","Parents set an example and educate children. of huge irrigation projects in the Soviet period. ause both the state and citizens take part."],"ex":["The Aral Sea shrank dramatically because of huge irrigation projects in the Soviet period.","National tree-planting campaigns work because both the state and citizens take part."],"s2":"While some people believe that environmental protection is the responsibility of governments, others think that individuals should take action. In my view, governments should play the leading role, although individual efforts also make a meaningful contribution.\nOn the one hand, individuals can make a real difference. This is because when millions of people conserve water and electricity, recycle and use public transport, these small actions have a cumulative effect. Moreover, consumer demand can compel companies to manufacture environmentally friendly products. As a result, everyday choices can reshape industries. For example, the growing demand for reusable bags has encouraged many shops to stop offering plastic ones.\nHaving said that, governments possess far greater power to protect the environment. They can enact laws that restrict factory emissions and invest in renewable energy, since they control national budgets and regulations. Consequently, their decisions affect millions of people at once, for better or worse. For example, the Aral Sea shrank dramatically because of large-scale irrigation projects during the Soviet period.\nIn conclusion, although individuals can contribute through daily habits, I believe governments bear the primary responsibility for protecting the environment because they are capable of implementing large-scale changes.\n(194 words)","wd":[["According to the information available","mavjud ma’lumotlarga ko‘ra"],["technical maintenance","texnik xizmat ko‘rsatish"],["Please accept my apologies for","... uchun uzrimni qabul qiling"],["I regret any inconvenience this may have caused","yuzaga kelgan noqulaylik uchun afsusdaman"],["rescheduled","boshqa vaqtga ko‘chirildi"],["remain the same","o‘zgarishsiz qoladi"],["Could you please let me know","iltimos, menga xabar bera olasizmi"],["take action","chora ko‘rmoq"],["make a meaningful contribution","salmoqli hissa qo‘shmoq"],["conserve water and electricity","suv va elektrni tejamoq"],["a cumulative effect","to‘plangan (yig‘indi) ta’sir"],["consumer demand","iste’molchi talabi"],["compel companies to","kompaniyalarni ... ga majbur qilmoq"],["environmentally friendly products","ekologik toza mahsulotlar"],["reshape industries","sanoat tarmoqlarini o‘zgartirmoq"],["enact laws","qonun qabul qilmoq"],["restrict factory emissions","zavod chiqindilarini cheklamoq"],["renewable energy","qayta tiklanuvchi energiya"],["for better or worse","yaxshimi-yomonmi"],["shrank dramatically","keskin kichraydi"],["irrigation projects","sug‘orish loyihalari"],["bear the primary responsibility","asosiy mas’uliyatni zimmasiga olmoq"],["implementing","amalga oshirish"],["large-scale changes","keng ko‘lamli o‘zgarishlar"]]},{"title":"Winter Event Venue Change","topic":"Video Games: Waste of Time or Useful Skill?","sit":"You have received a message from your manager.\n\nDear Colleague,\nAs the hall for our winter event has become too expensive, we are planning to cancel the booking and move the event to the new shopping centre instead. We are also considering creating a separate registration form for all participants. Please let me know what you think about these changes.\nBest regards,\nMr Rahimov, Manager","t11":"Write about 50 words Write a short message to your colleague who was also going to attend the winter event. Explain what the manager has decided and tell them how you feel about it.","s11":"Hi Mohira,\nIt was great to hear from you. I just received a notice from Mr Rahimov about the winter event we were planning, and I'm a bit worried. As the hall is too expensive, the event will move to the new shopping centre. I think it'll be too noisy there. What would you suggest?\nSee you soon, Abror\n(59 words)","t12":"Write 120–150 words Write a message to your manager. • Say what you think about moving the event to a shopping center. • Give your opinion about creating a separate form. • Explain how these changes might affect the event and participants.","s12":"Dear Mr Rahimov,\nI am writing in response to your message about the changes to our winter event.\nI understand that the hall has become too expensive. However, I am not sure that the new shopping centre is the right place for our event. Although it is modern and easy to reach, it is usually crowded and noisy, especially in winter. Therefore, it may be difficult for guests to hear the speeches.\nAs for the separate registration form, I believe it is a great idea. It would help us know the exact number of participants and prepare enough seats and food.\nIn other words, the form would make the event more organized, while the new location might make it less comfortable. I would be grateful if you could consider booking a quiet area inside the shopping centre.\nI look forward to your reply.\nYours sincerely, Abror Rahmatullayev\n(147 words)","q2":"Is playing video games a waste of time or a useful skill? Discuss\nthe advantages and disadvantages.\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK ADVANTAGES","pro":["Develop problem-solving and quick decision-making.","Team games teach cooperation.","E-sports can become a real career.","A way to relax and reduce stress."],"ch":"DISADVANTAGES","con":["Very addictive; players lose track of time.","Less sleep, study and physical activity.","Eye strain and poor posture.","Some games contain violence. orts tournaments with million-dollar prizes. ntrate in morning lessons."],"ex":["Players from Central Asia compete in e-sports tournaments with million-dollar prizes.","Pupils who play late at night cannot concentrate in morning lessons."],"s2":"With the advent of modern technology, video games have become one of the most popular pastimes among young people. Although gaming has certain benefits, I believe its drawbacks are more significant when it is not done in moderation.\nOn the one hand, video games can develop valuable skills. This is because many games require players to solve complex problems, make split-second decisions and cooperate with teammates. As a result, regular players often improve their reaction speed and strategic thinking. Moreover, the e-sports industry has turned gaming into a profession. For example, professional players from Central Asia now compete in international tournaments with prize pools worth millions of dollars.\nOn the other hand, excessive gaming can be highly detrimental. Since many games are deliberately designed to be addictive, players frequently lose track of time and neglect their studies, sleep and physical activity. Consequently, they may suffer from poor academic results and social isolation. For instance, teachers often report that pupils who play late into the night are unable to concentrate during morning lessons.\nIn conclusion, although video games can sharpen certain skills, I believe they become a waste of time when played excessively, so moderation is essential.\n(196 words)","wd":[["I am not sure that","... ga ishonchim komil emas"],["easy to reach","borish oson"],["crowded","gavjum"],["registration form","ro‘yxatdan o‘tish shakli"],["the exact number of participants","ishtirokchilarning aniq soni"],["consider booking","band qilishni ko‘rib chiqmoq"],["With the advent of","... paydo bo‘lishi bilan"],["pastimes","bo‘sh vaqt mashg‘ulotlari"],["in moderation","me’yorida"],["solve complex problems","murakkab muammolarni hal qilmoq"],["make split-second decisions","bir zumda qaror qabul qilmoq"],["reaction speed","reaksiya tezligi"],["strategic thinking","strategik fikrlash"],["the e-sports industry","kibersport sanoati"],["compete in international tournaments","xalqaro turnirlarda bellashmoq"],["prize pools","sovrin jamg‘armasi"],["highly detrimental","juda zararli"],["deliberately designed","ataylab yaratilgan"],["neglect their studies","o‘qishini e’tiborsiz qoldirmoq"],["social isolation","ijtimoiy yolg‘izlik"],["late into the night","tunning kech soatlarigacha"],["sharpen certain skills","ayrim ko‘nikmalarni charxlamoq"],["moderation is essential","me’yor zarur"]]},{"title":"Drama Club Venue & Sound System","topic":"A Second Language to Graduate?","sit":"You are a member of a drama club and the club leader has sent you this message.\n\nDear Member,\nThere are new updates. Due to a double-booking at the local theater, we will now be performing the summer play in the “Open-Air Town Square” instead of on a professional stage. Also, we are removing all the “Microphones and Sound Systems” to create a more traditional atmosphere. How will the move to a new location affect your performance? What do you think about removing all the sound systems?\nRegards,\nClub Leader","t11":"Write about 50 words Write an email to your friend, who is also a member of the drama club. What are your feelings about the changes and what should the club management do?","s11":"Hi Sevara,\nHope you're doing well. Guess what? I just got a message from our club leader, and I'm quite worried. Our summer play will be in the town square, not on a real stage, and there won't be any microphones. Nobody will hear us! I think they should keep the sound system. What do you think?\nTake care, Abror\n(60 words)","t12":"Write 120–150 words Write an email to the club leader. What are your feelings about the changes and what should the club management do?","s12":"Dear Sir or Madam,\nI am writing to express my concern about the recent changes to our summer play.\nAdmittedly, performing in the Open-Air Town Square could attract more people, as it is a popular place in the city. However, it is a noisy area with traffic and crowds. Therefore, I believe removing all the microphones and sound systems would be a serious mistake, because the audience would not be able to hear the actors.\nMoreover, the move would affect our performance. We have always rehearsed on a professional stage, so we would need extra time to prepare for the new location.\nIn my opinion, the club management should keep at least a few microphones and organize some rehearsals in the square before the show. I would be grateful if you could consider these suggestions.\nI look forward to your reply.\nYours faithfully, Abror Rahmatullayev\n(145 words)","q2":"Should every student be required to learn a second language to\ngraduate?\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK ARGUMENTS FOR","pro":["Better jobs and higher salaries in a global economy.","Better memory and problem-solving skills.","Access to books, articles and courses in other languages.","Respect and understanding for other cultures."],"ch":"ARGUMENTS AGAINST","con":["Some students find languages very difficult.","Extra pressure and stress before graduation.","Time could be spent on the student's main subject.","Not every job needs a foreign language. n prefer candidates with IELTS or CEFR. that do not exist in Uzbek."],"ex":["Banks and international firms in Uzbekistan prefer candidates with IELTS or CEFR.","English opens millions of academic articles that do not exist in Uzbek."],"s2":"Whether every student should be obliged to learn a second language in order to graduate is a controversial issue. I firmly believe that this requirement is justified, as foreign language skills broaden career prospects and develop the mind.\nThe primary reason why a second language should be compulsory is that it significantly enhances job prospects. This is because globalisation has led international companies to seek employees who can communicate with foreign partners and clients. As a result, graduates who speak another language have access to a far wider range of positions. For example, in Uzbekistan, candidates with an IELTS certificate are often given priority by banks.\nWhile I acknowledge that some students struggle with languages and may feel overwhelmed, learning one also boosts cognitive development. Since switching between languages trains the brain to process information more flexibly, bilingual learners tend to have better memory and problem- solving skills. Consequently, they often perform better in other subjects. For instance, students who learn English gain access to millions of academic articles that are unavailable in their native language.\nIn conclusion, I believe every student should be required to learn a second language before graduating, as it improves career prospects and sharpens the mind.\n(200 words)","wd":[["a serious mistake","jiddiy xato"],["rehearsed","repetitsiya qilgan"],["the club management","klub rahbariyati"],["rehearsals","repetitsiyalar"],["obliged to","... ga majbur"],["a controversial issue","munozarali masala"],["justified","asosli"],["broaden career prospects","martaba imkoniyatlarini kengaytirmoq"],["develop the mind","aqlni rivojlantirmoq"],["significantly enhances job prospects","ish topish imkoniyatini sezilarli oshiradi"],["globalisation","globallashuv"],["communicate with foreign partners","xorijiy hamkorlar bilan muloqot qilmoq"],["a far wider range of positions","ancha kengroq lavozimlar doirasi"],["given priority","ustunlik berilgan"],["feel overwhelmed","o‘zini og‘ir yuk ostida his qilmoq"],["boosts cognitive development","aqliy rivojlanishni kuchaytiradi"],["process information more flexibly","ma’lumotni moslashuvchanroq qayta ishlamoq"],["bilingual learners","ikki tilni biluvchi o‘quvchilar"],["problem-solving skills","muammolarni hal qilish ko‘nikmalari"],["academic articles","ilmiy maqolalar"],["native language","ona tili"],["sharpens the mind","aqlni charxlaydi"]]},{"title":"Local Cinema Changes","topic":"Self-Employment or a Company Job?","sit":"You received an email from a local cinema.\n\nDear Customer,\nWe would like to inform our customers about some changes at our local cinema. Because of increasing cleaning costs, food and drinks will no longer be sold inside the cinema. In addition, we are planning to introduce a mobile app for buying tickets more easily. How do you feel about these changes? What problems might these changes cause for customers? What should the manager do to make the cinema better?\nBest wishes,\nThe Manager","t11":"Write about 50 words Write a short email to your friend who also visits this cinema. Tell them about the manager’s message and ask how they feel about the new changes and what suggestions they would give.","s11":"Hi Javohir,\nHow's everything going with you? I wanted to tell you about the email I received from our local cinema. To be honest, I'm not happy about it. They won't sell food and drinks anymore, but they're going to introduce a mobile app for tickets. How do you feel about these changes? What would you suggest?\nAll the best, Abror\n(61 words)","t12":"Write 120–150 words Write an email to the cinema manager. Describe your feelings about the changes, explain any problems they may cause, and suggest what the manager should do to improve the cinema.","s12":"Dear Sir or Madam,\nI would like to express my dissatisfaction with the new rule that food and drinks will no longer be sold inside the cinema.\nAdmittedly, I was disappointed by this news. For many people, popcorn and drinks are an important part of watching a film. However, I am extremely happy about the new mobile app, as it will save customers a lot of time.\nHowever, these changes may cause some problems. Customers might bring their own food, which could make the hall even dirtier. Moreover, older people may find the app difficult to use.\nIn my opinion, you could sell food only in the waiting area and add more rubbish bins. I would also suggest keeping the ticket office open for those who do not use smartphones.\nI hope my suggestions will be helpful in making the cinema better for everyone.\nYours faithfully, Abror Rahmatullayev\n(148 words)","q2":"Is it better to work for yourself or for a company?\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK WORKING FOR YOURSELF","pro":["Freedom to choose your schedule and projects.","You keep all the profit.","More motivation and personal satisfaction.","Chance to turn a hobby into a business."],"ch":"WORKING FOR A COMPANY","con":["A fixed salary every month.","Paid holidays, sick leave and social benefits.","Less financial risk and stress.","Training, teamwork and clear career steps. nd cafés and earn more than employees. es closed, but salaried workers still got paid."],"ex":["Young entrepreneurs open online stores and cafés and earn more than employees.","During the pandemic many small businesses closed, but salaried workers still got paid."],"s2":"The question of whether people should work for themselves or for a company has sparked considerable debate. In my view, being employed by a company is a wiser choice for most people, although self-employment certainly has its appeal.\nOn the one hand, running one's own business offers remarkable independence. This is because self-employed people can set their own schedules, choose their projects and keep all the profits they generate. As a result, they often feel more motivated and fulfilled. For example, many young entrepreneurs in Uzbekistan have launched successful online stores and cafés, earning far more than they would as employees.\nHowever, working for a company provides stability and security. Since employees receive a fixed monthly salary, paid holidays and social benefits, they are protected from the financial risks that business owners face. Consequently, they can plan their expenses with confidence and avoid the stress of an unpredictable income. For instance, during the COVID-19 pandemic, countless small businesses went bankrupt, while many salaried employees continued to receive their wages.\nIn conclusion, although self-employment offers freedom and potentially higher earnings, I believe working for a company is preferable because it guarantees financial stability and lower risk.\n(195 words)","wd":[["an important part of","... ning muhim qismi"],["save customers a lot of time","mijozlarga ko‘p vaqt tejamoq"],["cause some problems","ba’zi muammolarga sabab bo‘lmoq"],["rubbish bins","axlat qutilari"],["ticket office","chipta kassasi"],["has sparked considerable debate","katta bahsga sabab bo‘ldi"],["a wiser choice","oqilonaroq tanlov"],["self-employment","o‘zini o‘zi band qilish"],["has its appeal","o‘ziga jalb qiluvchi tomoni bor"],["remarkable independence","katta mustaqillik"],["set their own schedules","o‘z jadvalini o‘zi belgilamoq"],["keep all the profits they generate","topgan barcha foydasini o‘zida qoldirmoq"],["fulfilled","qoniqish hosil qilgan"],["entrepreneurs","tadbirkorlar"],["launched","ishga tushirdi"],["stability and security","barqarorlik va xavfsizlik"],["social benefits","ijtimoiy imtiyozlar"],["financial risks","moliyaviy xatarlar"],["plan their expenses with confidence","xarajatlarini ishonch bilan rejalashtirmoq"],["an unpredictable income","oldindan aytib bo‘lmaydigan daromad"],["went bankrupt","bankrot bo‘ldi"],["salaried employees","maosh oluvchi xodimlar"],["potentially higher earnings","ehtimoliy yuqoriroq daromad"]]},{"title":"Delayed Swimming Lessons","topic":"School Lunches or Food from Home?","sit":"You received an email from your local sports centre.\n\nDear Student,\nWe would like to inform all students that swimming lessons will begin one week later than planned because of maintenance work in the pool area. We apologise for the inconvenience. How do you feel about this change? What problems may this cause for students? What should the sports centre do to help students during this period?\nBest wishes,\nThe Sports Centre Manager","t11":"Write about 50 words Write a short email to your friend who also attends these swimming lessons. Tell them about the delay and ask how they feel about it and what the sports centre should do.","s11":"Hi Laylo,\nHope you're doing well. Just wanted to let you know about an email from the sports centre regarding delays in swimming lessons, and I'm a bit disappointed. The lessons will start one week later because of maintenance work in the pool. How do you feel about it? What do you think the sports centre should do?\nSee you soon, Abror\n(62 words)","t12":"Write 120–150 words Write an email to the sports centre manager. Describe your opinion about the delayed lessons, explain possible problems for students, and suggest some improvements or solutions.","s12":"Dear Sir or Madam,\nI am writing in response to your email regarding the delay of the swimming lessons.\nAlthough I understand that maintenance work is necessary, I was disappointed by this news. Many students, including me, had already planned their weekly schedules around these lessons.\nThis delay may cause several problems for students. For example, those who are preparing for swimming competitions will lose a week of practice. Moreover, some students may have already paid for the whole month, which means they will receive fewer lessons.\nTherefore, I would be grateful if you could add extra lessons at the end of the course or offer a small discount. In other words, students should not lose the time and money they have already spent. Free gym sessions during this week would also be helpful.\nI look forward to your reply.\nYours faithfully, Abror Rahmatullayev\n(144 words)","q2":"Do you think schools should provide lunch for students, or should\nstudents bring their own food from home?\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK SCHOOL LUNCHES","pro":["Balanced, hot meals for every pupil.","Children from poor families also eat well.","Parents save time in the morning.","Pupils eat together and learn table manners."],"ch":"FOOD FROM HOME","con":["Parents know their children's tastes.","Safer for allergies and special diets.","Can be cheaper than paying for school meals.","Children may not like school food and waste it. ecades. fer with a lunch box from home."],"ex":["Finland has offered free school meals for decades.","A child who cannot eat dairy products is safer with a lunch box from home."],"s2":"Opinions are divided on whether schools should provide meals for pupils or whether children should bring food from home. In my opinion, schools should take responsibility for providing lunch, as this ensures that every child eats a nutritious meal.\nOn the one hand, bringing food from home has advantages. This is because parents know their children's tastes and dietary needs and prepare meals accordingly. As a result, children are more likely to finish their food, and families with allergies or special diets can avoid potential risks. For example, a child who cannot eat dairy products is safer with a home-made lunch box.\nHowever, school lunches offer more significant benefits. Since parents often work long hours, children frequently bring unhealthy snacks such as crisps and sweets instead of proper meals. When schools provide balanced lunches, every pupil gets the energy needed for afternoon lessons. Consequently, both health and concentration improve, especially among children from low- income families. For instance, Finland has offered free school meals for decades, which are widely credited with supporting pupils' well-being.\nIn conclusion, although home-made lunches can suit individual needs, I believe schools should provide lunch for students because it guarantees healthy and equal nutrition for all.\n(199 words)","wd":[["maintenance work","ta’mirlash ishlari"],["planned their weekly schedules around","haftalik rejasini ... ga moslab tuzgan"],["lose a week of practice","bir haftalik mashg‘ulotni boy bermoq"],["offer a small discount","kichik chegirma taklif qilmoq"],["Opinions are divided","fikrlar ikkiga bo‘lingan"],["take responsibility for","... uchun mas’uliyatni o‘z zimmasiga olmoq"],["a nutritious meal","to‘yimli taom"],["dietary needs","ovqatlanish ehtiyojlari"],["accordingly","shunga mos ravishda"],["allergies","allergiya"],["special diets","maxsus parhez"],["potential risks","ehtimoliy xavflar"],["dairy products","sut mahsulotlari"],["unhealthy snacks","zararli yengil yeguliklar"],["balanced lunches","muvozanatli tushliklar"],["low-income families","kam ta’minlangan oilalar"],["widely credited with","keng e’tirof etilgan"],["suit individual needs","shaxsiy ehtiyojlarga mos kelmoq"],["equal nutrition","teng ovqatlanish"]]},{"title":"Cancelled Drama Performance","topic":"Globalisation and Local Cultures","sit":"You received an email from your local drama club.\n\nDear Visitor,\nWe are sorry to inform you that tonight’s summer evening performance has been cancelled because the main actor is ill. We apologise for the inconvenience. Another performance will be organised next week. How do you feel about this cancellation? What problems may this cause for visitors? What should the theatre do to help people during this situation?\nBest wishes,\nThe Theatre Manager","t11":"Write about 50 words Write a short email to your friend who was planning to attend the performance with you. • Tell them about the cancellation. • Ask how they feel about it. • Ask what the theatre should do.","s11":"Hi Doniyor,\nHope you're doing well. You won't believe it but tonight's summer performance at the drama club has been cancelled, and I'm really upset. The reason is that the main actor is ill. They'll organize another one next week. How do you feel about it? What should the theatre do?\nTake care, Abror\n(54 words)","t12":"Write 120–150 words Write an email to the theatre manager. • Describe your feelings about the cancellation. • Explain possible problems for visitors. • Suggest some improvements or solutions.","s12":"Dear Sir or Madam,\nI am writing in response to your email about the cancellation of tonight's summer evening performance.\nAdmittedly, I was extremely disappointed, as I had been waiting for this show for weeks. However, I understand that the actor's illness was not anyone's fault, and I hope he feels better soon.\nThis cancellation may cause several problems for visitors. Some people had travelled from other towns or booked taxis, so they have already lost money. Moreover, not everyone will be free next week.\nTherefore, I kindly request that you offer visitors a choice between a full refund and a ticket for the new performance. In my opinion, giving a small discount next week would also show that the theatre cares about its audience.\nThank you for your attention to this matter.\nYours faithfully, Abror Rahmatullayev\n(137 words)","q2":"The world is becoming too similar. What impact has globalisation\nhad on local cultures and traditions?\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK NEGATIVE IMPACT","pro":["Global brands and fast food replace local products.","Young people copy Western fashion and festivals.","Local languages and crafts slowly disappear.","Cities around the world start to look the same."],"ch":"POSITIVE IMPACT","con":["Local culture can reach a global audience online.","Tourism brings interest and money to traditions.","Cultural exchange and new ideas.","International recognition (e.g. UNESCO). loween but know fewer traditional songs. le Cultural Heritage."],"ex":["Young people in Uzbek cities celebrate Halloween but know fewer traditional songs.","Uzbek plov is on UNESCO's list of Intangible Cultural Heritage."],"s2":"In the age of globalisation, many people claim that the world is becoming increasingly uniform. In my view, globalisation has had both negative and positive effects on local cultures, although its threat to traditions is particularly worrying.\nOn the one hand, globalisation has led to the erosion of cultural diversity. This is because international brands, fast-food chains and Hollywood films have spread to almost every corner of the globe, shaping people's tastes and lifestyles. As a result, younger generations increasingly adopt Western fashion and entertainment, while traditional customs gradually fade. For example, many young people in Uzbek cities now celebrate Halloween, yet few know traditional songs.\nOn the other hand, globalisation has also given local cultures an international platform. Since the internet and tourism allow people to share their heritage with the rest of the world, traditional cuisine, music and art can attract global attention. Consequently, some traditions are being revived. For instance, Uzbek plov has been inscribed on UNESCO's list of Intangible Cultural Heritage, and Samarkand hosts the international Sharq Taronalari music festival.\nIn conclusion, although globalisation threatens the uniqueness of local traditions, it also promotes them worldwide, so its impact largely depends on how communities preserve their heritage.\n(200 words)","wd":[["was not anyone's fault","hech kimning aybi emas edi"],["lost money","pul yo‘qotdi"],["a full refund","to‘liq pul qaytarish"],["cares about its audience","tomoshabinlariga g‘amxo‘rlik qiladi"],["In the age of globalisation","globallashuv davrida"],["increasingly uniform","tobora bir xil"],["the erosion of cultural diversity","madaniy xilma- xillikning yemirilishi"],["every corner of the globe","dunyoning har bir burchagi"],["shaping people's tastes and lifestyles","odamlarning didi va turmush tarzini shakllantirib"],["younger generations","yosh avlodlar"],["adopt Western fashion","G‘arb modasini qabul qilmoq"],["traditional customs gradually fade","an’anaviy urf-odatlar asta-sekin yo‘qolib boradi"],["an international platform","xalqaro maydon"],["share their heritage","o‘z merosini baham ko‘rmoq"],["attract global attention","dunyo e’tiborini tortmoq"],["revived","qayta tiklangan"],["inscribed on","... ro‘yxatiga kiritilgan"],["Intangible Cultural Heritage","nomoddiy madaniy meros"],["threatens the uniqueness","o‘ziga xoslikka tahdid soladi"],["preserve their heritage","merosini asrab qolmoq"]]},{"title":"Youth Club Outdoor Activities","topic":"Online Courses vs Classroom Lessons","sit":"You received an email from your local youth club.\n\nDear Member,\nWe would like to inform all members that we are planning to reduce screen time activities at the club and organise more outdoor activities such as sports games, hiking trips and camping events. We hope these changes will help young people become more active and social. How do you feel about these changes? What problems may these changes cause for some members? What should the youth club do to make these activities more enjoyable?\nBest wishes,\nThe Youth Club Manager","t11":"Write about 50 words Write a short email to your friend who is also a member of the youth club. • Tell them about the new changes. • Ask how they feel about reducing screen time. • Ask what outdoor activities they would enjoy.","s11":"Hi Dildora,\nHope you're doing well. I thought you'd like to know about the new changes at the youth club, and I think it's great news. They're planning fewer screen time activities and more hiking trips and camping. How do you feel about less screen time? What outdoor activities would you enjoy?\nAll the best, Abror\n(56 words)","t12":"Write 120–150 words Write an email to the youth club manager. • Describe your opinion about the new activities. • Explain possible problems for some members. • Suggest ideas to improve the outdoor programmes.","s12":"Dear Sir or Madam,\nI would like to provide some details regarding your plan to organize more outdoor activities.\nIn general, I am extremely happy about these changes. Young people spend too much time in front of screens nowadays, so sports games and hiking trips would help them become healthier and more social.\nAdmittedly, these changes may cause some problems for certain members. For example, some people are not fit enough for long hikes, while others may not be able to afford camping equipment. Moreover, members who enjoy computer games might stop visiting the club.\nTherefore, I believe the club should offer activities of different levels and provide equipment for free. In other words, everyone should be able to take part. Keeping one gaming evening a week would also help the club keep all of its members.\nI hope my suggestions will be helpful.\nYours faithfully, Abror Rahmatullayev\n(148 words)","q2":"Some people believe online courses are as effective as classroom\nlessons. What is your opinion?\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK ONLINE COURSES","pro":["Flexible: study any time and rewatch recorded lessons.","Remove geographical barriers — top teachers from anywhere.","Often cheaper; no travel costs.","Ideal for self-motivated adults with jobs."],"ch":"CLASSROOM LESSONS","con":["Teachers monitor progress and give immediate feedback.","More interaction and speaking practice.","A fixed timetable builds discipline.","Fewer distractions than at home. LTS course taught by a teacher in Tashkent. ng video lessons."],"ex":["A student in a small town joins an online IELTS course taught by a teacher in Tashkent.","Young learners quickly lose focus during long video lessons."],"s2":"It is often argued that online courses are as effective as classroom lessons. In my opinion, although online learning has clear benefits, classroom lessons remain more effective for most students.\nOn the one hand, online courses offer remarkable flexibility. This is because students can study at any time and rewatch recorded lessons as many times as necessary, regardless of their location. As a result, people who live far from big cities or work full-time can still access quality education. For example, a student in a small town can join an online IELTS course taught by a teacher in Tashkent.\nNevertheless, classroom lessons are more effective in several respects. Teachers can monitor students' progress and provide immediate feedback, since they can see students' reactions and mistakes in real time. Consequently, learners correct their errors promptly and receive more speaking practice. Online learners, by contrast, face numerous distractions at home and find it harder to stay focused. For instance, young learners quickly lose concentration during long video lessons.\nIn conclusion, although online courses are flexible and accessible, I believe classroom lessons are more effective because they offer direct feedback, interaction and fewer distractions.\n(191 words)","wd":[["healthier and more social","sog‘lomroq va kirishimliroq"],["not fit enough","jismonan yetarlicha baquvvat emas"],["afford camping equipment","lager jihozlarini sotib olishga qurbi yetmoq"],["activities of different levels","turli darajadagi mashg‘ulotlar"],["remarkable flexibility","ajoyib moslashuvchanlik"],["rewatch recorded lessons","yozib olingan darslarni qayta ko‘rmoq"],["regardless of their location","qayerda yashashidan qat’i nazar"],["access quality education","sifatli ta’lim olish"],["in several respects","bir qancha jihatdan"],["monitor students' progress","o‘quvchilar o‘sishini kuzatmoq"],["provide immediate feedback","darhol fikr- mulohaza bildirmoq"],["correct their errors","xatolarini to‘g‘rilamoq"],["promptly","tezda"],["speaking practice","gapirish amaliyoti"],["numerous distractions","ko‘plab chalg‘ituvchi omillar"],["stay focused","diqqatni jamlab turmoq"],["lose concentration","diqqatni yo‘qotmoq"],["flexible and accessible","moslashuvchan va qulay"]]},{"title":"Postponed Photography Course","topic":"Too Much Screen Time","sit":"You received an email from an online photography school.\n\nDear Student,\nWe are sorry to inform you that your online photography course has been postponed because the professor is currently unavailable. We apologise for the inconvenience. You can choose one of the following options:\n• receive a full refund\n• move your course to next month\n• receive recorded video lessons instead\nWhich option would you choose? Why do you prefer this option? What should the school do to help students during this situation?\nBest wishes,\nThe Course Administrator","t11":"Write about 50 words Write a short email to your friend who also planned to join this course. • Tell them about the postponed course. • Ask which option they would choose. • Ask how they feel about this situation.","s11":"Hi Timur,\nThanks for your message. Just got an email from the photography school, and I'm a bit sad. Our course has been postponed because the professor isn't available. We can get a refund, move to next month or get recorded lessons. I would like to get recorded lessons for self-study. How do you feel about it?\nSee you soon, Abror\n(61 words)","t12":"Write 120–150 words Write an email to the course administrator. • Explain which option you prefer. • Give reasons for your choice. • Suggest what the school should do for students.","s12":"Dear Sir or Madam,\nI am writing in response to your email regarding the postponement of the online photography course.\nOf the three options, I would prefer to move my course to next month. This is because I would like to study with the professor in live lessons. In other words, I want to ask questions and get feedback on my photos, which is not possible with recorded videos.\nAdmittedly, waiting another month is not ideal. However, I believe live lessons are worth the wait.\nIn my opinion, the school should keep students motivated during this period. For example, you could send us short photography tasks or organize a free online meeting with another teacher. It would also be helpful if you could inform us about the exact start date as soon as possible.\nI would appreciate your prompt assistance.\nYours faithfully, Abror Rahmatullayev\n(144 words)","q2":"Some people believe young people spend too much time on\nscreens. What problems does this cause, and how can it be\nsolved?\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK PROBLEMS","pro":["Sedentary lifestyle, poor posture and eye strain.","Blue light and late-night videos disrupt sleep.","Poor concentration and lower grades.","Harm to mental health and weaker social skills."],"ch":"SOLUTIONS","con":["Parents lead by example and put their phones away.","Screen-free zones: bedrooms and the dinner table.","Attractive alternatives: sports, hiking, robotics clubs.","Built-in phone tools that limit daily use. m. and falling asleep in class. s with hiking and camping."],"ex":["Teenagers watching short videos until 2 a.m. and falling asleep in class.","Youth clubs replacing screen-time activities with hiking and camping."],"s2":"Nowadays, a growing number of young people spend excessive time on screens. This trend may harm their health and academic performance, but parents and schools could tackle it together.\nRegarding the problems, excessive screen time could seriously damage young people's health. This is because sitting in front of screens for hours leads to a sedentary lifestyle, poor posture and eye strain. Moreover, blue light and late-night videos disrupt sleep patterns, since bright screens prevent the brain from relaxing. As a result, students struggle to concentrate and their grades may decline. For example, many teenagers watch short videos until 2 a.m. and fall asleep in class.\nHowever, this issue could be addressed in several ways. Firstly, parents could lead by example and establish screen-free zones, such as bedrooms. This is important because children tend to copy their parents' habits. Secondly, schools and youth clubs can offer appealing alternatives. For instance, some youth clubs have replaced screen- based activities with hiking and camping. This, in turn, would help young people become more active.\nIn conclusion, as excessive screen time harms young people's health, sleep and studies, it is a serious problem. Nevertheless, parental example and attractive offline activities could resolve it.\n(198 words)","wd":[["postponement","kechiktirilishi"],["Of the three options","uch variantdan"],["get feedback","fikr- mulohaza olmoq"],["worth the wait","kutishga arziydi"],["keep students motivated","o‘quvchilarni ruhlantirib turmoq"],["as soon as possible","imkon qadar tezroq"],["excessive time","haddan tashqari ko‘p vaqt"],["tackle it","uni hal qilmoq"],["a sedentary lifestyle","kam harakat turmush tarzi"],["poor posture","noto‘g‘ri qaddi-qomat"],["eye strain","ko‘z charchashi"],["disrupt sleep patterns","uyqu tartibini buzmoq"],["prevent the brain from relaxing","miyaning dam olishiga to‘sqinlik qilmoq"],["lead by example","o‘rnak bo‘lmoq"],["establish","yo‘lga qo‘ymoq"],["screen-free zones","ekransiz zonalar"],["copy their parents' habits","ota-onasining odatlarini takrorlamoq"],["appealing alternatives","jozibador muqobillar"],["screen-based activities","ekran bilan bog‘liq mashg‘ulotlar"]]},{"title":"Communication Skills Workshop","topic":"Buying More Than We Need","sit":"You received an email from the Human Resources Department of your company.\n\nDear Employee,\nWe are pleased to offer employees the opportunity to attend a two-day Communication Skills Workshop next month. The workshop will take place during working hours and will focus on improving teamwork, professional communication and problem-solving skills. As places are limited, please let us know if you would like to attend. We would also like to hear if you have any concerns about the workshop schedule or how it may affect your work responsibilities.\nBest wishes,\nThe Human Resources Department","t11":"Write about 50 words Write a short email to your colleague. • Tell them about the Communication Skills Workshop. • Ask how they feel about this opportunity. • Ask if they have any concerns about the schedule.","s11":"Hi Munisa,\nHope you're doing well. Just wanted to let you know that I received an email from HR. They're offering a two-day Communication Skills Workshop next month during working hours. I'm really excited about it because I can improve my soft skills. Do you have any concerns about the schedule?\nTake care, Abror\n(54 words)","t12":"Write 120–150 words Write an email to the Human Resources Department. • Describe your opinion about the workshop. • Explain possible problems the schedule may cause. • Suggest ways to make the workshop more useful for employees.","s12":"Dear Sir or Madam,\nI am writing in response to your email about the Communication Skills Workshop next month.\nI appreciate this opportunity because good communication and teamwork are important in our daily work. I would definitely like to attend, as I believe the workshop would help me solve problems more effectively.\nHowever, the schedule may cause some difficulties. Since the workshop will take place during working hours, many employees will not be able to finish their tasks on time. Moreover, if a whole department attends at once, nobody will be available to answer customers.\nTherefore, I would be grateful if you could divide employees into two groups that attend on different days. In other words, some staff could always stay at work. Including practical activities and role-plays would also make the workshop more useful.\nI look forward to your reply.\nYours faithfully, Abror Rahmatullayev\n(145 words)","q2":"Some people say that people today buy far more things than they\nreally need. What problems does this cause, and how can it be\nsolved?\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK PROBLEMS","pro":["Waste and pollution: production uses huge amounts of energy and water.","Fast fashion: clothes worn a few times, then thrown away.","Impulse buying and instalment plans lead to debt.","Short-lived happiness and homes full of clutter."],"ch":"SOLUTIONS","con":["Think twice before buying; make a shopping list and a budget.","Buy second-hand, repair and share items.","Companies should make durable products.","Governments can restrict misleading advertising; schools teach money skills. very easy to buy things we cannot afford. r price tags on."],"ex":["Online shops and instalment plans make it very easy to buy things we cannot afford.","Wardrobes full of clothes that still have their price tags on."],"s2":"In recent years, purchasing far more than necessary has become a common habit. This may cause environmental and financial problems, but mindful consumption and government regulation could be effective in tackling the issue.\nRegarding the problems, overconsumption could be a major culprit of environmental degradation. Manufacturing clothes and electronics requires vast amounts of energy and water, and many items are discarded after a few uses, which leads to overflowing landfills. Another significant problem is that impulse buying may cause financial difficulties. For example, in Uzbekistan, instalment plans make it easy to buy goods people cannot afford, leading to household debt.\nHowever, this issue could be addressed in several ways. Firstly, individuals could think twice before purchasing by making a shopping list and a budget. As a result, they stand a better chance of saving money and staying out of debt. Secondly, governments can step in by restricting misleading advertising. For instance, they could ban adverts that promise happiness through shopping. This, in turn, would reduce impulse buying.\nIn conclusion, as overconsumption harms the environment and pushes many families into debt, it is a serious challenge. Nevertheless, careful planning and stricter control over advertising could solve this problem.\n(197 words)","wd":[["solve problems more effectively","muammolarni samaraliroq hal qilmoq"],["cause some difficulties","ba’zi qiyinchiliklarga sabab bo‘lmoq"],["take place","bo‘lib o‘tmoq"],["role-plays","rolli o‘yinlar"],["mindful consumption","ongli iste’mol"],["government regulation","davlat tomonidan tartibga solish"],["overconsumption","ortiqcha iste’mol"],["a major culprit of","... ning asosiy aybdori"],["environmental degradation","atrof- muhitning yomonlashuvi"],["discarded","tashlab yuborilgan"],["overflowing landfills","to‘lib-toshgan chiqindixonalar"],["impulse buying","o‘ylamasdan xarid qilish"],["instalment plans","muddatli to‘lov rejalari"],["household debt","oilaviy qarz"],["think twice","ikki marta o‘ylamoq"],["stand a better chance","imkoniyati yuqoriroq bo‘lmoq"],["step in","aralashmoq, chora ko‘rmoq"],["restricting","cheklash"],["misleading advertising","chalg‘ituvchi reklama"],["stricter control","qattiqroq nazorat"]]},{"title":"University Festival Volunteers","topic":"Teaching Money Skills at School","sit":"You received an email from your university student union.\n\nDear Student,\nWe are looking for volunteers to help at this year’s Annual University Festival. Volunteers can assist with organising activities, helping performers behind the stage, serving food and drinks, and welcoming visitors. This is a great opportunity to gain experience and meet new people. How do you feel about this opportunity? What volunteer role would you like to do? Why do you think you are suitable for this role?\nBest wishes,\nThe Student Union","t11":"Write about 50 words Write a short email to your friend. • Tell them about the volunteer opportunity. • Explain how you feel about it. • Ask if they would like to volunteer at the festival.","s11":"Hi Farrukh,\nIt was great to hear from you. Guess what? I received an email from the student union about volunteering roles, and I'm really excited! They're looking for volunteers for the University Festival. I think it's a great chance to gain experience and meet new people. Would you like to volunteer with me?\nAll the best, Abror\n(58 words)","t12":"Write 120–150 words Write an email to the student union. • Describe your feelings about the festival. • Say whether you would like to help behind the stage or serve food and drinks. • Explain why you would be suitable for this role.","s12":"Dear Sir or Madam,\nI am writing in response to your email about volunteering at this year's Annual University Festival.\nI am extremely happy about this opportunity because the festival is one of the most exciting events at our university. Every year it brings students together, and I would be glad to be part of the team that organizes it.\nAs for the role, I would like to help behind the stage rather than serve food and drinks. I am interested in performing arts, and I would love to see how a big show is prepared.\nI believe I would be suitable for this role, as I am organized and work well under pressure. Moreover, I have helped with several school concerts, so I already know how to prepare performers and equipment on time.\nI look forward to your reply.\nYours faithfully, Abror Rahmatullayev\n(144 words)","q2":"Children should be taught to manage money at school. Do you\nagree?\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK ARGUMENTS FOR","pro":["Helps young people avoid debt and loans.","Teaches budgeting and saving from an early age.","Equal chance for children from all families.","Prepares pupils for independent adult life."],"ch":"ARGUMENTS AGAINST","con":["Parents should teach money skills at home.","The timetable is already full.","Teachers may not be trained in finance.","Children may be too young to understand it. n instalments and fall into debt. secondary school curriculum."],"ex":["Young adults buy expensive smartphones in instalments and fall into debt.","The UK includes financial education in the secondary school curriculum."],"s2":"There is a growing view that children should be taught how to manage money at school. I completely agree with this idea, as financial literacy protects young people from debt and prepares them for independent life.\nThe first reason why financial education is essential is that it helps young people avoid debt. This is because children who learn about budgeting, saving and interest rates early understand the real cost of borrowing. As a result, they are less likely to make reckless purchases or take out loans they cannot repay. For example, many young adults in Uzbekistan fall into debt by buying expensive smartphones in instalments.\nWhile I acknowledge that parents can also teach their children about money, not all families have the necessary knowledge or time. Since schools reach every child regardless of background, they can ensure equal access to essential financial skills. Consequently, pupils from all social groups grow up able to plan their finances responsibly. For instance, the United Kingdom has already included financial education in the secondary school curriculum.\nIn conclusion, I believe children should be taught to manage money at school, as it prevents debt and prepares all pupils for adult life.\n(196 words)","wd":[["brings students together","talabalarni birlashtiradi"],["behind the stage","sahna ortida"],["performing arts","sahna san’ati"],["suitable for this role","bu rolga mos"],["work well under pressure","bosim ostida yaxshi ishlamoq"],["There is a growing view","tobora keng tarqalayotgan fikr bor"],["financial literacy","moliyaviy savodxonlik"],["independent life","mustaqil hayot"],["financial education","moliyaviy ta’lim"],["budgeting","byudjet rejalashtirish"],["interest rates","foiz stavkalari"],["the real cost of borrowing","qarz olishning haqiqiy narxi"],["reckless purchases","o‘ylamay qilingan xaridlar"],["loans they cannot repay","qaytara olmaydigan qarzlar"],["fall into debt","qarzga botmoq"],["in instalments","bo‘lib to‘lash orqali"],["regardless of background","kelib chiqishidan qat’i nazar"],["essential financial skills","muhim moliyaviy ko‘nikmalar"],["social groups","ijtimoiy guruhlar"],["plan their finances responsibly","moliyasini mas’uliyat bilan rejalashtirmoq"],["the secondary school curriculum","o‘rta maktab o‘quv dasturi"]]},{"title":"Remote Working Policy","topic":"School Uniforms","sit":"You received this message from your company manager.\n\nDear Employee,\nFrom next week, staff members may work remotely two days per week. Employees who choose remote work must attend online meetings regularly, complete weekly progress reports, and remain available during office hours. Please tell us whether you are interested in remote working and any support you may need.\nKind regards,\nCompany Manager","t11":"Write about 50 words Write a short letter to your friend who also works for this company. Tell him/her the news and what your reaction is.","s11":"Hi Nodira,\nHope you're doing well. I just received a message from our manager about changes in our company, and I'm so happy! From next week, we can work from home two days a week. We'll just need to attend online meetings and write weekly reports. I think it's a great idea. What do you think?\nSee you soon, Abror\n(60 words)","t12":"Write 120–150 words Write a letter to the manager. Write about your opinion of the change and how you feel about it.","s12":"Dear Sir or Madam,\nI am writing in response to your message about the new remote working policy.\nI am extremely happy about this change, and I would definitely like to work remotely two days per week. Since I live far from the office, I spend almost two hours travelling every day. In other words, working from home would save me a lot of time and energy.\nAdmittedly, remote work also has some difficulties. For example, it may be harder to communicate with colleagues quickly. However, I believe regular online meetings and weekly reports will solve this problem.\nAs for support, I would be grateful if you could provide a laptop and a stable internet connection. This would allow me to remain available during office hours without any technical problems.\nI look forward to your reply.\nYours faithfully, Abror Rahmatullayev\n(140 words)","q2":"Should school students wear uniforms?\nYou are participating in an online discussion for language learners. Post your response, giving\nreasons and examples. Write 180–200 words.","ph":"IDEA BANK ARGUMENTS FOR","pro":["Create equality: rich and poor pupils look the same, so there is less bullying about clothes.","Save families time in the morning and money on fashionable clothes.","Build school identity and discipline; pupils feel part of one team.","Pupils are easy to recognise on trips, which is safer."],"ch":"ARGUMENTS AGAINST","con":["Limit self-expression and individuality.","Can be expensive, especially for families with several children.","May be uncomfortable in very hot or cold weather.","Do not remove all differences — phones and shoes still show wealth. niform, so pupils are easy to spot on school form, and students choose their own clothes."],"ex":["Most state schools in Uzbekistan have a uniform, so pupils are easy to spot on school trips.","Many state schools in the USA have no uniform, and students choose their own clothes."],"s2":"There has been much debate as to whether school students should wear uniforms. I firmly believe that uniforms are beneficial, as they foster a sense of equality and instil discipline among pupils.\nOne of the primary reasons why uniforms are of necessity is that they eliminate visible social differences. With everyone dressed identically, the gap between affluent and underprivileged families becomes invisible, so pupils cannot judge each other by brands. Consequently, students are far less likely to be bullied or excluded because of their appearance. For example, children from low- income families feel more confident when they look the same as their wealthier peers.\nWhile I acknowledge that uniforms may restrict self-expression, they play a pivotal role in building discipline and safety. This is because wearing the same attire gives pupils a sense of belonging to one community, which encourages them to comply with school rules. As a result, students behave more responsibly and are easily identifiable outside school. For example, most state schools in Uzbekistan have a uniform, enabling teachers to spot their pupils on school trips.\nIn conclusion, I believe school students should wear uniforms, since they reduce social inequality and create a disciplined and secure learning environment.\n(199 words)","wd":[["remote working policy","masofaviy ishlash siyosati"],["weekly reports","haftalik hisobotlar"],["a stable internet connection","barqaror internet aloqasi"],["remain available","aloqada bo‘lib turmoq"],["much debate","ko‘p bahs- munozara"],["foster a sense of equality","tenglik hissini shakllantirmoq"],["instil discipline","intizomni singdirmoq"],["of necessity","zarur, muhim"],["eliminate visible social differences","ko‘zga tashlanuvchi ijtimoiy farqlarni yo‘q qilmoq"],["dressed identically","bir xil kiyingan"],["affluent and underprivileged families","badavlat va kam ta’minlangan oilalar"],["excluded","chetlatilgan"],["restrict self-expression","o‘zini ifoda etishni cheklamoq"],["play a pivotal role","hal qiluvchi rol o‘ynamoq"],["attire","kiyim-kechak"],["a sense of belonging","mansublik hissi"],["comply with school rules","maktab qoidalariga rioya qilmoq"],["easily identifiable","osongina aniqlanadigan"],["enabling","imkon berib"],["social inequality","ijtimoiy tengsizlik"]]},{"title":"City Bus Service Changes","topic":"Will Robots Take Our Jobs?","sit":"You use the city bus service every day. You received a message from the transport company.\n\nDear Passenger,\nBecause of rising fuel costs, we are planning to stop the last evening buses on several routes and to increase ticket prices by 10% from next month. We are also thinking of introducing a mobile card instead of paper tickets. How would these changes affect your daily journey? What difficulties might passengers face? What could we do to keep the service comfortable for everyone?\nBest wishes,\nThe Transport Company","t11":"Write about 50 words Write a short email to your friend who travels on the same route. • Tell them abou
