ou spend too much time online?","a":"Honestly, yes, probably. I need the internet for studying and for messaging my friends, so a large part of it is useful, but I also lose time scrolling without any real purpose. I have started checking my screen time, and the number is usually higher than I expect. Now I try to leave my phone in another room while I am working, and that helps a lot."},{"q":"Do you prefer to spend weekends at home or outside?","a":"It depends on the week I have had. If the week has been busy and stressful, I much prefer staying at home, catching up on sleep and doing small things around the flat. When I have more energy, though, I would rather be outside, either walking somewhere green or meeting friends in the centre. Ideally I try to do a bit of both, one quiet day and one active day."},{"q":"Who is your favourite actor or actress?","a":"My favourite actor is Leonardo DiCaprio. What I admire about him is that he chooses very different roles, so you never see him playing the same character twice. He also worked for years before he finally won an Oscar, which shows a lot of patience. Outside films, he is well known for supporting environmental projects, and I respect that he uses his fame for something useful."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different means of transport that people use every day. In the first picture, there is a man driving a car with passengers sitting behind him. He is holding the steering wheel with both hands and smiling, which suggests that the journey is relaxed and comfortable. It seems that he values the freedom and the privacy that a private vehicle offers. In contrast, the second picture shows a group of passengers travelling on a public bus. Some of them are sitting while others are standing and holding onto the yellow handrails, and the bus appears to be quite crowded."},{"q":"What are the advantages of taking a bus instead of a taxi?","a":"The most obvious advantage is the price, because a bus ticket costs only a fraction of a taxi fare. Buses are also much better for the environment, since one bus can replace thirty or forty cars on the road. In big cities they often use special lanes, so during rush hour they can actually be faster. For me there is one more advantage: on a bus I can read or listen to music instead of concentrating on the traffic."},{"q":"Do you prefer to travel by bus or by taxi?","a":"It really depends on the situation. For everyday journeys, like going to college, I definitely prefer the bus, because it is cheap and it comes every ten minutes. However, if I am carrying heavy bags, if it is late at night, or if I am in a real hurry, I take a taxi without hesitating. So I would say the bus is my normal choice and a taxi is my emergency option."}],"p2":{"prompts":["Describe a time in your life when you experienced a significant change.","How has this change affected your personal growth or outlook on life?","Why do you think people sometimes struggle with change?"],"a":"The biggest change in my life happened when I moved to a different city to go to university. I had spent my whole life in a small town where I knew every street and almost every neighbour, so moving to a large, noisy city was both exciting and frightening. Suddenly I was living in a shared flat with people I had never met, cooking for myself, paying my own bills and finding my way around a public transport system I did not understand. The first two months were genuinely difficult and I felt homesick almost every evening, but by the end of the first term I had made friends and the city had started to feel like home. That experience changed me a lot. I became far more independent and much better at solving problems on my own, because there was nobody there to do things for me. I also became more open, since I had to talk to strangers all the time. Now, when something new comes along, I feel curious rather than afraid, and I know from experience that the difficult period does not last forever. As for why people struggle with change, I think the main reason is that human beings like certainty. When we know what tomorrow looks like, we feel safe, and change removes that feeling. There is also a fear of failure, because in a new situation you might not be good at things you were confident about before. And of course change usually means losing something familiar, so even a positive change comes with a kind of sadness that people do not always expect."},"p3":{"topic":"Sports teams should pay players based on performance","for":["money is a powerful motivator and pushes players to train harder","it feels fairer than paying huge salaries to players who sit on the bench","it rewards hard work and skill rather than reputation"],"against":["it creates enormous pressure and increases the risk of injury","a striker has far more chances to score than a defender or a goalkeeper","it damages teamwork, because players may act for their own statistics"],"a":"This is an interesting question, because it is about fairness and motivation at the same time. Supporters of performance-based pay make a practical argument: money is a powerful motivator. If a player knows that scoring goals or playing well directly increases his salary, he is likely to train harder and give everything in every match, which raises the level of the whole team. It also feels fairer to many fans, because at the moment some players earn enormous salaries while sitting on the bench for an entire season. In addition, this system rewards hard work and skill rather than reputation, so it can inspire young athletes who are just starting their careers. The arguments against are equally serious, though. This kind of system creates enormous pressure, and athletes who are already stressed may push themselves too far and get injured. There is also a problem of inequality inside the team, because a striker has many more chances to score than a defender or a goalkeeper, even if the defender plays brilliantly. Perhaps the biggest danger is that it damages teamwork. If a player's income depends on his personal statistics, he may choose to shoot himself instead of passing to a teammate in a better position, and football is a team game. In my opinion, a mixed system works best. Players should receive a solid basic salary, with bonuses linked mainly to team results, such as winning the league, rather than to individual numbers."},"wd":[["scroll","to move text or images up and down on a screen","v.","1.1"],["purpose","the reason for doing something","n.","1.1"],["screen time","the time spent looking at a phone or computer","n.","1.1"],["stressful","causing worry and pressure","adj.","1.1"],["catch up on","to do something you did not have time for earlier","phr. v.","1.1"],["ideally","in the best situation you can imagine","adv.","1.1"],["admire","to respect and like someone very much","v.","1.1"],["character","a person in a book or film","n.","1.1"],["patience","the ability to wait calmly without complaining","n.","1.1"],["project","a piece of planned work with a clear goal","n.","1.1"],["respect","a feeling that somebody is important and good / 30 seconds · no preparation","n.","1.1"],["means of transport","a way of travelling from place to place","phrase","1.2"],["passenger","a person travelling in a vehicle","n.","1.2"],["steering wheel","the wheel a driver turns to guide a car","n.","1.2"],["journey","an act of travelling from one place to another","n.","1.2"],["freedom","the right to do what you want","n.","1.2"],["privacy","the right to keep your life to yourself","n.","1.2"],["handrail","a bar you hold onto for support","n.","1.2"],["crowded","full of people","adj.","1.2"],["obvious","easy to see or understand","adj.","1.2"],["advantage","a good feature of something lane (n.) a narrow road, or one part of a wide road","n.","1.2"],["concentrate","to give your full attention to one thing","v.","1.2"],["depend","to be affected or decided by something else","v.","1.2"],["situation","the things that are happening at a certain time","n.","1.2"],["choice","the act of deciding between two or more things","n.","1.2"],["option","one of the things you can choose","n.","1.2"],["university","a place where people study after school noisy (adj.) making a lot of noise","n.","2"],["suddenly","quickly and without warning bill (n.) a paper showing how much you must pay","adv.","2"],["public transport","buses and trains used by everyone","n.","2"],["genuinely","really; truly","adv.","2"],["experience","something that happens to you and teaches you","n.","2"],["independent","not needing help from other people","adj.","2"],["reason","why something happens or is done","n.","2"],["confident","sure that you can do something well","adj.","2"],["rmance","us pressure and of injury more chances to score r a goalkeeper work, because players own statistics","","3"],["fairness","treating everyone in an equal, right way","n.","3"],["motivation","the reason that makes you want to do something","n.","3"],["practical","useful and sensible in real life","adj.","3"],["argument","a reason given to support an opinion","n.","3"],["in addition","also; as well as that","phrase","3"],["inspire","to make someone want to do something good","v.","3"],["equally","in the same way for everyone","adv.","3"],["stressed","worried and unable to relax","adj.","3"],["inequality","an unfair difference between groups of people","n.","3"],["teamwork","working together as a group","n.","3"],["in my opinion","used to give your personal view","phrase","3"],["individual","one single person","n.","3"]]},{"p11":[{"q":"Do you prefer to buy books or to borrow them?","a":"I usually borrow them, to be honest. My university library has almost everything I need, and it costs nothing, which matters when you are a student. The one exception is a book I know I will read again or make notes in — then I would rather own it and keep it on my shelf. Borrowing also stops my room from filling up with books I only read once."},{"q":"Do you go to bed early or late?","a":"I usually go to bed quite late, especially on weekdays, which is a habit I would like to change. I often start studying in the evening and then suddenly it is midnight. At the weekend I try to sleep earlier to catch up, but that does not always work. I know it is not healthy, so recently I have started leaving my phone in the kitchen at night."},{"q":"Do you use a computer more for study or for entertainment?","a":"Definitely for study, at least during term time. Most of my assignments have to be typed, and I do nearly all my reading and research on screen. In the evening it becomes an entertainment device instead — I watch films or listen to music on it. So the same machine changes its role completely depending on the time of day."}],"p12":[{"q":"What can you see in these pictures?","a":"In these pictures, I can see two different ways of celebrating a special occasion. In the first picture, there is a group of young people celebrating a birthday at home. They are wearing colourful party hats, and a cake with lit candles is standing on the table in front of them. Everyone appears to be smiling and enjoying the moment together in a cheerful atmosphere. In contrast, the second picture shows a group of friends having dinner in a restaurant. They are sitting around a long table decorated with warm lights, and the waiters have already served several dishes. It seems to be a more formal celebration."},{"q":"When was the last time you gathered with family?","a":"The last big family gathering was a couple of weeks ago, at my cousin's wedding. Almost forty relatives came, including people I only see once or twice a year, so it was a very noisy and happy day. We ate a lot, danced and took hundreds of photographs. Apart from that, I have dinner with my parents and my brother almost every evening, so smaller gatherings happen all the time."},{"q":"What are the advantages of celebrating with family over with friends?","a":"The main advantage is that family celebrations feel much closer and more meaningful. Your relatives have known you your whole life, so they understand what an occasion really means to you. These events also connect the generations, because children, parents and grandparents are all in the same room. They are usually cheaper too, since everybody cooks something and brings it. With friends it is fun, but it rarely has the same emotional value."}],"p2":{"prompts":["Tell me about a time when you noticed or experienced inequality.","How did this situation affect your understanding of fairness and justice?","Why is promoting equality important for creating a harmonious society?"],"a":"I noticed inequality very clearly when I volunteered at a community centre in my city, helping children with their homework after school. What struck me was the gap between the children who came from wealthier families and those who did not. Some of them arrived with laptops, their own books and private tutors already helping them at home. Others were sharing one old textbook between three people, and a few had no quiet place to study at all. What upset me most was not the difference in equipment but the difference in confidence. The children with fewer resources had already decided that they were simply not clever, when in reality they had never been given the same chance. That situation changed my understanding of fairness quite a lot. Before, I thought fairness meant treating everybody in exactly the same way. Now I think real fairness sometimes means giving more support to the people who started with less, because equal treatment of unequal situations just keeps the gap where it is. It also made me much more careful about judging people's results without knowing their circumstances. I believe promoting equality is essential for a peaceful society. When large groups feel that the system will never work for them, they stop believing in it, and that produces frustration, conflict and, eventually, instability. There is also a very practical reason: when talented people are held back because of where they were born or how much money their family had, the whole country loses their potential contribution."},"p3":{"topic":"Libraries are becoming outdated","for":["digital resources are far more accessible, at any hour and without leaving home","far fewer people physically visit libraries than twenty years ago","libraries are expensive to run, needing a building, staff and new books"],"against":["they offer community services no website can replace, including free internet access","they hold rare and historical materials that have never been digitised","they provide a quiet, free public space where anyone can sit and study"],"a":"This is a question I have thought about quite a lot, and my answer changed once I looked at what modern libraries actually do. The arguments that libraries are outdated are not unreasonable. Digital resources are far more accessible: with an internet connection you can find an article, an encyclopaedia entry or an entire book in seconds, at any hour, without leaving home. It is also true that fewer people physically visit libraries than twenty years ago, especially young people who do all their research online. And libraries are expensive to run, because they need a building, heating, staff and a constantly updated collection, which is a heavy cost for a city budget. However, the arguments on the other side are stronger than people expect. Libraries offer community services that no website can replace: free courses, reading clubs for children, help with official documents and, crucially, free internet access for people who do not have it at home. They also hold rare and historical materials that have never been digitised and probably never will be. And there is one very simple function that has become more valuable, not less: a library is a quiet, free public space where anyone can sit and study, which is something students living in small, noisy flats desperately need. So in my opinion libraries are not becoming outdated; they are changing their purpose. The successful ones today are community centres that happen to contain books."},"wd":[["borrow","to take something and give it back later","v.","1.1"],["exception","a case that a rule does not apply to","n.","1.1"],["shelf","a flat board for keeping things on","n.","1.1"],["especially","more than usual; particularly","adv.","1.1"],["weekday","any day from Monday to Friday","n.","1.1"],["habit","something you do regularly, often without thinking","n.","1.1"],["suddenly","quickly and without warning catch up (phr. v.) to talk to somebody about recent news","adv.","1.1"],["assignment","a piece of work given to a student","n.","1.1"],["research","careful study to find new information","n.","1.1"],["device","a piece of equipment made for a purpose depend on (phr. v.) to be decided by something else / 30 seconds · no preparation","n.","1.1"],["celebrate","to do something enjoyable for a special occasion","v.","1.2"],["occasion","a special event or time","n.","1.2"],["party hat","a paper hat worn at a celebration","n.","1.2"],["candle","a stick of wax that burns to give light","n.","1.2"],["cheerful","happy and full of positive feeling","adj.","1.2"],["atmosphere","the general feeling of a place","n.","1.2"],["serve","to bring food or drink to somebody formal (adj.) official or serious in style","v.","1.2"],["gather","to come together in a group","v.","1.2"],["wedding","the ceremony when two people get married","n.","1.2"],["relative","a member of your family noisy (adj.) making a lot of noise","n.","1.2"],["photograph","a picture taken with a camera","n.","1.2"],["advantage","a good feature of something","n.","1.2"],["celebration","a special event to mark something happy","n.","1.2"],["meaningful","important and worth remembering","adj.","1.2"],["generation","all the people born at about the same time","n.","1.2"],["inequality","an unfair difference between groups of people","n.","2"],["community","the people who live in one area","n.","2"],["homework","school work that students do at home","n.","2"],["difference","the way in which things are not the same","n.","2"],["confidence","the feeling that you can do something well","n.","2"],["resource","something useful that can be used","n.","2"],["situation","the things that are happening at a certain time","n.","2"],["fairness","treating everyone in an equal, right way","n.","2"],["equality","the state of being equal in rights","n.","2"],["essential","completely necessary","adj.","2"],["peaceful","quiet and free from noise or trouble","adj.","2"],["practical","useful and sensible in real life","adj.","2"],["argument","a reason given to support an opinion","n.","3"],["outdated","no longer modern or useful","adj.","3"],["digital","using computer technology","adj.","3"],["accessible","easy to reach, enter or use","adj.","3"],["physically","with the body","adv.","3"],["expensive","costing a lot of money","adj.","3"],["website","a place on the internet with pages of information","n.","3"],["document","a paper with official information on it","n.","3"],["historical","connected with the past","adj.","3"],["valuable","very useful or worth a lot","adj.","3"],["in my opinion","used to give your personal view","phrase","3"]]},{"p11":[{"q":"What kinds of books do you like to read?","a":"I mostly read novels, especially psychological thrillers and historical fiction. I like thrillers because the story keeps you guessing until the last page, and I enjoy historical novels because you learn something real while you are being entertained. Occasionally I read non-fiction about psychology or science, but I need to be in the right mood for that. I usually have one book by my bed and an audiobook on my phone."},{"q":"Are your weekends now different from when you were a child?","a":"Yes, completely. As a child my weekends were organised by my parents — we visited relatives, went to the market together and I played outside with the neighbours all afternoon. Now I organise them myself, and a large part of the time goes on catching up with work I did not finish during the week. I have more freedom, but honestly rather less free time."},{"q":"What colours do you like?","a":"I am mostly attracted to natural, earthy colours like olive green, brown and terracotta. I think they look calm and they suit almost any season, so most of my clothes are in those shades. I also like white for a room, because it makes a small space feel bigger. I avoid very bright colours like neon pink or orange, although I admire people who can wear them confidently."}],"p12":[{"q":"Describe these pictures.","a":"In these pictures, I can see two different ways of spending an evening. In the first picture, there is a man sitting on a sofa with his back to the camera and watching television. The room seems quite dark, and he appears to be completely absorbed in the programme on the screen. It seems that he has chosen a passive form of entertainment in order to relax. In contrast, the second picture shows a young woman reading a book outdoors. She is leaning against a tree in a park, and warm sunlight is falling through the leaves behind her. It seems that she prefers a quieter and more imaginative activity."},{"q":"What are the advantages of reading books over watching TV?","a":"Reading is much more active than watching television, because your brain has to create the pictures itself, and that develops imagination. It also improves your vocabulary and your concentration, especially with a long novel. Books give far more detail about what characters think and feel, so the story is deeper. And practically speaking, you can stop and start a book whenever you like, and read it anywhere without electricity or internet."},{"q":"When was the last time you watched TV with friends?","a":"It was last weekend, actually. Three of us went to my friend's flat, made popcorn and watched a football match together. Watching with other people is completely different from watching alone, because everybody shouts at the screen and argues about the referee. Afterwards we stayed and talked for another hour. We do this fairly regularly, maybe once or twice a month when there is a big game."}],"p2":{"prompts":["Share an experience where trust played a key role in your relationship with someone.","How did this experience influence your perspective on building and maintaining trust?","What factors contribute to establishing trust between people or groups in society?"],"a":"Trust played a very important role in a group project I did at university. There were five of us, and honestly, at the beginning I was worried, because we barely knew each other and everybody had different ideas about how to start. One girl in the group, Nilufar, suggested something simple but clever: before we discussed the project at all, we should sit down together and each explain what we were good at and what we were afraid of. It felt strange at first, but it changed everything. Once we knew each other's strengths, we divided the work honestly, and nobody had to check what the others were doing. When one member had a family emergency, the rest of us covered his part without complaining, because we trusted that he would have done the same for us. That experience really changed how I think about trust. I used to believe trust was something that appeared slowly, almost by accident, after years of knowing someone. Now I think you can build it deliberately and quite quickly, by being open about your limits and by keeping small promises. I also learned that trust is not about being perfect; it is about being predictable and honest when things go wrong. In society more widely, I think trust depends on a few key factors. The most important one is consistency: institutions and people have to behave the same way over time. Transparency matters too, because secrecy always creates suspicion. And finally there needs to be accountability, so that when someone breaks the rules, there are real and visible consequences."},"p3":{"topic":"AI should be used to make hiring decisions","for":["a well-designed system can reduce human bias about name, age or appearance","software can filter thousands of applications in minutes and save money","it can process far more data and notice which candidates actually succeed"],"against":["these systems learn from historical data and simply repeat old bias faster","soft skills such as creativity and empathy are very hard to measure automatically","being rejected by a machine with no explanation feels cold and unfair"],"a":"This is a very modern question, and I think the honest answer is somewhere between the two extremes. The arguments in favour are quite practical. First, a well-designed system can reduce human bias, because it does not care about a candidate's name, age or appearance in the way that a tired interviewer might. Second, speed is a huge factor. A large company can receive thousands of applications for one position, and software can filter them in minutes, which saves an enormous amount of time and money. Third, artificial intelligence can process far more data than a person, so it can notice patterns about which candidates actually succeed in a particular role. The objections, however, are serious. The biggest problem is that these systems learn from historical data, so if a company hired mainly one type of person in the past, the software will simply repeat that bias, but faster and on a bigger scale. Another difficulty is that soft skills such as creativity, empathy and cultural fit are extremely hard to measure automatically, and those qualities often matter more than a perfect CV. There is also a human concern: being rejected by a machine, with no explanation and no conversation, feels cold and unfair to most candidates. My own view is that artificial intelligence should assist rather than decide. Using it to organise applications is sensible, but the final decision, and especially the interview, should always be made by a human being."},"wd":[["novel","a long written story about invented people","n.","1.1"],["especially","more than usual; particularly","adv.","1.1"],["historical","connected with the past","adj.","1.1"],["entertain","to interest and amuse someone","v.","1.1"],["occasionally","sometimes, but not often","adv.","1.1"],["organise","to arrange or plan something carefully","v.","1.1"],["relative","a member of your family","n.","1.1"],["neighbour","a person who lives next to you","n.","1.1"],["freedom","the right to do what you want","n.","1.1"],["attract","to make someone interested in something","v.","1.1"],["natural","normal and not forced bright (adj.) full of light","adj.","1.1"],["admire","to respect and like someone very much / 30 seconds · no preparation sofa (n.) a long, soft seat for two or more people","v.","1.1"],["absorbed","giving something all your attention","adj.","1.2"],["passive","not taking an active part in something","adj.","1.2"],["entertainment","films, games and other things that amuse people lean (v.) to rest against something for support","n.","1.2"],["sunlight","the light that comes from the sun","n.","1.2"],["imaginative","using or showing new and original ideas","adj.","1.2"],["imagination","the ability to form new ideas in your mind","n.","1.2"],["vocabulary","the words a person knows or uses","n.","1.2"],["concentration","the ability to give full attention to something","n.","1.2"],["character","a person in a book or film","n.","1.2"],["popcorn","corn that is heated until it bursts open","n.","1.2"],["completely","totally; in every way","adv.","1.2"],["screen","the flat part of a device that shows text or pictures","n.","1.2"],["argue","to give reasons for your opinion; to disagree","v.","1.2"],["afterwards","after something has happened","adv.","1.2"],["trust","the belief that somebody is honest and reliable","n.","2"],["project","a piece of planned work with a clear goal","n.","2"],["university","a place where people study after school","n.","2"],["explain","to make something clear to somebody","v.","2"],["divide","to separate into parts","v.","2"],["experience","something that happens to you and teaches you honest (adj.) telling the truth","n.","2"],["society","people living together in an organised way","n.","2"],["depend","to be affected or decided by something else","v.","2"],["factor","one of the things that affects a result","n.","2"],["institution","a large organisation such as a school or bank","n.","2"],["visible","able to be seen","adj.","2"],["s","rn from historical epeat old bias faster creativity and hard to measure a machine with no cold and unfair","","3"],["argument","a reason given to support an opinion","n.","3"],["practical","useful and sensible in real life","adj.","3"],["company","a business that sells goods or services","n.","3"],["software","the programs used by a computer","n.","3"],["artificial intelligence","computer systems that can think like people","n.","3"],["succeed","to achieve what you were trying to do","v.","3"],["particular","one specific thing rather than others","adj.","3"],["difficulty","a problem or something hard to do","n.","3"],["creativity","the ability to produce original ideas","n.","3"],["extremely","to a very great degree","adv.","3"],["quality","how good or bad something is","n.","3"]]},{"p11":[{"q":"What is the best book you've ever read?","a":"The best book I have ever read is To Kill a Mockingbird by Harper Lee. It is told through the eyes of a young girl, so the language is simple, but the subject is serious: justice, prejudice and doing the right thing when everybody around you disagrees. What I liked most was the character of her father, who stays calm and honest under enormous pressure. I read it at school and I have re-read it twice since then."},{"q":"Would you want to be an actor in the future?","a":"Acting sounds exciting, but I do not think it would suit me at all. I am quite a private person, and the idea of being recognised in the street or having my life discussed online makes me uncomfortable. It also looks like a very unstable career, with long periods of waiting for work. I do enjoy watching films and analysing performances, though, so I would rather stay on the audience's side."},{"q":"Where do you usually buy your clothes?","a":"I usually buy my clothes online, because it is convenient and I can compare prices from several shops in a few minutes. I mostly order from two or three websites that I already know and trust, so the sizes are rarely a problem. For things like shoes or a winter coat, though, I always go to a real shop, because I want to try them on properly before spending that much money."}],"p12":[{"q":"What can you see in these pictures?","a":"In these pictures, I can see two different ways of spending time with the family. In the first picture, there are three people riding a roller coaster at a theme park. They are holding their hands in the air and laughing, and the red metal track of the ride can be seen behind them. It seems that they are looking for excitement and an unforgettable experience. In contrast, the second picture shows a father and his son sitting together on a wooden bench in a quiet park. They appear to be talking calmly, and the green trees around them create a peaceful setting."},{"q":"Do you think spending time with parents is important?","a":"Yes, I think it is extremely important, for both sides. Children learn most of their values from their parents, and they learn them through everyday conversations rather than through lectures. Spending real time together also builds trust, so that when a serious problem appears, the child actually feels able to talk about it. And for parents, it is often the best part of the day. Quality matters more than quantity, though."},{"q":"Will you prefer spending time in the park or in the nature?","a":"I would choose real nature if I had the choice, because being far from traffic and buildings feels like a complete break. The air is cleaner, it is genuinely quiet, and after a day in the mountains I always come back with more energy. However, a park is much more realistic during the week, since I can get there in ten minutes. So in practice I use the park often and escape to nature at the weekend."}],"p2":{"prompts":["Tell me about a time when you took on a significant responsibility.","How has this experience shaped your views on what it means to be responsible?","Why is taking responsibility important for individuals and society as a whole?"],"a":"The biggest responsibility I have taken on so far was leading a major team project at work last year. The project mattered a lot to the company and the deadline was very tight, which made it stressful from the first day. My job was to coordinate people from three different departments, keep track of the timeline and make sure that everybody stayed motivated. At the beginning I was genuinely anxious, because I had never managed anybody before. I quickly learned that the most important part was communication: I started sending a short summary every Friday so that nobody was confused about what to do next. We finished two days before the deadline, and although it was exhausting, I would do it again. That experience changed my understanding of responsibility completely. I used to think being responsible simply meant doing your own tasks well. Now I realise it also means accepting the consequences when something goes wrong, even if it was not directly your fault. Twice during that project I had to go to my manager and admit that we were behind schedule, and although it was uncomfortable, hiding the problem would have been far worse. On a wider level, I think responsibility is what holds society together. When individuals take responsibility for small things, like keeping their neighbourhood clean or doing their job properly, everything works more smoothly and people trust each other. When nobody does, everything has to be controlled by rules and punishments instead, and that is a much more unpleasant way to live."},"p3":{"topic":"Art classes should be mandatory in school","for":["art boosts creativity, which engineers, scientists and business people also need","it improves general academic performance by developing patience and concentration","it improves problem-solving, since every design means dozens of small decisions"],"against":["the school day is already full and art takes hours from examined subjects","some students genuinely dislike art, so forcing them creates stress","good art teaching needs materials, space and specialist teachers"],"a":"I find this an interesting debate, because art is often the first subject that gets removed when schools are short of time or money. The case in favour is quite convincing. The most obvious benefit is that art boosts creativity, and creativity is not only useful for artists; engineers, business people and scientists all need to think of original solutions. There is also evidence that art improves general academic performance, partly because it develops patience and concentration, and partly because it gives students a subject where they can succeed even if they struggle with mathematics. Art also improves problem-solving in a very direct way: every drawing or design forces the student to make dozens of small decisions and to see mistakes as part of the process. The counter-arguments are mainly practical. Time is the biggest one. The school day is already full, and adding compulsory art means taking hours away from subjects that universities and employers examine. Another point is interest: some students genuinely dislike art, and forcing them to attend can turn a pleasant activity into a source of stress. There is also the question of resources, since good art teaching needs materials, space and specialist teachers, which many schools simply cannot afford. In my opinion, art should be compulsory in primary school, where creativity develops most, and then optional in the final years so that older students can concentrate on their chosen direction."},"wd":[["subject","an area of knowledge studied at school","n.","1.1"],["character","a person in a book or film honest (adj.) telling the truth online (adj.) connected to or done through the internet","n.","1.1"],["uncomfortable","not pleasant; causing slight pain or worry","adj.","1.1"],["career","the work a person does for many years","n.","1.1"],["convenient","easy to use and saving time or effort","adj.","1.1"],["compare","to look at how things are similar or different","v.","1.1"],["website","a place on the internet with pages of information","n.","1.1"],["properly","in the correct or suitable way / 30 seconds · no preparation","adv.","1.1"],["roller coaster","a fast ride at a fair that goes up and down","n.","1.2"],["theme park","a large park with rides and attractions","n.","1.2"],["track","the rails a train or ride moves along","n.","1.2"],["excitement","the feeling of being very interested and happy","n.","1.2"],["unforgettable","so good or special that you never forget it","adj.","1.2"],["bench","a long seat for two or more people calmly (adv.) in a quiet, controlled way","n.","1.2"],["setting","the place where something happens","n.","1.2"],["extremely","to a very great degree","adv.","1.2"],["value","how useful or important something is","n.","1.2"],["trust","the belief that somebody is honest and reliable","n.","1.2"],["quality","how good or bad something is","n.","1.2"],["nature","plants, animals and everything not made by people","n.","1.2"],["choice","the act of deciding between two or more things","n.","1.2"],["genuinely","really; truly","adv.","1.2"],["energy","the strength you need to do things","n.","1.2"],["responsibility","a duty that you must take care of","n.","2"],["deadline","a time by which something must be finished","n.","2"],["stressful","causing worry and pressure","adj.","2"],["motivated","wanting to work hard to reach a goal","adj.","2"],["communication","the sharing of information between people","n.","2"],["experience","something that happens to you and teaches you","n.","2"],["completely","totally; in every way","adv.","2"],["responsible","having a duty to deal with something","adj.","2"],["individual","one single person","n.","2"],["l","already full and art examined subjects nuinely dislike art, reates stress needs materials, ist teachers","","3"],["creativity","the ability to produce original ideas","n.","3"],["solution","a way of solving a problem","n.","3"],["concentration","the ability to give full attention to something","n.","3"],["mathematics","the study of numbers and shapes","n.","3"],["argument","a reason given to support an opinion","n.","3"],["practical","useful and sensible in real life","adj.","3"],["university","a place where people study after school","n.","3"],["employer","a person or company that pays people to work","n.","3"],["pleasant","enjoyable and nice","adj.","3"],["resource","something useful that can be used","n.","3"],["in my opinion","used to give your personal view","phrase","3"],["concentrate","to give your full attention to one thing","v.","3"]]},{"p11":[{"q":"What do you like about living in your hometown?","a":"What I appreciate most is the sense of community. People here actually know their neighbours, and if something happens, everybody helps without being asked. It is also quite green, with a big park in the centre and mountains you can see from almost every street. Life is cheaper than in the capital and much less stressful. The only thing I miss is having more career opportunities, so some young people move away."},{"q":"Do you prefer mornings or evenings?","a":"I am much more of a morning person. My head is clearest in the first two or three hours after I wake up, so that is when I do anything difficult, like studying or writing. By the evening I am usually too tired to concentrate properly, and I only want something light — a series, a walk or a conversation with my family."},{"q":"Do you have a mobile phone?","a":"Yes, of course, and I honestly use it for almost everything. It is my alarm clock, my camera, my map and my way of paying in shops, so I would be lost without it. I use it mostly for messaging and for looking things up quickly. I do try to limit how long I spend on social media, though, because it is very easy to lose an hour without noticing."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two contrasting sides of city life. In the first picture, there is a busy street completely filled with cars and pedestrians. The traffic appears to have come to a standstill, and the buildings on both sides make the street look narrow and crowded. It seems that this is the centre of a large city during rush hour. In contrast, the second picture shows a quiet residential street with almost nobody on it. A single person is walking along the road, and the tall trees on both sides create a calm and shady atmosphere."},{"q":"Which street would you prefer to live on?","a":"I would definitely prefer the quiet street with the trees. The air would be cleaner, I could sleep with the window open, and I think I would simply feel less stressed every day. Green streets are also much better for children, because they can play outside safely. The busy street probably has more shops and better transport connections, which is convenient, but for me the noise and pollution would not be worth it."},{"q":"How does traffic on busy streets influence people's health?","a":"It affects health in several ways. The most direct one is air pollution, because exhaust fumes cause breathing problems and make conditions like asthma much worse, especially in children. Constant noise is another factor, since it disturbs sleep and raises stress levels over time. Busy roads are also dangerous, so accidents are more common. And indirectly, people walk and cycle less on such streets, which makes them less active overall."}],"p2":{"prompts":["Can you describe a time when you had to act courageously?","What do you think gives people the strength to face their fears?","How does society celebrate the act of courage?"],"a":"The time I had to act courageously was at high school, and it involved a classmate who was being bullied. He was a quiet boy who kept to himself, and a small group in our class thought it was funny to make jokes about him every day. For a long time I did nothing, like most of the class. I told myself it was not my business, but the honest reason was that I was afraid of becoming the next target. Then one afternoon it happened right in front of me: he was clearly close to tears and everyone else either laughed or looked away. Something changed in me at that moment, and I told them to stop. My voice was shaking, and for a few seconds nobody said anything at all. I think what gives people the strength to face their fears is usually a value that becomes stronger than the fear itself. In my case, the discomfort of watching something unfair finally became worse than the fear of what people would say. Preparation helps too: if you have thought in advance about how you would react, you act faster. And knowing that at least one other person supports you makes an enormous difference. Society celebrates courage in many ways, through medals, awards and national holidays for soldiers, firefighters and rescue workers. Films and books also tend to be about brave individuals. However, I think we celebrate dramatic, visible courage far more than everyday courage, such as speaking up in a meeting or reporting something dishonest at work, and that quiet kind is much more common."},"p3":{"topic":"Cultural heritage sites should be open to tourists","for":["visiting a site in person is what makes people care about preserving history","tourism boosts the local economy and creates jobs where there is little other work","ticket sales and tourist taxes fund the restoration work these buildings need"],"against":["large numbers of visitors physically damage fragile stone, walls and paintings","traffic, waste and new hotels change the landscape around the site","the focus can shift from heritage to profit, and the atmosphere is lost"],"a":"This is a question I find genuinely difficult, because both sides are trying to protect something valuable. The arguments in favour are practical and cultural at the same time. Opening these sites increases awareness of history: reading about an ancient city is one thing, but standing inside it is what makes people care about preserving it. Tourism also boosts the local economy enormously, creating jobs for guides, drivers, hotel staff and craftspeople in areas where there is often little other work. And, importantly, visitors provide funding for preservation itself. Ticket sales and tourist taxes are frequently the main source of money for the restoration work these buildings desperately need. On the other hand, the risks are serious. Large numbers of visitors physically damage fragile sites: stone steps wear away, walls get touched thousands of times a day, and humidity from crowds damages ancient paintings. There is an environmental impact as well, with traffic, waste and new hotels changing the landscape around the site. The most worrying danger, though, is that the focus shifts from heritage to profit. When a historic town becomes a shopping street full of souvenir stalls, it loses exactly the atmosphere people came to see. My own view is that these sites should stay open, but with proper management: limited daily numbers, booking in advance, and a clear rule that a fixed part of the income goes back into preservation."},"wd":[["community","the people who live in one area","n.","1.1"],["capital","the main city of a country","n.","1.1"],["stressful","causing worry and pressure","adj.","1.1"],["career","the work a person does for many years","n.","1.1"],["opportunity","a chance to do something good","n.","1.1"],["clearest","easiest to understand or think with","adj.","1.1"],["concentrate","to give your full attention to one thing","v.","1.1"],["properly","in the correct or suitable way","adv.","1.1"],["alarm clock","a clock that wakes you up","n.","1.1"],["limit","to keep something below a certain amount","v.","1.1"],["social media","websites where people share posts and photos / 30 seconds · no preparation","n.","1.1"],["contrasting","very different from each other","adj.","1.2"],["pedestrian","a person walking in the street","n.","1.2"],["come to a standstill","to stop moving completely","phrase","1.2"],["crowded","full of people","adj.","1.2"],["rush hour","the busiest time for traffic in a city","n.","1.2"],["residential","consisting mainly of houses, not shops shady (adj.) protected from the sun by trees or buildings","adj.","1.2"],["atmosphere","the general feeling of a place","n.","1.2"],["stressed","worried and unable to relax","adj.","1.2"],["transport","the system of moving people from place to place","n.","1.2"],["convenient","easy to use and saving time or effort","adj.","1.2"],["pollution","harmful substances that damage air or water","n.","1.2"],["especially","more than usual; particularly","adv.","1.2"],["factor","one of the things that affects a result common (adj.) happening often; usual","n.","1.2"],["cycle","to travel by bicycle","v.","1.2"],["involve","to include something as a necessary part","v.","2"],["classmate","a person in the same class as you","n.","2"],["reason","why something happens or is done","n.","2"],["clearly","in a way that is easy to see or understand","adv.","2"],["moment","a very short period of time","n.","2"],["difference","the way in which things are not the same","n.","2"],["society","people living together in an organised way","n.","2"],["courage","the ability to do something that frightens you","n.","2"],["individual","one single person","n.","2"],["celebrate","to do something enjoyable for a special occasion","v.","2"],["visible","able to be seen common (adj.) happening often; usual","adj.","2"],["rists","visitors physically one, walls and new hotels change und the site t from heritage to mosphere is lost","","3"],["genuinely","really; truly","adv.","3"],["valuable","very useful or worth a lot","adj.","3"],["argument","a reason given to support an opinion","n.","3"],["practical","useful and sensible in real life","adj.","3"],["awareness","knowing that something exists or is important","n.","3"],["preserve","to keep something in its original state","v.","3"],["visitor","a person who comes to see a place or person","n.","3"],["tourist","a person visiting a place on holiday","n.","3"],["on the other hand","used to introduce the opposite opinion","phrase","3"],["physically","with the body","adv.","3"],["landscape","the appearance of an area of countryside","n.","3"],["heritage","traditions and buildings passed down over time","n.","3"]]},{"p11":[{"q":"Do you like outdoor activities?","a":"Yes, I really enjoy them, mainly because they help me clear my head. My favourite is hiking, so I go to the hills near my city whenever I have a free Sunday. I also like cycling and simply walking in the park in the evening. I think being outside changes my mood completely, especially after several days of sitting in front of a screen. In winter I do less, unfortunately, but I still try to walk every day."},{"q":"What kinds of public transport do you have in your country?","a":"We have quite a good range of options. In the cities there are buses, minibuses and trolleybuses, and the capital also has an underground system which is fast, cheap and very beautiful, because some of the stations look like museums. Between cities we have trains, including a high-speed one that connects the main cities in a few hours. Taxis are everywhere too, and they are much cheaper than in most European countries."},{"q":"Which room in your home do you spend the most time in?","a":"Without a doubt the kitchen. It is the warmest room in the flat, and somehow everybody ends up there — we cook, eat and talk about the day around the same table. I even study there sometimes, because I like having people around me while I work. The living room is more comfortable, but the kitchen is where things actually happen."}],"p12":[{"q":"What do you see in these pictures?","a":"In these pictures, I can see two different ways of travelling around a city. In the first picture, there are two cyclists riding along a road together. They are wearing helmets and casual clothes, and they appear to be enjoying the fresh air and the exercise. It seems that they have chosen a healthy and environmentally friendly way of getting around. In contrast, the second picture shows a wide city avenue full of cars and yellow taxis. The vehicles are moving slowly between tall buildings, which suggests heavy traffic. It seems that many drivers still rely on private cars despite the congestion."},{"q":"Which transport do you think is better for short distances?","a":"For short distances I think a bicycle is much better. In a city centre you avoid traffic jams completely, you never have to look for a parking space, and the journey is often faster door to door. It is also free, healthy and produces no pollution at all. The main problems are safety, since many cities do not have proper cycle lanes, and bad weather, so a car is more practical in winter or heavy rain."},{"q":"How do transportation choices impact the environment?","a":"The impact is very significant, because transport is one of the largest sources of carbon emissions worldwide. Private cars are the worst option, as one car often carries only one person. Buses and trains are far more efficient, since they move dozens of people at once. Walking and cycling produce no emissions at all. So if more people switched to public transport for daily journeys, air quality in cities would improve noticeably within a few years."}],"p2":{"prompts":["Can you describe a situation where you had to manage your time efficiently?","Why do you think time management is such a valuable skill?","How can schools and workplaces promote better time management practices?"],"a":"The situation that comes to mind immediately was my final year at university. I had four assignments, two exams and a group project, and all of them were due within the same three weeks. At first I felt completely overwhelmed and I kept switching between tasks without finishing anything. Then I sat down and made a detailed plan. I wrote every task on paper, broke the big ones into smaller steps and gave each step a specific day. I also decided to do the hardest work in the morning, when my concentration is best, and to keep the evenings for reading and revision. I turned off notifications on my phone while I worked, which was surprisingly difficult but made a real difference. In the end I submitted everything on time and I did not have to spend a single night without sleep. I think time management is so valuable because it directly reduces stress. Most people are not short of hours; they simply use them badly, and the anxiety comes from not knowing what to do next. Good planning also improves quality, because work done calmly is always better than work done in a panic at the last minute. And it protects your free time, which matters just as much. Schools and workplaces could help a great deal. Schools should teach planning as a real skill rather than assuming students already have it, and teachers could avoid setting five deadlines in the same week. In workplaces, managers can set clear priorities instead of saying that everything is urgent, and they should respect people's working hours so that employees can actually switch off."},"p3":{"topic":"Year-round schooling is better for students","for":["it prevents summer learning loss, so teachers spend less time revising","shorter, more frequent holidays keep students engaged consistently","it makes life easier for working parents who must pay for childcare"],"against":["students need a long break to rest properly and let the brain switch off","without it, both students and teachers risk stress and burnout","children lose summer camps, family trips, holiday jobs and free time"],"a":"This system already exists in some countries, and the evidence on both sides is quite interesting. Those who support year-round schooling point first to summer learning loss. Research shows that after a long break of two or three months, many students, especially younger ones, forget a significant part of what they learned, and teachers spend weeks revising. Shorter, more frequent holidays would keep students engaged consistently, so learning would be steadier. There is also a practical social argument: long summer holidays are difficult for working parents, who have to find and pay for childcare for months, and a year-round calendar would make family life considerably easier. The arguments against are mainly about wellbeing. Students need proper time to rest and recharge, and a two-week break is not the same as a long summer when the brain genuinely switches off. Without that, both students and teachers face a higher risk of stress and burnout. There is also the question of what children lose outside the classroom: summer camps, long family trips, holiday jobs and simply free unstructured time are all valuable, and many young people learn independence exactly during those weeks. Personally, I think the best solution is a compromise. I would shorten the summer holiday rather than remove it, and add extra short breaks during the year, because that would reduce learning loss without taking away the rest that students genuinely need. CAMBRIDGE SCHOOL — NATIJAGA ISHLAYDIGAN MAKTAB IELTS 9.0 gacha tajribali ustozlar; Har yili ko‘plab yuqori natijalar; O‘quvchilar uchun avtobus xizmati; 5 mahal to‘liq va sog‘lom ovqatlanish; O‘rganish, yashash va rivojlanish uchun mukammal joy Har bir o‘quvchi ustidan doimiy nazorat; Qulay va xavfsiz yotoqxona. BOG‘LANISH UCHUN +998 90 778 50 00 +998 90 163 40 00 Farg‘ona viloyati, Rishton tumani Telegram: t.me/MultiLevelRecord CAMBRIDGE SCHOOL · RISHTON · @MultiLevelRecord"},"wd":[["cycle","to travel by bicycle","v.","1.1"],["completely","totally; in every way","adv.","1.1"],["especially","more than usual; particularly","adv.","1.1"],["screen","the flat part of a device that shows text or pictures","n.","1.1"],["range","a number of different things of the same type","n.","1.1"],["option","one of the things you can choose","n.","1.1"],["capital","the main city of a country","n.","1.1"],["underground","a railway system under a city","n.","1.1"],["high-speed","travelling or working very fast","adj.","1.1"],["without a doubt","used to say you are completely certain","phrase","1.1"],["somehow","in a way you cannot explain end up (phr. v.) to be in a place or situation you did not plan","adv.","1.1"],["living room","the main room where a family sits together / 30 seconds · no preparation","n.","1.1"],["cyclist","a person who rides a bicycle","n.","1.2"],["helmet","a hard hat that protects your head casual (adj.) comfortable and not formal","n.","1.2"],["environmentally friendly","causing little or no harm to nature","adj.","1.2"],["get around","to travel from place to place","phr. v.","1.2"],["avenue","a wide street in a town or city","n.","1.2"],["vehicle","a machine such as a car or bus that carries people","n.","1.2"],["congestion","a situation in which roads are too full of traffic","n.","1.2"],["bicycle","a two-wheeled vehicle you ride by pedalling","n.","1.2"],["traffic jam","a long line of vehicles that cannot move","n.","1.2"],["pollution","harmful substances that damage air or water","n.","1.2"],["practical","useful and sensible in real life","adj.","1.2"],["significant","large or important enough to notice","adj.","1.2"],["transport","the system of moving people from place to place","n.","1.2"],["efficient","working well without wasting time or energy","adj.","1.2"],["produce","food grown on a farm or in a garden","n.","1.2"],["public transport","buses and trains used by everyone","n.","1.2"],["situation","the things that are happening at a certain time","n.","2"],["university","a place where people study after school","n.","2"],["assignment","a piece of work given to a student","n.","2"],["overwhelm","to affect someone so strongly they cannot cope","v.","2"],["concentration","the ability to give full attention to something","n.","2"],["surprisingly","in a way you did not expect","adv.","2"],["difference","the way in which things are not the same free time (phrase) time when you are not working","n.","2"],["workplace","the place where a person works","n.","2"],["deadline","a time by which something must be finished","n.","2"],["switch off","to stop using something; to stop and relax","phr. v.","2"],["s","ng break to rest he brain switch off udents and teachers rnout mer camps, family and free time","","3"],["consistently","in the same way every time","adv.","3"],["argument","a reason given to support an opinion proper (adj.) right and suitable for a purpose","n.","3"],["recharge","to get your energy back after resting","v.","3"],["genuinely","really; truly","adv.","3"],["classroom","a room where lessons take place","n.","3"],["valuable","very useful or worth a lot","adj.","3"],["solution","a way of solving a problem","n.","3"]]}],"i":[{"title":"Advertising","groups":[{"h":"Positives of Advertising","items":["Advertising is a key part of modern business.","Companies need to tell customers about their products.","Advertisements inform us about the choices we have.","Advertising is a creative industry that employs many people.","Without advertising we would have less choice.","Without advertising there would be higher unemployment.","Advertising is a form of modern art.","People enjoy adverts."]},{"h":"Negatives of Advertising","items":["Advertising manipulates people.","It aims to persuade people that buying a product will make them happier.","Advertisers focus on selling a brand image.","They use glamorous, successful people.","We now live in a consumer culture.","We are persuaded to follow the latest trends.","We are encouraged to associate certain brands with a higher status.","Advertisers often aim their marketing at children.","Children can easily be influenced by advertisements.","Children put pressure on parents to buy them things."]},{"h":"Opinions about Advertising","items":["Advertising should be regulated.","Advertising aimed at children should be controlled or even banned.","Unhealthy foods should not be marketed in a way that attracts children.","Products that can be a risk to health should display warnings.","In some countries it is illegal to advertise cigarettes on television."]},{"h":"ielts-simon.com","items":["Warnings must be displayed on cigarette packets.","However, advertising is necessary in free market economies.","It creates demand for products.","Governments should only censor false information or products that are harmful."]}],"wd":[["manipulate","aldamoq, ta'sir o'tkazmoq"],["brand image","brend imidji"],["consumer culture","iste'molchilik madaniyati"],["regulate","tartibga solmoq"],["persuade","ishontirmoq"],["demand","talab"]]},{"title":"Animal Rights","groups":[{"h":"Arguments for Animal Testing","items":["Animals are used in important scientific research.","It is necessary to do medical tests on new drugs.","Animal testing helps to advance medical and scientific knowledge.","Many important medical discoveries involved experimentation on animals.","Researchers aim to minimise the suffering that animals experience.","Testing for the cosmetics industry is now banned in many countries."]},{"h":"Arguments against Animal Testing","items":["The benefits of research using animals do not justify the suffering caused.","There are alternative methods of research.","The lives of animals should be respected.","Humans have no moral right to do experiments on animals."]},{"h":"Arguments for Vegetarianism","items":["Vegetarians do not eat foods that are produced by killing animals.","Many people choose a vegetarian diet for moral or health reasons.","A healthy diet is possible without eating meat.","It is unnecessary to kill animals for food.","A vegetarian diet may reduce the risk of diseases like cancer.","Many people question the treatment of animals in factory farms."]},{"h":"ielts-simon.com","items":[]},{"h":"Arguments against Vegetarianism","items":["Vegetarians do not eat a balanced diet.","In many cultures, meat is the main ingredient in traditional meals.","Meat-eaters argue that animals are below humans in the food chain.","It is completely natural for us to kill them for food.","Our aim should be to improve farming methods.","Farms should produce organic food."]},{"h":"Positives of Zoos","items":["Zoos play an important role in wildlife conservation.","They can help to protect endangered species.","Zoos allow scientists to study animals and their behaviour.","Zoos are educational, interesting and fun.","Children, in particular, enjoy learning about animals.","Zoos provide job opportunities."]},{"h":"Negatives of Zoos","items":["Zoo animals are kept in artificial environments.","They are kept in cages or have limited space.","Zoo animals rely on humans.","They lose the freedom to hunt for food.","The best way to save endangered species is by protecting natural habitats.","Some people believe that zoos are unethical.","Zoos exhibit animals with the aim of making money.","We have no right to use animals for entertainment and profit."]},{"h":"ielts-simon.com","items":[]}],"wd":[["animal testing","hayvonlarda sinov"],["endangered species","yo'qolish xavfidagi turlar"],["conservation","tabiatni muhofaza qilish"],["vegetarianism","vegetarianlik"],["unethical","axloqsiz"],["habitat","yashash muhiti"]]},{"title":"Cities","groups":[{"h":"Reasons for Urbanisation","items":["People move to cities in search of job opportunities.","Cities offer greater employment possibilities and a higher standard of living.","People migrate to cities from the countryside.","Traditional activities like farming need fewer workers nowadays."]},{"h":"Negatives of City Life","items":["Life in cities has its drawbacks.","The cost of living is higher than in rural areas.","Some people do not manage to find work.","Housing is usually much more expensive.","Homelessness and poverty are common in cities.","There is a gap between the rich and poor.","Life in cities can be extremely stressful.","There are problems like traffic congestion and crime.","Cities lack a sense of community.","People do not even know their neighbours.","Cities are sometimes described as “concrete jungles”."]},{"h":"Pedestrian Areas","items":["Pedestrian zones in city centres can improve the local environment.","Banning cars encourages people to walk or cycle.","Many European cities have built bicycle lanes.","Dependence on cars is linked to health problems like obesity.","People who walk or cycle regularly are generally healthier.","Pedestrian areas are safer and more attractive for both residents and tourists."]},{"h":"ielts-simon.com","items":[]}],"wd":[["urbanisation","urbanizatsiya"],["cost of living","yashash xarajatlari"],["traffic congestion","tirbandlik"],["homelessness","uysizlik"],["pedestrian zone","piyodalar zonasi"],["sense of community","jamoa hissi"]]},{"title":"Crime","groups":[{"h":"Police and Crime Prevention","items":["The job of the police is to catch criminals.","They must also prevent crime and make communities safer.","There should be an increase in the number of police officers on the streets.","Police officers should be seen as part of the community.","They should be involved with education and prevention.","The police should be in close contact with schools.","They should focus on young people who have dropped out of school.","These teenagers may become involved with gangs."]},{"h":"Punishments / Prisons","items":["Fines are used as punishment for minor crimes.","If the crime is more serious, prison is the most common punishment.","Some criminals pose a threat to society.","They are put in prison to ensure the safety of other citizens."]},{"h":"Negatives of Prisons","items":["Criminals are put together.","They make friends with other offenders.","Many prisoners re-offend when they are released.","A criminal record makes finding a job more difficult."]},{"h":"Rehabilitation","items":["Another aim of prisons is rehabilitation.","Prisoners receive education or vocational training.","Prisoners should learn personal skills and specific job skills.","Punishment could make prisoners’ behaviour worse.","Rehabilitation aims to make them better citizens.","Rehabilitated prisoners are less likely to re-offend."]},{"h":"ielts-simon.com","items":[]},{"h":"Capital Punishment","items":["Supporters say that capital punishment deters crime.","Fear of the death penalty stops people from committing offences.","The death penalty shows that crime is not tolerated.","It is a form of revenge.","The cost of imprisonment is avoided.","The offender cannot pose a threat to others."]},{"h":"Against Capital Punishment","items":["Innocent people could be wrongly convicted and executed.","Crime rates are not necessarily reduced.","Many criminals do not think they will be caught.","Capital punishment is not a good deterrent.","Executing prisoners creates a violent culture and encourages revenge.","We have no right to take another human life."]},{"h":"Community Service","items":["Community service is a way to reform offenders.","It could be a solution to prison overcrowding.","It avoids the cost of imprisonment.","It makes offenders useful in their local communities.","They are required to clean streets or talk to school groups.","Offenders repay their community.","They avoid the negative influence that prison can have."]},{"h":"Against Community Service","items":["Community service is not a sufficient punishment.","Criminals should be locked up, away from their victims."]},{"h":"Crime in the Media","items":["Crime is one of the main subjects of most news programmes."]},{"h":"ielts-simon.com","items":["The mass media focus on violent and sensational crimes.","This leads to fear of crime among the public.","Sensational stories attract more viewers or readers.","The media report crime stories in order to increase their audience."]}],"wd":[["rehabilitation","reabilitatsiya"],["re-offend","qayta jinoyat sodir etmoq"],["capital punishment","o'lim jazosi"],["deter","qo'rqitib qaytarmoq"],["community service","jamoat ishlari"],["criminal record","sudlanganlik tarixi"]]},{"title":"Education","groups":[{"h":"Benefits of Education","items":["Education gives people knowledge and skills.","People with qualifications are more likely to find work.","They can earn a higher salary.","They can contribute positively to society.","Schools aim to teach young people moral values such as tolerance and sharing.","Schools prepare children to be members of a society."]},{"h":"Benefits of Studying Abroad","items":["Foreign institutions may offer better courses.","Many students want to attend a prestigious university.","The best universities employ teachers who are experts in their fields.","Qualifications gained abroad can open the door to better job opportunities.","Living abroad can broaden students’ horizons.","Overseas students are exposed to different cultures and customs.","They become more independent.","They are responsible for cooking, cleaning and paying bills.","They will learn a foreign language."]},{"h":"Drawbacks of Studying Abroad","items":["Living and studying abroad can be difficult.","Students have problems with paperwork such as visa applications."]},{"h":"ielts-simon.com","items":["The language barrier can be a problem.","Students have to find accommodation and pay bills.","Studying in a foreign language is challenging.","Living alone in an unfamiliar culture can cause homesickness."]},{"h":"Technology in Education: Advantages","items":["Technology is a powerful tool to engage students.","Technology can make lessons much more interesting.","Students can do research using online resources.","Students can study at their own pace.","Adults can take distance learning courses.","Students can study whenever and wherever they want.","Students also learn skills which are useful for their future jobs.","For example, they learn to write reports using a word processor."]},{"h":"Technology in Education: Disadvantages","items":["People rely too much on computers.","Young learners do not become proficient in some basic skills.","They use word processors with spell-checkers.","Their handwriting and spelling may suffer.","People should be able to write a letter by hand.","Technology is no substitute for a real teacher.","Learners need a structured course.","An experienced teacher knows what materials to choose.","Computers are expensive to maintain and can be unreliable."]},{"h":"Technology in Education: Opinion","items":["Institutions should supplement traditional teaching with the use of technology.","Technology is part of everyday life.","It can enhance a teacher’s lessons.","Students can use online resources to help with homework."]},{"h":"ielts-simon.com","items":["Students must still learn to write by hand.","They should still use traditional sources of information such as books."]},{"h":"Education in Developing Countries: Problems","items":["Children often have to work from an early age.","There are no schools in many areas.","Families do not have access to books or computers.","Literacy rates are often low.","People in developing countries need knowledge and skills.","Education is the key to improving the economy of these countries."]},{"h":"Education in Developing Countries: Solutions","items":["Developed countries could help developing nations by providing money.","They could invest in schools and technology.","They could supply the funds to build schools and pay for teachers.","Children need to have access to free schooling.","Computer equipment could be donated.","The Internet can expose students to a world of knowledge and information.","Governments should make education compulsory for all children.","They should encourage parents to send their children to school.","Governments of developed and developing countries must work together."]},{"h":"Higher Education: Advantages (also see “Benefits of Education”)","items":["There are many benefits to going to university.","A degree can open the door to better employment prospects.","Economies are becoming increasingly knowledge-based.","Most jobs require specific knowledge and skills.","Skilled workers are needed for sectors such as information technology and engineering.","Repetitive manual jobs are now done by machines.","Many factories have moved to developing countries."]},{"h":"ielts-simon.com","items":[]},{"h":"Higher Education: Disadvantages","items":["A healthy economy needs a wide range of workers.","Some manual workers will always be needed.","A university degree is not necessary for many service professions.","Practical training is more important in some industries.","In the UK, for example, there is currently a shortage of plumbers.","Their services are therefore becoming more and more expensive."]},{"h":"Advantages of Home-Schooling","items":["Some parents decide to educate their children at home.","Some families live in isolated areas with poor transport.","Other parents are not satisfied with local schools.","Parents can respond to what their children need and how they learn best.","One-to-one lessons allow much faster progress.","The child can work at his or her own pace.","Discipline problems are avoided by home-schooling."]},{"h":"Disadvantages of Home-Schooling","items":["Most parents do not have the time to educate their children at home.","One parent would need to give up work.","School subjects are normally taught by up to ten different teachers.","Most parents do not have the necessary knowledge or resources.","Private tutors are expensive.","Children will miss out on the social experience that school offers.","At school, children learn how to get on with each other.","Home-schooled children may lack social skills.","Schools offer a better overall educational experience."]},{"h":"Bad Behaviour in Schools: Causes","items":["Bad behaviour is due to a lack of structure and discipline.","There are too many children in some classes."]},{"h":"ielts-simon.com","items":["Large classes are difficult to manage.","Many disruptive students come from an unstable family background.","Other parents are too lenient and spoil their children.","Some children are used to getting whatever they want.","Schools can do very little if they are not supported by parents."]},{"h":"Bad Behaviour in Schools: Solutions","items":["Schools need a clear code of conduct.","Schools need a clear set of rules about behaviour.","They need to create a positive working atmosphere.","Teachers must have the power to punish disruptive students.","Schools should remove difficult children from lessons.","Schools need to work closely with parents.","Discipline could be lacking at home.","Parents must support the school rules.","They should take responsibility for their children’s behaviour."]},{"h":"Corporal Punishment: Opinion","items":["Corporal Punishment is not a good idea.","Physical punishment is a way of controlling children using fear.","This does not promote trust between adults and children.","Children who are punished physically may become shy or resentful.","Corporal punishment creates an atmosphere of fear and anger."]},{"h":"Single Sex Education: Advantages","items":["Some people believe that male and female students should go to separate schools.","This is often for religious or cultural reasons.","Discipline problems might be avoided by separating boys and girls.","Boys and girls may learn in different ways and have different needs.","Students at single-sex schools often get better exam grades."]},{"h":"ielts-simon.com","items":[]},{"h":"Single-Sex Education: Disadvantages","items":["Separating boys and girls is unnecessary.","It is unhealthy in terms of children’s social development.","Many coeducational schools are extremely successful.","A mixed-sex environment is more representative of real life.","Coeducational schools provide children with better social skills for adult life."]},{"h":"Advantages of Streaming (grouping children according to ability)","items":["Some schools separate students according to their academic ability.","Teachers can work at the right speed for their students.","Teachers can plan more suitable lessons.","High-level groups may progress faster.","Lower level groups can benefit from a slower pace.","Some teachers and parents support streaming for these reasons."]},{"h":"Disadvantages of Streaming","items":["Grouping by ability may have a negative impact on students.","Children do not want to be seen as less intelligent than others.","Streaming could damage students’ self esteem.","They may lose motivation.","Students from wealthier families tend to be better prepared.","Children from poorer families may receive less support from parents.","Mixed ability classes encourage everyone to achieve their potential."]},{"h":"ielts-simon.com","items":[]}],"wd":[["qualification","malaka, diplom"],["distance learning","masofaviy o'qish"],["literacy rate","savodxonlik darajasi"],["home-schooling","uyda o'qitish"],["streaming","o'quvchilarni qobiliyatiga ko'ra guruhlash"],["corporal punishment","jismoniy jazo"]]},{"title":"Environment","groups":[{"h":"Global Warming","items":["Gases such as carbon dioxide trap heat from the sun.","This causes global temperatures to rise.","This process is known as the greenhouse effect.","Human activity is a major factor in the rise of the greenhouse gases.","Factories and vehicles produce emissions and exhaust fumes.","Many developing countries are becoming industrialised.","The number of cars on our streets is growing.","Cheap air travel is allowing more people to fly."]},{"h":"Effects of Global Warming","items":["Global warming will have a significant impact on our planet.","Rising temperatures will cause melting of the polar ice caps.","Sea levels will rise.","We can expect more extreme weather conditions.","Flooding and droughts may become more common."]},{"h":"Impact of Humans on the Environment","items":["The increasing world population is putting pressure on natural resources.","Fossil fuels like oil and gas are running out.","We are destroying wildlife habitats.","We have cut down enormous areas of rainforest.","This has led to the extinction of many species of animals and plants."]},{"h":"Solutions to Environment Problems","items":["Governments could introduce laws to limit emissions from factories.","They should invest in renewable energy from solar, wind or water power.","They could impose “green taxes” on drivers and airline companies.","Government campaigns should promote recycling."]},{"h":"ielts-simon.com","items":["Natural areas and wild animals should be protected.","Individuals should also try to be greener.","We should take fewer flights abroad for holidays.","We should take public transport rather than driving.","We should choose products with less packaging.","We should recycle as much as possible."]},{"h":"Waste / Rubbish","items":["The amount of waste we produce has increased.","This problem is a result of our consumer culture.","Products are not made to last.","If something breaks, we throw it away and buy a new one.","Advertisers encourage us to buy the newest fashions.","Packaging is an important part of selling.","Most foods are sold in non-biodegradable plastic packaging.","The amount of household waste is growing.","This
